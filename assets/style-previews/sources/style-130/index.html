<script src="gsap.min.js"></script>
<script src="DrawSVGPlugin.min.js"></script>
<script id="manuscript-scene">
/* Illuminated Manuscript preview — purple-vellum page. All ornament is built deterministically
   (no randomness) and every visual change is a tween on one paused GSAP timeline. */
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var C = { page: "#3A2340", cream: "#EFE4C8", ink: "#352D27", gold: "#B89B51", red: "#A5433C", blue: "#3C5487", green: "#66825D" };
  gsap.registerPlugin(DrawSVGPlugin);

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function f1(n) { return Math.round(n * 10) / 10; }
  function $(id) { return document.getElementById(id); }

  var tl = gsap.timeline({ paused: true });
  function draw(target, start, dur, ease) {
    tl.fromTo(target, { drawSVG: "0% 0%" }, { drawSVG: "0% 100%", duration: dur, ease: ease || "power2.inOut", immediateRender: true }, start);
  }
  function fillIn(target, start, dur) {
    tl.fromTo(target, { fillOpacity: 0 }, { fillOpacity: 1, duration: dur, ease: "sine.inOut", immediateRender: true }, start);
  }
  function show(target, start, dur) {
    tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration: dur, ease: "sine.inOut", immediateRender: true }, start);
  }
  function leafPath(len, w) {
    return "M0 0Q" + f1(len * 0.45) + " " + (-w) + " " + len + " 0Q" + f1(len * 0.45) + " " + w + " 0 0Z";
  }

  /* ---------------- Vine border (0.6–1.65 s) ---------------- */
  var border = $("border");
  var bars = el("g", {}, border);
  var outerBar = el("path", { d: "M20 20H1260V700H20Z", fill: "none", stroke: C.blue, "stroke-width": 6 }, bars);
  var outerHair = el("path", { d: "M27 27H1253V693H27Z", fill: "none", stroke: C.gold, "stroke-width": 1.8 }, bars);
  var outerHair2 = el("path", { d: "M13 13H1267V707H13Z", fill: "none", stroke: C.gold, "stroke-width": 1.2 }, bars);
  var innerRule = el("path", { d: "M68 68H1212V652H68Z", fill: "none", stroke: C.gold, "stroke-opacity": 0.75, "stroke-width": 1.6 }, bars);
  draw(outerBar, 0.6, 0.85, "none");
  draw([outerHair, outerHair2], 0.66, 0.85, "none");
  draw(innerRule, 0.72, 0.85, "none");

  var corners = [[44, 44], [1236, 44], [1236, 676], [44, 676]];
  var A = 7, CORNER = 24;
  var vineG = el("g", {}, border), leafG = el("g", {}, border), bossG = el("g", {}, border);
  var sideStart = [0.6, 0.72, 0.84, 0.96], sideDur = 0.45;

  for (var i = 0; i < 4; i++) {
    var p0 = corners[i], p1 = corners[(i + 1) % 4];
    var dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy);
    var tx = dx / L, ty = dy / L, nx = -ty, ny = tx;
    var usable = L - 2 * CORNER, k = Math.round(usable / 92), P = usable / k;
    var d = "";
    for (var s = 0; s <= usable + 0.01; s += 4) {
      var off = A * Math.sin(2 * Math.PI * s / P);
      d += (s === 0 ? "M" : "L") + f1(p0[0] + tx * (CORNER + s) + nx * off) + " " + f1(p0[1] + ty * (CORNER + s) + ny * off);
    }
    // chrysographic gold contour under the inked green stem (reads on dark vellum)
    var stemG = el("path", { d: d, fill: "none", stroke: C.gold, "stroke-opacity": 0.7, "stroke-width": 6 }, vineG);
    var stemO = el("path", { d: d, fill: "none", stroke: C.ink, "stroke-width": 4 }, vineG);
    var stemI = el("path", { d: d, fill: "none", stroke: C.green, "stroke-width": 2 }, vineG);
    var st = sideStart[i];
    draw([stemG, stemO, stemI], st, sideDur, "none");

    var bx = p0[0], by = p0[1];
    var boss = el("path", { d: "M" + bx + " " + (by - 17) + "L" + (bx + 17) + " " + by + "L" + bx + " " + (by + 17) + "L" + (bx - 17) + " " + by + "Z",
      fill: C.gold, stroke: C.cream, "stroke-width": 1.6, "class": "gilt", style: "fill-opacity:0" }, bossG);
    var bossIn = el("circle", { cx: bx, cy: by, r: 7, fill: i % 2 ? C.blue : C.red, stroke: C.ink, "stroke-width": 1.5, style: "fill-opacity:0" }, bossG);
    draw(boss, st - 0.06, 0.12);
    draw(bossIn, st - 0.02, 0.1);
    fillIn([boss, bossIn], st + 0.06, 0.1);

    for (var j = 0; j < k * 2; j++) {
      var crest = j % 2 === 0, sign = crest ? 1 : -1;
      var sc = P * (j / 2 + 0.25);
      var cx = p0[0] + tx * (CORNER + sc) + nx * A * sign, cy = p0[1] + ty * (CORNER + sc) + ny * A * sign;
      var ang = Math.atan2(ty * 0.6 + ny * 0.8 * sign, tx * 0.6 + nx * 0.8 * sign) * 180 / Math.PI;
      var t0 = st + sideDur * (sc / usable);
      var g = el("g", { transform: "translate(" + f1(cx) + " " + f1(cy) + ") rotate(" + f1(ang) + ")" }, leafG);
      var kind = crest ? "leaf" : (j % 4 === 1 ? "flower" : "blue");
      var parts;
      if (kind === "flower") {
        parts = [
          el("path", { d: "M2 0a5 5 0 1 1 8 -6a5 5 0 1 1 6 8a5 5 0 1 1 -14 -2Z", fill: C.red, stroke: C.gold, "stroke-width": 1.3, style: "fill-opacity:0" }, g),
          el("circle", { cx: 8, cy: 0, r: 2.6, fill: C.cream, stroke: C.ink, "stroke-width": 1, style: "fill-opacity:0" }, g)
        ];
      } else {
        parts = [
          el("path", { d: leafPath(crest ? 17 : 14, crest ? 7 : 6), fill: crest ? C.green : C.blue, stroke: C.gold, "stroke-width": 1.3, style: "fill-opacity:0" }, g),
          el("path", { d: "M2 0L" + (crest ? 13 : 10) + " 0", fill: "none", stroke: C.ink, "stroke-opacity": 0.7, "stroke-width": 0.9 }, g)
        ];
      }
      draw(parts, t0, 0.12, "sine.inOut");
      fillIn(parts[0], t0 + 0.1, 0.1);
      if (kind === "flower") fillIn(parts[1], t0 + 0.12, 0.08);
    }
    var bz = el("circle", { cx: f1(p0[0] + tx * L / 2 - nx * 13), cy: f1(p0[1] + ty * L / 2 - ny * 13), r: 3.2, fill: C.gold, "class": "gilt", style: "opacity:0" }, bossG);
    show(bz, st + sideDur * 0.5, 0.1);
  }

  /* ---------------- Decorated initial (0–0.9 s) ---------------- */
  draw(["#if-outer", "#if-inner"], 0, 0.3, "power2.inOut");
  fillIn("#if-ground", 0.3, 0.15);            // box ground laid once its outline is closed
  show("#initial-art", 0.3, 0.02);            // interior only after #initial-frame is complete
  var fil = $("if-filigree");
  var filEls = [
    "M132 140c0-10 14-10 14 0s-8 6-8 0", "M264 140c0-10-14-10-14 0s8 6 8 0",
    "M132 240c0 10 14 10 14 0s-8-6-8 0", "M264 238c0 10-14 10-14 0s8-6 8 0",
    "M146 150q10 20 2 44", "M252 150q-6 18 0 36", "M142 202q-6 16 2 30"
  ].map(function (dd) { return el("path", { d: dd }, fil); });
  var il = $("if-interlace");
  var knotA = "M168 246c0-14 40-14 40 0s-40 14-40 0", knotB = "M188 232c14 0 14 28 0 28s-14-28 0-28";
  var kOut = [el("path", { d: knotA, stroke: C.ink, "stroke-width": 6 }, il), el("path", { d: knotB, stroke: C.ink, "stroke-width": 6 }, il)];
  var kIn = [el("path", { d: knotA, stroke: C.red, "stroke-width": 3 }, il), el("path", { d: knotB, stroke: C.cream, "stroke-width": 3 }, il)];
  var tend = el("path", { d: "M193 113c-4-6 6-10 10-4", stroke: C.cream, "stroke-width": 2 }, il);
  draw("#if-rule", 0.32, 0.28);
  draw("#if-letter", 0.36, 0.36, "power2.inOut");
  draw("#if-letter-hl", 0.52, 0.18);
  draw(filEls, 0.4, 0.3);
  draw(kOut, 0.42, 0.3);
  draw(kIn, 0.46, 0.3);
  draw(tend, 0.6, 0.12);
  fillIn("#if-band", 0.66, 0.2);
  fillIn("#if-letter", 0.7, 0.2);

  /* ---------------- Text column (standalone heading/copy timing) ---------------- */
  function rise(sel, at, extra) {
    var to = { opacity: 1, y: 0, duration: 0.35, ease: "power2.inOut", immediateRender: true };
    for (var q in extra) to[q] = extra[q];
    tl.fromTo(sel, { opacity: 0, y: 8 }, to, at);
  }
  rise("#t-head", 0.55);
  rise("#t-sub", 0.75);
  rise(".verse", 0.95, { stagger: 0.14 });
  rise("#t-rubric", 1.4);
  tl.fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut", stagger: 0.1, immediateRender: true }, 1.55);

  /* ---------------- Miniature (1.2–2.22 s) ---------------- */
  var mfc = $("mf-corners"), cornerEls = [];
  [[707, 107], [1143, 107], [1143, 613], [707, 613]].forEach(function (c, n) {
    cornerEls.push(el("path", { d: "M" + c[0] + " " + (c[1] - 10) + "a5 5 0 0 1 0 10a5 5 0 0 1 0 -10Z" +
      "M" + (c[0] - 10) + " " + c[1] + "a5 5 0 0 1 10 0a5 5 0 0 1 -10 0Z" +
      "M" + c[0] + " " + (c[1] + 10) + "a5 5 0 0 1 0 -10a5 5 0 0 1 0 10Z" +
      "M" + (c[0] + 10) + " " + c[1] + "a5 5 0 0 1 -10 0a5 5 0 0 1 10 0Z",
      fill: n % 2 ? C.blue : C.red, stroke: C.ink, "stroke-width": 1.4, style: "fill-opacity:0" }, mfc));
  });
  draw("#mf-outer", 1.2, 0.4);
  draw("#mf-inner", 1.28, 0.4);
  draw("#mf-rule", 1.4, 0.32);
  fillIn("#mf-band", 1.56, 0.16);
  draw(cornerEls, 1.6, 0.12);
  fillIn(cornerEls, 1.68, 0.1);
