<script>
(function () {
  'use strict';
  // ---------- Centralised tokens ----------
  const STYLE_ID = 'style-022'; // Pencil Drawing
  window.__styleId = STYLE_ID;
  const W = 1280, H = 720, DURATION = 3;
  // Scene palette (monochrome graphite on cool bristol paper; refresh away from warm paper).
  const PAL = { paper: chroma('#ECEEF0').hex(), graphite: chroma('#383838').hex() };
  const CONTRAST = chroma.contrast(PAL.graphite, PAL.paper); // ~10.1 : 1 for opaque text
  document.getElementById('video').setAttribute('data-text-contrast', CONTRAST.toFixed(2));
  const INK = chroma(PAL.graphite).rgb();
  const ink = (a) => 'rgba(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ',' + a.toFixed(3) + ')';

  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // ---------- Paper substrate (static, built once) ----------
  function buildPaper() {
    const c = document.getElementById('paper');
    const g = c.getContext('2d');
    const rnd = mulberry32(2207);
    const base = chroma(PAL.paper).rgb();
    // low-frequency mottling lattice
    const CELL = 48, gw = Math.ceil(W / CELL) + 2, gh = Math.ceil(H / CELL) + 2;
    const lat = new Float32Array(gw * gh);
    for (let i = 0; i < lat.length; i++) lat[i] = rnd() * 2 - 1;
    const img = g.createImageData(W, H);
    const d = img.data;
    let fiber = 0;
    for (let y = 0; y < H; y++) {
      fiber = 0;
      for (let x = 0; x < W; x++) {
        const fx = x / CELL, fy = y / CELL, ix = Math.floor(fx), iy = Math.floor(fy);
        const tx = fx - ix, ty = fy - iy;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const a = lat[iy * gw + ix], b = lat[iy * gw + ix + 1], cc = lat[(iy + 1) * gw + ix], dd = lat[(iy + 1) * gw + ix + 1];
        const mott = (a + (b - a) * sx) * (1 - sy) + (cc + (dd - cc) * sx) * sy;
        fiber = fiber * 0.82 + (rnd() * 2 - 1) * 0.18; // short horizontal fibres
        const v = mott * 3.2 + fiber * 4.0 + (rnd() * 2 - 1) * 2.2;
        const k = (y * W + x) * 4;
        d[k] = base[0] + v; d[k + 1] = base[1] + v; d[k + 2] = base[2] + v * 0.9; d[k + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    // fine drafting grid in the same graphite pigment
    g.lineWidth = 1;
    for (let x = 32; x < W; x += 32) { g.strokeStyle = ink(x % 160 === 0 ? 0.085 : 0.045); g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
    for (let y = 40; y < H; y += 32) { g.strokeStyle = ink((y - 40) % 160 === 0 ? 0.085 : 0.045); g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
  }

  // ---------- Graphite tooth mask (static) ----------
  function buildTooth() {
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const rnd = mulberry32(9071);
    const img = g.createImageData(W, H), d = img.data;
    const row = new Float32Array(W);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const n = rnd();
        row[x] = y === 0 ? n : row[x] * 0.35 + n * 0.65; // slight vertical coherence
        const along = x > 0 ? (row[x] * 0.6 + row[x - 1] * 0.4) : row[x];
        const a = 0.5 + 0.5 * Math.pow(along, 0.55);
        const k = (y * W + x) * 4;
        d[k] = 0; d[k + 1] = 0; d[k + 2] = 0; d[k + 3] = Math.round(255 * a);
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  // ---------- Stroke model ----------
  function mkStroke(pts, opt, rnd) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const press = [];
    for (let i = 0; i < pts.length; i++) press.push(0.86 + rnd() * 0.24); // fixed seeded pressure variant
    return { pts, cum, len: cum[cum.length - 1], w: opt.w, a: opt.a, taper: opt.taper !== false, press };
  }
  function flatten(drawable, kinds) {
    const out = [];
    for (const set of drawable.sets) {
      if (kinds && kinds.indexOf(set.type) < 0) continue;
      let cur = null, px = 0, py = 0;
      for (const op of set.ops) {
        const d = op.data;
        if (op.op === 'move') { if (cur && cur.length > 1) out.push(cur); cur = [[d[0], d[1]]]; px = d[0]; py = d[1]; }
        else if (op.op === 'lineTo') { cur.push([d[0], d[1]]); px = d[0]; py = d[1]; }
        else if (op.op === 'bcurveTo') {
          const n = 10;
          for (let i = 1; i <= n; i++) {
            const t = i / n, m = 1 - t;
            cur.push([m * m * m * px + 3 * m * m * t * d[0] + 3 * m * t * t * d[2] + t * t * t * d[4],
                      m * m * m * py + 3 * m * m * t * d[1] + 3 * m * t * t * d[3] + t * t * t * d[5]]);
          }
          px = d[4]; py = d[5];
        }
      }
      if (cur && cur.length > 1) out.push(cur);
    }
    return out;
  }
  function group(polys, opt, seed) {
    const rnd = mulberry32(seed);
    const strokes = polys.map((p) => mkStroke(p, opt, rnd));
    let total = 0; for (const s of strokes) total += s.len;
    return { strokes, total };
  }
  function drawStroke(g, s, prog, alphaMul) {
    if (prog <= 0 || s.len <= 0) return;
    const L = Math.min(1, prog) * s.len;
    const pts = s.pts, cum = s.cum;
    const CH = 4;
    for (let i = 0; i < pts.length - 1 && cum[i] < L; i += CH) {
      const j = Math.min(i + CH, pts.length - 1);
      const u = (cum[i] + Math.min(cum[j], L)) * 0.5 / s.len;
      const taper = s.taper ? Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * u)), 0.6) : 1;
      const p = taper * s.press[i];
      g.lineWidth = s.w * (0.55 + 0.45 * p);
      g.strokeStyle = ink(s.a * alphaMul * (0.55 + 0.45 * p));
      g.beginPath();
      g.moveTo(pts[i][0], pts[i][1]);
      for (let k = i + 1; k <= j; k++) {
        if (cum[k] <= L) { g.lineTo(pts[k][0], pts[k][1]); }
        else {
          const f = (L - cum[k - 1]) / (cum[k] - cum[k - 1]);
          g.lineTo(pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * f, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * f);
          break;
        }
      }
      g.stroke();
    }
  }
  // sequential: one pencil travelling through strokes in authored order
  function drawSequential(g, grp, p, am) {
    if (p <= 0) return;
    let budget = clamp01(p) * grp.total;
    for (const s of grp.strokes) { if (budget <= 0) break; drawStroke(g, s, budget / s.len, am == null ? 1 : am); budget -= s.len; }
  }
  // parallel: both rough passes advance together (reads as one double line)
  function drawParallel(g, grp, p, am) { if (p <= 0) return; for (const s of grp.strokes) drawStroke(g, s, p, am == null ? 1 : am); }
  // staggered: hatch lines laid one after another with a small overlap window
  function drawStagger(g, grp, p, am) {
    if (p <= 0) return;
    const n = grp.strokes.length, ov = 3, t = clamp01(p) * (n + ov);
    for (let i = 0; i < n; i++) { const q = (t - i) / ov; if (q <= 0) break; drawStroke(g, grp.strokes[i], q, am == null ? 1 : am); }
  }

  // ---------- Designed hatching (fixed angle, gap, bow; seeded endpoint variants) ----------
  function hatch(test, box, angleDeg, gap, seed, alphaFn) {
    const rnd = mulberry32(seed);
    const a = angleDeg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    const R = Math.hypot(box[2] - box[0], box[3] - box[1]) / 2 + 2;
    const runs = [];
    for (let o = -R; o <= R; o += gap) {
      let run = null;
      for (let t = -R; t <= R; t += 3) {
        const x = cx + nx * o + dx * t, y = cy + ny * o + dy * t;
        if (test(x, y)) { if (!run) run = []; run.push([x, y]); }
        else if (run) { if (run.length > 2) runs.push(run); run = null; }
      }
      if (run && run.length > 2) runs.push(run);
    }
    return runs.map((run) => {
      const trimA = Math.floor(rnd() * 2), trimB = Math.floor(rnd() * 2);
      const r2 = run.slice(trimA, run.length - trimB);
      const bow = (rnd() - 0.5) * 1.4, n = r2.length - 1;
      const pts = r2.map((p, i) => { const u = n ? i / n : 0, b = Math.sin(Math.PI * u) * bow; return [p[0] + nx * b, p[1] + ny * b]; });
      const mid = pts[Math.floor(pts.length / 2)];
      return { pts, k: alphaFn ? alphaFn(mid[0], mid[1]) : 1 };
    });
  }
  function hatchGroup(runs, opt, seed) {
    const rnd = mulberry32(seed);
    const strokes = runs.map((r) => mkStroke(r.pts, { w: opt.w, a: opt.a * r.k, taper: true }, rnd));
    let total = 0; for (const s of strokes) total += s.len;
    return { strokes, total };
  }
  const inC = (c) => (x, y) => (x - c.x) * (x - c.x) + (y - c.y) * (y - c.y) <= c.r * c.r;

  // ---------- Scene geometry ----------
  const S = { x: 330, y: 330, r: 112 };          // the idea (sphere)
  const LIGHT = { x: 298, y: 296, r: 104 };      // lit region (light from upper-left)
  const CORE = { x: 304, y: 302, r: 116 };       // core shadow boundary
  const HIGH = { x: 290, y: 288, r: 40 };        // highlight left as paper
  const NODES = [
    { x: 700, y: 200, r: 26 }, { x: 960, y: 262, r: 26 }, { x: 820, y: 420, r: 26 },
    { x: 1080, y: 440, r: 26 }, { x: 1110, y: 180, r: 26 }
  ];
  const EDGES = [[-1, 0], [-1, 1], [-1, 2], [2, 3], [1, 4], [1, 3]];

  const gen = rough.generator();
  const G = {};
  function buildGeometry() {
    G.guideH = group(flatten(gen.line(160, 330, 1180, 330, { roughness: 0.35, bowing: 0.4, seed: 11, disableMultiStroke: true })), { w: 0.7, a: 0.22, taper: false }, 101);
    G.guideV = group(flatten(gen.line(330, 170, 330, 500, { roughness: 0.35, bowing: 0.4, seed: 12, disableMultiStroke: true })), { w: 0.7, a: 0.22, taper: false }, 102);
    G.explore = group(flatten(gen.circle(S.x + 2, S.y - 1, S.r * 2 + 10, { roughness: 1.3, bowing: 1.2, seed: 21, curveStepCount: 12 })), { w: 0.7, a: 0.32 }, 103);
    G.contour = group(flatten(gen.circle(S.x, S.y, S.r * 2, { roughness: 0.55, bowing: 0.5, seed: 22, curveStepCount: 14 })), { w: 1.9, a: 0.86 }, 104);
    // layered hatching: midtone over whole sphere except highlight, shadow crescent, core cross-hatch
    G.mid = hatchGroup(hatch((x, y) => inC(S)(x, y) && !inC(HIGH)(x, y), [S.x - S.r, S.y - S.r, S.x + S.r, S.y + S.r], 40, 6.2, 31,
      (x, y) => 0.45 + 0.55 * clamp01((Math.hypot(x - HIGH.x, y - HIGH.y) - HIGH.r) / 110)), { w: 0.75, a: 0.42 }, 105);
    G.shadow = hatchGroup(hatch((x, y) => inC(S)(x, y) && !inC(LIGHT)(x, y), [S.x - S.r, S.y - S.r, S.x + S.r, S.y + S.r], 40, 3.1, 32), { w: 0.85, a: 0.6 }, 106);
    G.core = hatchGroup(hatch((x, y) => inC({ x: S.x, y: S.y, r: S.r - 3 })(x, y) && !inC(CORE)(x, y), [S.x - S.r, S.y - S.r, S.x + S.r, S.y + S.r], -35, 3.4, 33), { w: 0.8, a: 0.55 }, 107);
    G.cast = group(flatten(gen.ellipse(372, 458, 240, 30, { fill: PAL.graphite, fillStyle: 'hachure', hachureAngle: -35, hachureGap: 3.4, fillWeight: 0.7, stroke: 'none', roughness: 0.8, seed: 41 }), ['fillSketch']), { w: 0.75, a: 0.5 }, 108);
    G.nodes = NODES.map((n, i) => ({
      explore: group(flatten(gen.circle(n.x + 1, n.y - 1, n.r * 2 + 3, { roughness: 1.1, bowing: 1, seed: 51 + i })), { w: 0.6, a: 0.36 }, 120 + i),
      contour: group(flatten(gen.circle(n.x, n.y, n.r * 2, { roughness: 0.5, bowing: 0.5, seed: 61 + i })), { w: 1.4, a: 0.84 }, 130 + i),
      shade: hatchGroup(hatch((x, y) => inC({ x: n.x, y: n.y, r: n.r - 1.5 })(x, y) && !inC({ x: n.x - 7, y: n.y - 7, r: n.r - 1 })(x, y),
        [n.x - n.r, n.y - n.r, n.x + n.r, n.y + n.r], 40, 2.7, 71 + i), { w: 0.7, a: 0.55 }, 140 + i)
    }));
    G.edges = EDGES.map((e, i) => {
      const A = e[0] < 0 ? S : NODES[e[0]], B = NODES[e[1]];
      const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const x1 = A.x + ux * (A.r - 3), y1 = A.y + uy * (A.r - 3), x2 = B.x - ux * (B.r - 1), y2 = B.y - uy * (B.r - 1);
      const main = group(flatten(gen.line(x1, y1, x2, y2, { roughness: 0.45, bowing: 0.7, seed: 81 + i })), { w: 1.0, a: 0.8 }, 150 + i);
      const echo = i % 2 === 0 ? group(flatten(gen.line(x1 - uy * 3.5, y1 + ux * 3.5, x2 - uy * 3.5, y2 + ux * 3.5, { roughness: 0.6, bowing: 0.9, seed: 91 + i, disableMultiStroke: true })), { w: 0.6, a: 0.3 }, 160 + i) : null;
      return { main, echo, x1, y1, x2, y2, ux, uy, L: Math.hypot(x2 - x1, y2 - y1) };
    });
  }

  // ---------- Stump smudge sprites: marks laid at quarter resolution, upscaled = blended graphite ----------
  function smudgeSprite(paint) {
    const q = makeCanvas(W / 4, H / 4), qg = q.getContext('2d');
    qg.scale(0.25, 0.25); qg.lineCap = 'round';
    paint(qg);
    const c = makeCanvas(W, H), g = c.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(q, 0, 0, W, H);
    return c;
  }
  function paintRuns(g, grp, width, alpha) {
    g.lineWidth = width; g.strokeStyle = ink(alpha);
    for (const s of grp.strokes) { g.beginPath(); g.moveTo(s.pts[0][0], s.pts[0][1]); for (const p of s.pts) g.lineTo(p[0], p[1]); g.stroke(); }
  }
  let SP = {};
  function buildSprites() {
    SP.sphere = smudgeSprite((g) => { paintRuns(g, G.mid, 6, 0.05); paintRuns(g, G.shadow, 7, 0.06); });
    SP.cast = smudgeSprite((g) => { paintRuns(g, G.cast, 8, 0.08); });
    SP.halo = smudgeSprite((g) => {
      g.lineWidth = 16; g.strokeStyle = ink(0.11);
      for (const e of G.edges) { g.beginPath(); g.moveTo(e.x1, e.y1); g.lineTo(e.x2, e.y2); g.stroke(); }
    });
    SP.nodes = smudgeSprite((g) => {
      for (const n of NODES) { g.lineWidth = 9; g.strokeStyle = ink(0.10); g.beginPath(); g.arc(n.x, n.y, n.r, 0, Math.PI * 2); g.stroke(); }
      for (const nd of G.nodes) paintRuns(g, nd.shade, 6, 0.07);
    });
  }

  // ---------- Motion state: GSAP is the single owner of every property ----------
  const st = {
    guide: 0, explore: 0, contour: 0, mid: 0, shadow: 0, core: 0, tone: 0, cast: 0,
    e0: 0, e1: 0, e2: 0, e3: 0, e4: 0, e5: 0,
    n0: 0, n1: 0, n2: 0, n3: 0, n4: 0, s0: 0, s1: 0, s2: 0, s3: 0, s4: 0
  };

  let layer, lg, tooth, out;
  function render() {
    // 1) graphite marks on an isolated layer
    lg.setTransform(1, 0, 0, 1, 0, 0);
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, W, H);
    lg.lineCap = 'butt'; lg.lineJoin = 'round';
    drawSequential(lg, G.guideH, st.guide);
    drawSequential(lg, G.guideV, clamp01(st.guide * 1.4 - 0.2));
    drawStagger(lg, G.cast, st.cast);
    drawSequential(lg, G.explore, st.explore);
    drawStagger(lg, G.mid, st.mid);
    drawStagger(lg, G.shadow, st.shadow);
    drawStagger(lg, G.core, st.core);
    drawSequential(lg, G.contour, st.contour);
    G.edges.forEach((e, i) => { const p = st['e' + i]; drawParallel(lg, e.main, p); if (e.echo) drawParallel(lg, e.echo, clamp01(p * 1.15 - 0.15)); });
    G.nodes.forEach((nd, i) => {
      const p = st['n' + i];
      drawSequential(lg, nd.explore, clamp01(p * 1.6));
      drawSequential(lg, nd.contour, clamp01(p * 1.25 - 0.25));
      drawStagger(lg, nd.shade, st['s' + i]);
    });
    // 2) paper tooth breaks up the graphite (static mask, never moves)
    lg.globalCompositeOperation = 'destination-in';
    lg.drawImage(tooth, 0, 0);
    lg.globalCompositeOperation = 'source-over';

    // 3) composite: stump smudges under the crisp marks
    out.clearRect(0, 0, W, H);
    out.globalAlpha = clamp01(st.cast); out.drawImage(SP.cast, 0, 0);
    out.globalAlpha = clamp01(st.tone); out.drawImage(SP.sphere, 0, 0);
    out.globalAlpha = 1;
    // connector halos revealed with each line's pencil tip
    out.save(); out.beginPath();
    let any = false;
    G.edges.forEach((e, i) => {
      const p = clamp01(st['e' + i]); if (p <= 0) return; any = true;
      const len = e.L * p + 6, hw = 22, px = -e.uy * hw, py = e.ux * hw;
      const sx = e.x1 - e.ux * 6, sy = e.y1 - e.uy * 6, ex = sx + e.ux * len, ey = sy + e.uy * len;
      out.moveTo(sx + px, sy + py); out.lineTo(ex + px, ey + py); out.lineTo(ex - px, ey - py); out.lineTo(sx - px, sy - py); out.closePath();
    });
    if (any) { out.clip(); out.drawImage(SP.halo, 0, 0); }
    out.restore();
    NODES.forEach((n, i) => {
      const a = clamp01(st['n' + i] * 0.6 + st['s' + i] * 0.4); if (a <= 0) return;
      const b = n.r + 18; out.globalAlpha = a;
      out.drawImage(SP.nodes, n.x - b, n.y - b, b * 2, b * 2, n.x - b, n.y - b, b * 2, b * 2);
    });
    out.globalAlpha = 1;
    out.drawImage(layer, 0, 0);
  }

  // ---------- Build (preload) everything, then the timeline ----------
  buildPaper();
  tooth = buildTooth();
  buildGeometry();
  buildSprites();
  layer = makeCanvas(W, H); lg = layer.getContext('2d');
  out = document.getElementById('drawing').getContext('2d');

  const tl = gsap.timeline({ paused: true, onUpdate: render });
  const T = (prop, start, dur, ease) => tl.fromTo(st, { [prop]: 0 }, { [prop]: 1, duration: dur, ease: ease || 'sine.inOut' }, start);
  // construction
  T('guide', 0.00, 0.42, 'sine.inOut');
  T('explore', 0.04, 0.42, 'power1.inOut');
