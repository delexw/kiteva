<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clay-Style 3D — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2C3A37; }
  #video { position: relative; width: 100%; height: 100%; overflow: hidden; background: #2C3A37;
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif; }
  #clay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* stationary lens falloff: frames the hero, never moves */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 52% 58%, rgba(20,28,27,0) 55%, rgba(20,28,27,0.42) 100%); }
  .copy { position: absolute; margin: 0; color: #F2E9DA; white-space: nowrap; }
  #title { left: 80px; top: 62px; font-size: 50px; line-height: 60px; font-weight: 700; letter-spacing: 0.2px; }
  #subtitle { left: 80px; top: 124px; font-size: 40px; line-height: 50px; font-weight: 500; }
  #footer { right: 80px; bottom: 44px; font-size: 15px; line-height: 20px; letter-spacing: 3px; font-weight: 500; }
</style>
</head>
<body>
<div id="video" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="clay" width="1280" height="720" data-demo-actor="clay-scene"></canvas>
  <div id="vignette"></div>
  <h1 class="copy" id="title">An idea becomes</h1>
  <p class="copy" id="subtitle">a connected system</p>
  <p class="copy" id="footer">DIGITAL CLAY · MATTE STUDY</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="clay-scene.bundle.js"></script>
<script>
(function () {
  // Contrast guard against the resolved dark stage (no recoloring of approved clay tokens).
  var stageLit = '#3A4A46';
  if (chroma.contrast('#F2E9DA', stageLit) < 4.5) throw new Error('Copy contrast below target on stage');

  var clay = window.ClayScene.createClayScene(document.getElementById('clay'));
  var scene = { t: 0 };
  var tl = gsap.timeline({ paused: true });

  // Single owner of scene time: one linear proxy tween. Everything in WebGL derives from it.
  tl.to(scene, { t: 3, duration: 3, ease: 'none', onUpdate: function () { clay.renderAt(scene.t); } }, 0);

  // Flat 2D copy layered over the 3D stage, revealed after the bulb lands, settled by 2.35 s.
  tl.fromTo('#title', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.46);
  tl.fromTo('#subtitle', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.7);
  tl.fromTo('#footer', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'sine.inOut' }, 1.95);
  tl.set({}, {}, 3);

  function redraw() { clay.renderAt(tl.time()); }
  window.addEventListener('hf-seek', redraw);
  document.addEventListener('hf-seek', redraw);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0); redraw();
})();
</script>

</html>
