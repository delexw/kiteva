<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>An Idea Becomes a Connected System — Woodcut / Linocut (moonlit print refresh)</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#DDE3E4}
  #root{width:100%;height:100%;position:relative;overflow:hidden}
  #stage{width:100%;height:100%;display:block}
  text{font-family:Georgia,"Times New Roman",serif}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Fixed carved hatch: anchored to user space, never moves -->
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <path d="M0 4.5h9" stroke="#141C27" stroke-width="3.2"/>
    </pattern>
    <clipPath id="panelInk"><path id="panelInkPath" d="M48 48H48V672H48Z"/></clipPath>
    <clipPath id="bulbCarve"><circle id="bulbCarveCircle" cx="0" cy="0" r="0"/></clipPath>
    <clipPath id="clipIdea"><rect id="clipIdeaRect" x="690" y="60" width="0" height="90"/></clipPath>
    <clipPath id="clipBecomes"><rect id="clipBecomesRect" x="692" y="500" width="0" height="56"/></clipPath>
    <clipPath id="clipSystem"><rect id="clipSystemRect" x="690" y="548" width="0" height="90"/></clipPath>
    <clipPath id="clipRule"><rect id="clipRuleRect" x="700" y="638" width="0" height="18"/></clipPath>
  </defs>

  <!-- Stationary paper ground (cool moonlit print paper) -->
  <rect id="paper" width="1280" height="720" fill="#DDE3E4"/>
  <g id="paperFlecks" fill="#141C27" opacity="0.09"></g>
  <rect x="22" y="22" width="1236" height="676" fill="none" stroke="#141C27" stroke-width="10"/>

  <!-- LEFT BLOCK: ink rolled on, then carved (positive-negative) -->
  <g id="leftBlock" clip-path="url(#panelInk)">
    <rect x="48" y="48" width="600" height="624" fill="#141C27"/>
    <g id="blockGrain" fill="none" stroke="#DDE3E4" stroke-width="1.4" opacity="0.10"></g>
    <g id="rays" transform="translate(348 300)"></g>
    <g id="groundMarks" fill="#DDE3E4"></g>
    <g transform="translate(348 300)">
      <g clip-path="url(#bulbCarve)">
        <circle r="126" fill="#DDE3E4"/>
        <path d="M18-120A126 126 0 0 1 20 124A118 118 0 0 0 18-120Z" fill="#141C27"/>
        <g id="bulbHatch" fill="none" stroke="#141C27" stroke-width="4" stroke-linecap="round"></g>
        <path id="filament" d="M-40 60Q-46-10-20-40L0 10L20-40Q46-10 40 60" fill="none" stroke="#141C27" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="bulbBase" fill="#DDE3E4">
        <path id="base0" d="M-60 118H60V140H-60Z"/>
        <path id="base1" d="M-52 152H52V170H-52Z"/>
        <path id="base2" d="M-30 182H30L18 204H-18Z"/>
      </g>
    </g>
  </g>

  <!-- RIGHT: telegraph dashes, then carved network lines, then stamped nodes -->
  <g id="telegraph" fill="none" stroke="#141C27" stroke-width="3" stroke-dasharray="7 9" opacity="0.6"></g>
  <g id="edges" fill="none" stroke="#141C27" stroke-width="12" stroke-linecap="round"></g>
  <g id="nodes"></g>

  <!-- Copy (wiped in as printed regions, reading order) -->
  <g clip-path="url(#clipIdea)"><text x="700" y="130" font-weight="900" font-size="64" fill="#141C27" letter-spacing="4">AN IDEA</text></g>
  <g clip-path="url(#clipBecomes)"><text x="702" y="540" font-style="italic" font-size="34" fill="#141C27">becomes a connected</text></g>
  <g clip-path="url(#clipSystem)"><text x="700" y="620" font-weight="900" font-size="76" fill="#141C27" letter-spacing="6">SYSTEM</text></g>
  <g clip-path="url(#clipRule)"><rect x="700" y="640" width="520" height="14" fill="url(#hatch)"/></g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="woodcut-motion.js"></script>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const M=window.WoodcutMotion;
  const PAL={paper:'#DDE3E4',ink:'#141C27'};
  // Palette validation only (no recolouring): one ink on one paper.
  if(!chroma.valid(PAL.paper)||!chroma.valid(PAL.ink)||chroma.contrast(PAL.paper,PAL.ink)<4.5) throw Error('Palette contrast failure');

  const ease={
    roll:M.cubicBezier(0.45,0,0.2,1),
    carve:M.easeOut,
    inOut:M.easeInOut,
    stamp:M.backOut,
    lin:(p)=>p
  };
  const seg=(t,a,b,e)=>{const p=M.clamp(0,1,M.progress(a,b,t));return (e||ease.lin)(p);};
  const el=(tag,attrs,parent)=>{const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);parent.appendChild(n);return n;};
  // Seeded LCG for fixed texture placement (built once, never re-randomised)
  let seed=53;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

  // ---- Fixed paper flecks (stationary decorative grain, kept away from the copy) ----
  const flecks=document.getElementById('paperFlecks');
  for(let i=0;i<70;i++){
    const x=660+rnd()*590, y=32+rnd()*656;
    if((y>60&&y<150)||(y>495&&y<660))continue;
    const w=4+rnd()*10;
    el('path',{d:`M${x.toFixed(1)} ${y.toFixed(1)}q${(w/2).toFixed(1)} -1.6 ${w.toFixed(1)} 0q${(-w/2).toFixed(1)} 1.2 ${(-w).toFixed(1)} 0z`},flecks);
  }
  // ---- Fixed block grain: directional gouge lines across the inked block ----
  const grain=document.getElementById('blockGrain');
  for(let y=58;y<668;y+=13){
    let d=`M48 ${y}`;
    for(let x=48;x<=648;x+=40){d+=` L${x} ${(y+Math.sin(x*0.021+y*0.13)*2.2).toFixed(2)}`;}
    el('path',{d},grain);
  }
  // ---- Ground marks (carved flecks) ----
  const ground=document.getElementById('groundMarks');
  [[80,600],[140,614],[220,594],[320,620],[410,602],[500,618],[580,596]].forEach(([x,y])=>el('path',{d:`M${x} ${y}q14-5 30 0q-15 3-30 0z`},ground));
  // ---- Rays: carved outward from the bulb ----
  const rayAngles=[0,30,60,90,120,240,270,300,330];
  const rayOrder=[0,1,8,2,7,3,6,4,5]; // carve symmetric pairs outward from the top
  const rays=rayAngles.map((a)=>{
    const g=el('g',{transform:`rotate(${a})`},document.getElementById('rays'));
    const p=el('path',{d:'M-7-150Q0-160 7-150L16-330H-16Z',fill:PAL.paper},g);
    return p;
  });
  // ---- Bulb hatching that follows the form (arcs on the shadow limb) ----
  const hatchG=document.getElementById('bulbHatch');
  const hatch=[];
  for(let i=0;i<6;i++){
    const a0=(-58+i*20)*Math.PI/180, a1=a0+12*Math.PI/180;
    const r0=100, r1=124;
    const d=`M${(Math.cos(a0)*r0).toFixed(1)} ${(Math.sin(a0)*r0).toFixed(1)}L${(Math.cos(a1)*r1).toFixed(1)} ${(Math.sin(a1)*r1).toFixed(1)}`;
    const p=el('path',{d},hatchG);const L=p.getTotalLength();p.setAttribute('stroke-dasharray',L);
    hatch.push({p,L});
  }
  const filament=document.getElementById('filament');const filL=filament.getTotalLength();filament.setAttribute('stroke-dasharray',filL);
  const bases=[0,1,2].map(i=>document.getElementById('base'+i));

  // ---- Network graph: BFS-ordered edges from the block ----
  const N={S:[648,300],A:[760,220],B:[900,300],C:[1060,210],F:[1180,300],D:[800,420],E:[1000,420]};
  const E=[['S','A',0.80,1.00],['A','B',1.00,1.22],['A','D',1.00,1.22],['B','C',1.22,1.44],['B','D',1.22,1.40],['D','E',1.22,1.46],['C','F',1.44,1.64],['C','E',1.44,1.66],['F','E',1.64,1.86]];
  const TELE=0.26; // telegraph dashes lead each carved line
  const edges=E.map(([a,b,s,e])=>{
    const [x1,y1]=N[a],[x2,y2]=N[b];
    const tl=el('line',{x1,y1,x2:x1,y2:y1,opacity:0},document.getElementById('telegraph'));
    const ln=el('line',{x1,y1,x2:x1,y2:y1,opacity:0},document.getElementById('edges'));
    return {x1,y1,x2,y2,s,e,tl,ln};
  });
  const nodeTimes={A:1.00,B:1.22,D:1.22,C:1.44,E:1.46,F:1.64};
  const nodes=Object.keys(nodeTimes).map(k=>{
    const [x,y]=N[k];
    const g=el('g',{transform:`translate(${x} ${y})`,opacity:0},document.getElementById('nodes'));
    el('circle',{r:34,fill:PAL.paper,stroke:PAL.ink,'stroke-width':8},g);
    el('circle',{r:22,fill:'url(#hatch)'},g);
    return {g,x,y,t:nodeTimes[k]};
  });

  // ---- Panel ink roll edge profile (fixed ragged brayer edge) ----
  const rows=[];for(let y=48;y<=672;y+=24)rows.push(y);
  const off=rows.map((y,i)=>18+Math.sin(i*1.7)*11+Math.sin(i*0.6+1)*9);
  const panelPath=document.getElementById('panelInkPath');
  const bulbClip=document.getElementById('bulbCarveCircle');
  const clipIdea=document.getElementById('clipIdeaRect');
  const clipBecomes=document.getElementById('clipBecomesRect');
  const clipSystem=document.getElementById('clipSystemRect');
  const clipRule=document.getElementById('clipRuleRect');

  function render(t){
    t=M.clamp(0,3,t);
    // 1. Ink roll: brayer sweeps the block left->right (0.00-0.62s)
    const r=seg(t,0,0.62,ease.roll);
    let d='M48 48';
    rows.forEach((y,i)=>{const X=Math.min(648,48+680*r-off[i]*(r<1?1:0));d+=` L${Math.max(48,X).toFixed(1)} ${y}`;});
    d+=' L48 672Z';
    panelPath.setAttribute('d',d);
    // 2. Carve the bulb out of the inked block (0.42-0.80s), rays gouged outward
    bulbClip.setAttribute('r',(132*seg(t,0.42,0.80,ease.carve)).toFixed(2));
    rays.forEach((p,i)=>{
      const k=rayOrder.indexOf(i);
      const s=seg(t,0.55+k*0.05,0.85+k*0.05,ease.carve);
      p.setAttribute('transform',`translate(0 -150) scale(1 ${Math.max(0.0001,s).toFixed(4)}) translate(0 150)`);
      p.setAttribute('opacity',s>0?1:0);
    });
    hatch.forEach((h,i)=>{const s=seg(t,0.82+i*0.04,1.02+i*0.04,ease.inOut);h.p.setAttribute('stroke-dashoffset',(h.L*(1-s)).toFixed(2));});
    filament.setAttribute('stroke-dashoffset',(filL*(1-seg(t,0.70,1.05,ease.inOut))).toFixed(2));
    bases.forEach((b,i)=>{const s=seg(t,0.78+i*0.07,1.0+i*0.07,ease.carve);b.setAttribute('transform',`translate(0 ${(24*(1-s)).toFixed(2)})`);b.setAttribute('opacity',s.toFixed(3));});
    // 3. Telegraph dashes, then carved lines grow from origin; nodes stamp on arrival
    edges.forEach(g=>{
      const pt=seg(t,g.s-TELE,g.e-TELE,ease.lin);
      const ps=seg(t,g.s,g.e,ease.inOut);
      g.tl.setAttribute('x2',M.mix(g.x1,g.x2,pt).toFixed(2));g.tl.setAttribute('y2',M.mix(g.y1,g.y2,pt).toFixed(2));
      g.tl.setAttribute('opacity',pt>0&&ps<1?0.6:0);
      g.ln.setAttribute('x2',M.mix(g.x1,g.x2,ps).toFixed(2));g.ln.setAttribute('y2',M.mix(g.y1,g.y2,ps).toFixed(2));
      g.ln.setAttribute('opacity',ps>0?1:0);
    });
    nodes.forEach(n=>{
      const s=seg(t,n.t-0.04,n.t+0.20,ease.stamp);
      const sc=s<=0?1.2:M.mix(1.2,1,s);
      n.g.setAttribute('transform',`translate(${n.x} ${n.y}) scale(${sc.toFixed(4)})`);
      n.g.setAttribute('opacity',M.clamp(0,1,seg(t,n.t-0.04,n.t+0.06)).toFixed(3));
    });
    // 4. Copy printed in reading order
    clipIdea.setAttribute('width',(360*seg(t,0.10,0.52,ease.inOut)).toFixed(1));
    clipBecomes.setAttribute('width',(360*seg(t,1.56,1.92,ease.inOut)).toFixed(1));
    clipSystem.setAttribute('width',(400*seg(t,1.84,2.24,ease.inOut)).toFixed(1));
    clipRule.setAttribute('width',(520*seg(t,2.10,2.50,ease.inOut)).toFixed(1));
  }

  const state={t:0};
  const tl=gsap.timeline({paused:true});
  // GSAP owns only composition time; render(t) owns every visual attribute.
  tl.to(state,{t:3,duration:3,ease:'none'},0);
  tl.eventCallback('onUpdate',()=>render(tl.time()));
  render(0);
  window.__timelines=window.__timelines||{};
  window.__timelines.video=tl;
  window.addEventListener('hf-seek',(e)=>{const s=e&&e.detail&&typeof e.detail.time==='number'?e.detail.time:tl.time();render(s);});
})();
</script>

</html>
