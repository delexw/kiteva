<script>
(function () {
  "use strict";
  gsap.registerPlugin(DrawSVGPlugin);
  const NS = "http://www.w3.org/2000/svg";
  const INK = "#20211E";
  const svg = document.getElementById("scene");

  // ---------- deterministic helpers ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  }

  // ---------- stationary paper fibres (seeded) ----------
  (function fibres() {

      const x = r() * 1280, y = r() * 720, len = 8 + r() * 34, ang = r() * Math.PI;

    }

  //          + optional dry-brush split strands at the tail

  function outline(d, prof, opts) {
    measure.setAttribute("d", d);
    const L = measure.getTotalLength(); const N = Math.max(24, Math.round(L / 3));
    const t0 = opts.t0 || 0, t1 = opts.t1 == null ? 1 : opts.t1, off = opts.offset || 0, scale = opts.scale || 1, seed = opts.seed || 1;

      const p = pts[i][1], a = pts[Math.max(0, i - 1)][1], b = pts[Math.min(pts.length - 1, i + 1)][1];
      let nx = -(b.y - a.y), ny = b.x - a.x; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
      const t = pts[i][0];
      const rag = 1 + 0.07 * Math.sin(t * 37 + seed * 3.1) + 0.04 * Math.sin(t * 91 + seed);
      const w = profile(prof, t) * scale * rag / 2;
      const ox = p.x + nx * off * profile(prof, t), oy = p.y + ny * off * profile(prof, t);
      left.push([ox + nx * w, oy + ny * w]); right.push([ox - nx * w, oy - ny * w]);
    }

    return "M" + ring.map(q => f(q[0]) + " " + f(q[1])).join("L") + "Z";
  }

  let maskId = 0;
  function brushStroke(parent, spec) {
    const id = "m" + (maskId++);
    const maxW = Math.max.apply(null, spec.w.map(p => p[1]));
    const mask = el("mask", { id, maskUnits: "userSpaceOnUse", x: -1200, y: -800, width: 3000, height: 2000 }, svg.querySelector("defs"));
    const reveal = el("path", { d: spec.d, fill: "none", stroke: "#fff", "stroke-width": f(maxW * 1.9 + 8), "stroke-linecap": "round", "stroke-linejoin": "round" }, mask);
    // userSpaceOnUse mask content already shares the masked group's local coordinates.
    const g = el("g", { mask: `url(#${id})` }, parent);
    const bleedG = el("g", { filter: "url(#wetBleed)", opacity: "0.22" }, g);

    const mainProf = dry ? spec.w.map(([t, w]) => [t, t > 1 - dry ? w * 0.55 : w]) : spec.w;

    }

  }

  // ---------- glyph data: 一 + 念 (今 over 心), hand-authored centrelines ----------

  const strokes = [
    { name: "一 橫", d: "M18 -104 C70 -112 140 -120 210 -122 C240 -122 262 -118 282 -112", w: [[0, 9], [0.06, 20], [0.2, 15], [0.6, 11], [0.86, 15], [0.95, 19], [1, 6]], seed: 1, dry: 0 },

  // ---------- connected system: tapered ink lines + nodes ----------

  const links = [
    { d: "M178 466 Q300 384 420 362 T562 282", w: [[0, 7], [0.2, 4.2], [0.8, 3], [1, 1.6]], seed: 21, t: [1.62, 0.5] },
    { d: "M302 400 Q318 360 330 330", w: [[0, 3], [1, 1.4]], seed: 22, t: [1.9, 0.22] },
    { d: "M420 362 Q446 412 470 450", w: [[0, 3.2], [1, 1.4]], seed: 23, t: [1.98, 0.24] },
    { d: "M470 450 Q520 470 568 488", w: [[0, 2.6], [1, 1.2]], seed: 24, t: [2.18, 0.2] },
    { d: "M330 330 Q296 300 262 268", w: [[0, 2.6], [1, 1.2]], seed: 25, t: [2.08, 0.2] }

    tl.to(reveal, { drawSVG: "100%", duration: du, ease: du < 0.12 ? "power2.inOut" : "sine.inOut" }, st);

    const c = el("circle", { cx, cy, r, fill: INK, filter: "url(#inkEdge)" }, system);
    gsap.set(c, { transformOrigin: "50% 50%", scale: 0, opacity: 0 });
    tl.to(c, { scale: 1, opacity: 1, duration: r > 10 ? 0.22 : 0.14, ease: "back.out(1.2)" }, at);
    return c;
  });

    const reveal = brushStroke(system, s);
    gsap.set(reveal, { drawSVG: "0%", visibility: "hidden" });
    tl.set(reveal, { visibility: "visible" }, s.t[0]);
    tl.to(reveal, { drawSVG: "100%", duration: s.t[1], ease: "power2.inOut" }, s.t[0]);

  gsap.set(colChars, { opacity: 0, y: -10 });
  colChars.forEach((c, i) => tl.to(c, { opacity: 1, y: 0, duration: 0.3, ease: "power2.inOut" }, 1.95 + i * 0.08));

  gsap.set(dateChars, { opacity: 0 });
  tl.to(dateChars, { opacity: 1, duration: 0.25, stagger: 0.05, ease: "sine.inOut" }, 2.15);

  // Seal: whole group (frame + carved 連) presses down together
  const seal = document.getElementById("seal");
  gsap.set(seal, { transformOrigin: "50% 50%", scale: 1.25, opacity: 0 });
  tl.to(seal, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.inOut" }, 2.3);

  // Caption
  const cap = Array.from(document.querySelectorAll("#caption text"));
  gsap.set(cap, { opacity: 0 });
  tl.to(cap[0], { opacity: 1, duration: 0.3, ease: "sine.inOut" }, 1.75);
  tl.to(cap[1], { opacity: 1, duration: 0.3, ease: "sine.inOut" }, 1.95);

  // Composition length = 3 s (hold to end)
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.progress(0).pause(0);
})();
</script>
