<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><pattern id="bl" width="1280" height="24" patternUnits="userSpaceOnUse"><rect y="23.5" width="1280" height="0.5" fill="#000000" fill-opacity="0.05"></rect></pattern></defs><rect width="1280" height="720" fill="#FFFFFF" data-demo-actor="demo-actor-1"></rect><rect x="80" y="96" width="1120" height="504" fill="url(#bl)" data-demo-actor="demo-actor-2"></rect><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#000000" data-demo-actor="demo-actor-3"><rect x="80" y="80" width="1120" height="2" data-demo-actor="demo-actor-4"></rect><text x="80" y="116" font-size="14" font-weight="700" data-demo-actor="demo-actor-5">1</text><text x="176" y="116" font-size="14" data-demo-actor="demo-actor-6">Systems thinking</text><text x="704" y="116" font-size="14" data-demo-actor="demo-actor-7">Diagram 1: from point to network</text><g font-size="92" font-weight="700" letter-spacing="-3" data-demo-actor="demo-actor-8"><text x="74" y="264" data-demo-actor="demo-actor-9">An idea</text><text x="74" y="360" data-demo-actor="demo-actor-10">becomes a</text><text x="74" y="456" data-demo-actor="demo-actor-11">connected</text><text x="74" y="552" data-demo-actor="demo-actor-12">system<tspan fill="#D32F2F">.</tspan></text></g><g fill="none" stroke="#000000" stroke-width="2" data-demo-actor="demo-actor-13"><path d="M720 264H1160" data-demo-actor="demo-actor-14"></path><path d="M800 264V168H1040V456" data-demo-actor="demo-actor-15"></path><path d="M920 264V552H1160V360H1040" data-demo-actor="demo-actor-16"></path><path d="M800 264V456H920" data-demo-actor="demo-actor-17"></path><path d="M1160 264V168" data-demo-actor="demo-actor-18"></path></g><g data-demo-actor="demo-actor-19"><rect x="792" y="160" width="16" height="16" data-demo-actor="demo-actor-20"></rect><rect x="1032" y="160" width="16" height="16" data-demo-actor="demo-actor-21"></rect><rect x="1152" y="160" width="16" height="16" data-demo-actor="demo-actor-22"></rect><rect x="912" y="256" width="16" height="16" data-demo-actor="demo-actor-23"></rect><rect x="1152" y="256" width="16" height="16" data-demo-actor="demo-actor-24"></rect><rect x="1032" y="352" width="16" height="16" data-demo-actor="demo-actor-25"></rect><rect x="792" y="448" width="16" height="16" data-demo-actor="demo-actor-26"></rect><rect x="1032" y="448" width="16" height="16" data-demo-actor="demo-actor-27"></rect><rect x="1152" y="544" width="16" height="16" data-demo-actor="demo-actor-28"></rect><circle cx="920" cy="456" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2" data-demo-actor="demo-actor-29"></circle><circle cx="920" cy="552" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2" data-demo-actor="demo-actor-30"></circle><circle cx="1040" cy="264" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2" data-demo-actor="demo-actor-31"></circle></g><circle cx="720" cy="264" r="16" fill="#D32F2F" data-demo-actor="demo-actor-32"></circle><text x="704" y="312" font-size="12" data-demo-actor="demo-actor-33">A</text><text x="1176" y="580" font-size="12" text-anchor="start" data-demo-actor="demo-actor-34">n</text><rect x="80" y="600" width="1120" height="1" data-demo-actor="demo-actor-35"></rect><g font-size="14" data-demo-actor="demo-actor-36"><text x="80" y="632" font-weight="700" data-demo-actor="demo-actor-37">Idea</text><text x="80" y="652" data-demo-actor="demo-actor-38">A single point.</text><text x="80" y="672" data-demo-actor="demo-actor-39">One source of intent.</text><text x="440" y="632" font-weight="700" data-demo-actor="demo-actor-40">Connection</text><text x="440" y="652" data-demo-actor="demo-actor-41">Orthogonal links follow</text><text x="440" y="672" data-demo-actor="demo-actor-42">the axes of the grid.</text><text x="704" y="632" font-weight="700" data-demo-actor="demo-actor-43">System</text><text x="704" y="652" data-demo-actor="demo-actor-44">Nodes settle on shared</text><text x="704" y="672" data-demo-actor="demo-actor-45">alignment points.</text><text x="1200" y="672" text-anchor="end" fill="#D32F2F" font-weight="700" data-demo-actor="demo-actor-46">1 → n</text></g></g></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-001","selectedReferenceIds":[],"rationale":"Swiss grid poster: a fixed left headline and footer columns, with an orthogonal diagram on the right that runs from red point A into a node network. The last render failed on a text-overlap check involving the 'system.' headline line and a footer label, so this plan leaves all type and rules untouched. Motion sits only in the diagram, about 20% of the frame, and follows its own logic. Point A pops in, then the orthogonal link group draws along the grid axes, then the square and circle nodes settle onto their shared alignment points. All of it is fully at rest by 1.7 s. The connections stay continuous. No reference is needed for this restrained build.","tracks":[{"actorId":"demo-actor-32","role":"Red origin point A pops in","action":"reveal","start":0,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-13","role":"Orthogonal link paths draw out from A","action":"draw","start":0.4,"duration":0.8,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-19","role":"Square and circle nodes settle on alignment points","action":"reveal","start":1.15,"duration":0.5,"ease":"sine.inOut","pose":{"x":0,"y":0,"scale":0.8,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#000000";
const background="#FFFFFF";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) prior.remove();
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
