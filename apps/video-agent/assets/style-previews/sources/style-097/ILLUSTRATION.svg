<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720'><rect width='1280' height='720' fill='#FAF7EF'/><defs><circle id='v' r='9' fill='#367E88'/></defs><g font-family='Helvetica Neue,Arial,sans-serif' fill='#263744'><text x='60' y='80' font-size='30' font-weight='700'>When ideas connect, links outgrow ideas</text><text x='60' y='112' font-size='16'>Possible links between n ideas: L = n(n−1)/2</text><g fill='none' stroke='#C17E49' stroke-width='2.5'><path d='M120 355L175 470L65 470Z'/><path d='M235 365H345V475H235ZM235 365L345 475M345 365L235 475'/><path d='M480 340L556 395L527 485L433 485L404 395ZM480 340L527 485L404 395L556 395L433 485Z'/></g><use href='#v' x='120' y='355'/><use href='#v' x='175' y='470'/><use href='#v' x='65' y='470'/><use href='#v' x='235' y='365'/><use href='#v' x='345' y='365'/><use href='#v' x='345' y='475'/><use href='#v' x='235' y='475'/><use href='#v' x='480' y='340'/><use href='#v' x='556' y='395'/><use href='#v' x='527' y='485'/><use href='#v' x='433' y='485'/><use href='#v' x='404' y='395'/><g font-size='14' text-anchor='middle'><text x='120' y='530'>n = 3 · L = 3</text><text x='290' y='530'>n = 4 · L = 6</text><text x='480' y='530'>n = 5 · L = 10</text></g><g stroke='#263744' stroke-opacity='.15'><path d='M700 470H1170M700 340H1170M700 210H1170'/></g><path d='M700 600H1170M700 600V190' stroke='#263744' stroke-width='1.5'/><polyline points='720,600 805,574 890,522 975,444 1060,340 1145,210' fill='none' stroke='#856B9A' stroke-width='3'/><g fill='#856B9A'><circle cx='720' cy='600' r='5'/><circle cx='805' cy='574' r='5'/><circle cx='890' cy='522' r='5'/><circle cx='975' cy='444' r='5'/><circle cx='1060' cy='340' r='5'/><circle cx='1145' cy='210' r='6'/></g><g font-size='13'><g text-anchor='middle'><text x='720' y='622'>1</text><text x='805' y='622'>2</text><text x='890' y='622'>3</text><text x='975' y='622'>4</text><text x='1060' y='622'>5</text><text x='1145' y='622'>6</text><text x='935' y='650'>ideas (n)</text></g><g text-anchor='end'><text x='690' y='604'>0</text><text x='690' y='474'>5</text><text x='690' y='344'>10</text><text x='690' y='214'>15</text></g><text x='1108' y='196' font-weight='700'>6 ideas → 15 links</text><text x='640' y='180'>possible links (L)</text></g><g font-size='13'><circle cx='72' cy='170' r='6' fill='#367E88'/><text x='86' y='175'>idea (node)</text><path d='M180 170H204' stroke='#C17E49' stroke-width='3'/><text x='212' y='175'>link</text><path d='M270 170H294' stroke='#856B9A' stroke-width='3'/><text x='302' y='175'>possible links L(n)</text></g></g></svg>