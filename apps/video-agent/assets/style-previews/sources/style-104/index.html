<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <p id="kicker" class="lettering">ACT ONE</p>
  <h1 id="title" class="lettering"><span class="w">An</span> <span class="w">Idea</span> <span class="w">Becomes</span> <span class="w">a</span> <span class="w">System</span></h1>

</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(function(){
  // ---- Centralised scene palette (scene-dependent night stage; approved tokens keep their roles) ----
  const C={
    night:'#0E1C20', wallLine:'#16292D',
    ringLo:'#1E3438', ringHi:'#39494B',
    floorTop:'#132629', floorBot:'#0A1517', seam:'#22393C',
    slate:'#39494B', sage:'#8B9A81', terracotta:'#B97D66', cream:'#EEE0C8',
    curtain:'#5E2226', curtainHi:'#7E3236', valance:'#4A1A1E',
    gold:'#C9A15A', amber:'#E9B35C'
  };
  const W=1280,H=720,FY=580,CX=640;
  const canvas=document.getElementById('stage');
  const ctx=canvas.getContext('2d');
  const clamp=v=>Math.max(0,Math.min(1,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const mix=(a,b,t)=>chroma.mix(a,b,clamp(t),'rgb').hex();
  const amberA=a=>chroma(C.amber).alpha(clamp(a)).css();

  // ---- Cached static layers (built once, never animated) ----
  function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const backLayer=document.createElement('canvas');backLayer.width=W;backLayer.height=H;
  (function(){const b=backLayer.getContext('2d');b.fillStyle=C.night;b.fillRect(0,0,W,H);
    b.strokeStyle=C.wallLine;b.lineWidth=2;for(let x=40;x<W;x+=80){b.beginPath();b.moveTo(x,70);b.lineTo(x,FY);b.stroke();}})();
  const grain=document.createElement('canvas');grain.width=W;grain.height=H;
  (function(){const g=grain.getContext('2d');const r=seeded(104);for(let i=0;i<9000;i++){const v=r();g.fillStyle=v>0.5?'rgba(238,224,200,0.035)':'rgba(0,0,0,0.05)';g.fillRect(Math.floor(r()*W),Math.floor(r()*H),1+Math.floor(r()*2),1);}})();

  // ---- Geometry helpers ----
  function quad(p0,c,p1,n){const pts=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;pts.push([u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]]);}return pts;}
  function strokePartial(pts,f){if(f<=0)return;let total=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);total+=d;}
    let left=total*clamp(f);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length&&left>0;i++){const d=seg[i-1];if(d<=left){ctx.lineTo(pts[i][0],pts[i][1]);left-=d;}else{const k=left/d;ctx.lineTo(lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k));left=0;}}
    ctx.stroke();}
  const sideLink=[...quad([592,356],[520,376],[430,438],24),...quad([430,438],[380,475],[330,512],8).slice(1)];
  const filament=quad([622,356],[640,316],[658,356],20);

  // ---- Animated state: the GSAP timeline is the only owner of these values ----
  const S={open:0,push:0,rings:0,lamp:0,glow:0,fil:0,ped:0,links:0,nodes:0,ledger:0};
  let queued=false;
  const P={};
  Object.keys(S).forEach(k=>Object.defineProperty(P,k,{enumerable:true,get(){return S[k];},set(v){S[k]=v;if(!queued){queued=true;queueMicrotask(()=>{queued=false;draw();});}}}));

  // ---- Scene drawing: a pure function of S ----
  function drawRings(){
    for(let i=0;i<8;i++){const r=70+i*56;
      ctx.lineWidth=14-i;ctx.strokeStyle=mix(C.ringLo,C.ringHi,S.rings*(1-i*0.06));
      ctx.beginPath();ctx.arc(CX,360,r,Math.PI,2*Math.PI);ctx.lineTo(CX+r,FY);ctx.moveTo(CX-r,FY);ctx.lineTo(CX-r,360);ctx.stroke();
      if(i<2&&S.glow>0){ctx.strokeStyle=amberA(0.45*S.glow);ctx.beginPath();ctx.arc(CX,360,r,Math.PI,2*Math.PI);ctx.stroke();}
    }
  }
  function drawGlow(){if(S.glow<=0)return;const g=ctx.createRadialGradient(CX,340,10,CX,340,300);
    g.addColorStop(0,amberA(0.38*S.glow));g.addColorStop(0.4,amberA(0.12*S.glow));g.addColorStop(1,amberA(0));
    ctx.fillStyle=g;ctx.fillRect(CX-300,40,600,FY-40);}
  function drawFloor(){const g=ctx.createLinearGradient(0,FY,0,H+60);g.addColorStop(0,C.floorTop);g.addColorStop(1,C.floorBot);ctx.fillStyle=g;ctx.fillRect(-200,FY,W+400,H-FY+80);
    ctx.strokeStyle=C.seam;ctx.lineWidth=2;for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(CX+i*72,FY);ctx.lineTo(CX+i*72*3.2,H+60);ctx.stroke();}
    for(const y of [612,652,706]){ctx.beginPath();ctx.moveTo(-200,y);ctx.lineTo(W+200,y);ctx.stroke();}
    if(S.glow>0){const r=ctx.createRadialGradient(CX,0,4,CX,0,240);r.addColorStop(0,amberA(0.3*S.glow));r.addColorStop(1,amberA(0));ctx.save();ctx.translate(0,FY+30);ctx.scale(1,0.35);ctx.fillStyle=r;ctx.fillRect(CX-260,-260,520,520);ctx.restore();}
    ctx.fillStyle=C.gold;ctx.fillRect(-200,FY-2,W+400,3);}
  function pedestal(x,w,top,nodeY,r,litFill,lit){
    ctx.fillStyle=C.slate;ctx.fillRect(x-w/2,top,w,FY-top);
    ctx.fillStyle=C.gold;ctx.fillRect(x-w/2-4,top-4,w+8,5);
    if(lit>0){ctx.fillStyle=amberA(0.35*lit);ctx.beginPath();ctx.arc(x,nodeY,r+10*lit,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=mix(C.slate,litFill,0.35+0.65*lit);ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,nodeY,r,0,Math.PI*2);ctx.fill();ctx.stroke();}
  function drawSide(mirror,reflect){
    ctx.save();if(mirror){ctx.translate(W,0);ctx.scale(-1,1);}

    ctx.save();ctx.translate(0,dy);

    pedestal(330,36,532,512,18,C.cream,clamp((S.nodes-0.5)/0.5));

    ctx.restore();}
  function drawLamp(){

    ctx.fillStyle=C.slate;ctx.fillRect(596,440,88,FY-440);ctx.fillRect(578,428,124,16);

    ctx.strokeStyle=C.cream;ctx.lineWidth=2;for(let i=0;i<5;i++){const f=clamp(S.ledger*5-i);if(f>0){ctx.beginPath();ctx.moveTo(618,484+i*12);ctx.lineTo(618+44*f,484+i*12);ctx.stroke();}}
    ctx.fillStyle=C.sage;ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.fillRect(620,398,40,30);ctx.strokeRect(620,398,40,30);
    ctx.fillStyle=mix(C.terracotta,C.amber,S.glow);ctx.strokeStyle=C.gold;ctx.lineWidth=5;ctx.beginPath();ctx.arc(CX,340,58,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle=C.cream;ctx.lineWidth=5;ctx.lineCap='round';strokePartial(filament,S.fil);ctx.lineCap='butt';
    ctx.restore();}
  function drawCurtain(mirror){
    const o=S.open,e=lerp(642,196,o),tx=lerp(e,e*0.6,o),bx=lerp(e,e*0.88,o);

    ctx.save();ctx.clip();

    const sh=ctx.createLinearGradient(0,0,e+40,0);sh.addColorStop(0,'rgba(0,0,0,0.35)');sh.addColorStop(0.7,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.25)');ctx.fillStyle=sh;ctx.fillRect(0,60,e+60,H);

    ctx.restore();}
  function drawProscenium(){
    ctx.fillStyle=C.slate;ctx.fillRect(0,0,24,H);ctx.fillRect(W-24,0,24,H);
    ctx.fillStyle=C.valance;ctx.beginPath();ctx.moveTo(0,70);for(let x=0;x<W;x+=80){ctx.quadraticCurveTo(x+40,104,x+80,70);}ctx.lineTo(W,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();

    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.setLineDash([]);
    ctx.drawImage(backLayer,0,0);
    // symmetric push-in of the inner set along the central axis (back wall, frame and grain stay fixed)
    const k=lerp(0.93,1,S.push);ctx.save();ctx.translate(CX,FY);ctx.scale(k,k);ctx.translate(-CX,-FY);

    ctx.save();ctx.beginPath();ctx.rect(-200,FY,W+400,H);ctx.clip();ctx.globalAlpha=0.16;ctx.translate(0,2*FY);ctx.scale(1,-1);
    ctx.save();ctx.beginPath();ctx.rect(-200,0,W+400,FY);ctx.clip();drawSide(false,true);drawSide(true,true);drawLamp();ctx.restore();
    ctx.restore();ctx.globalAlpha=1;
    // risers emerge from stage traps: clipped above the floor line
    ctx.save();ctx.beginPath();ctx.rect(-200,0,W+400,FY-1);ctx.clip();drawSide(false,false);drawSide(true,false);drawLamp();ctx.restore();
    ctx.restore();
    drawCurtain(false);drawCurtain(true);drawProscenium();

  const tl=gsap.timeline({paused:true,onUpdate:draw});
  tl.to(P,{open:1,duration:1.1,ease:'power2.inOut'},0.15)
    .to(P,{push:1,duration:2.3,ease:'sine.inOut'},0.1)
    .to(P,{rings:1,duration:1.0,ease:'sine.inOut'},0.6)
    .to(P,{lamp:1,duration:0.7,ease:'back.out(1.2)'},0.5)
    .to(P,{fil:1,duration:0.4,ease:'sine.inOut'},0.95)
    .to(P,{glow:1,duration:0.5,ease:'sine.inOut'},1.0)
    .to(P,{ped:1,duration:0.6,ease:'back.out(1.2)'},1.25)
    .to(P,{links:1,duration:0.65,ease:'power2.inOut'},1.3)
    .to(P,{nodes:1,duration:0.5,ease:'sine.inOut'},1.7)
    .to(P,{ledger:1,duration:0.5,ease:'power2.inOut'},2.0)
    .fromTo('#title .w',{x:i=>(i-2)*34},{x:0,duration:0.8,ease:'power2.inOut'},1.4)
    .fromTo('#rule',{scaleX:0},{scaleX:1,duration:0.6,ease:'power2.inOut'},1.8)
    .to({},{duration:0.001},2.999);
  tl.seek(0);draw();
  window.addEventListener('hf-seek',()=>draw());
  window.__timelines=window.__timelines||{};
  window.__timelines.video=tl;
})();
</script>
