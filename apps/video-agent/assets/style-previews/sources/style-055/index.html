<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sticker Collage — idea becomes a connected system</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#13222A}
  #root{position:relative;width:100%;height:100%;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block}
  .type{font-family:"Avenir Next","Avenir","Trebuchet MS","Verdana",sans-serif;font-weight:800}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Stationary dot-grid surface -->
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#2E4955"/>
    </pattern>
    <!-- Die-cut border: expand the art's alpha mask, flood white, put art on top -->
    <filter id="f-border" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
      <feFlood flood-color="#FFFFFF" result="white"/>
      <feComposite in="white" in2="grow" operator="in" result="edge"/>
      <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Contact shadow: same expanded mask, softened -->
    <filter id="f-shadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
      <feGaussianBlur in="grow" stdDeviation="5" result="soft"/>
      <feFlood flood-color="#05090B" result="ink"/>
      <feComposite in="ink" in2="soft" operator="in"/>
    </filter>
    <!-- Backing side of a peeled flap: expanded mask in a cool paper grey with its own small shadow -->
    <filter id="f-back" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
      <feFlood flood-color="#DCE4E7" result="paper"/>
      <feComposite in="paper" in2="grow" operator="in" result="flap"/>
      <feGaussianBlur in="grow" stdDeviation="4" result="sb"/>
      <feOffset in="sb" dx="4" dy="5" result="so"/>
      <feFlood flood-color="#05090B" flood-opacity="0.45" result="sk"/>
      <feComposite in="sk" in2="so" operator="in" result="fshadow"/>
      <feMerge><feMergeNode in="fshadow"/><feMergeNode in="flap"/></feMerge>
    </filter>

    <!-- Sticker artwork, authored centred on (0,0) -->
    <g id="art-bulb">
      <path d="M0 -160a120 120 0 0 1 70 218v40h-140v-40a120 120 0 0 1 70 -218z" fill="#D78267"/>
      <rect x="-58" y="106" width="116" height="54" rx="14" fill="#273F49"/>
      <path d="M-30 -30a40 40 0 0 1 40 -40" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="art-hub"><circle r="58" fill="#77A397"/><circle r="14" fill="#FFFFFF"/></g>
    <g id="art-plus"><circle r="58" fill="#273F49"/><path d="M-20 0h40M0 -20v40" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
    <g id="art-coral"><circle r="58" fill="#D78267"/><circle cx="-18" r="6" fill="#FFFFFF"/><circle r="6" fill="#FFFFFF"/><circle cx="18" r="6" fill="#FFFFFF"/></g>
    <g id="art-leaf"><circle r="58" fill="#77A397"/><path d="M-18 2l12 12l24 -26" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="art-label"><rect x="-180" y="-48" width="360" height="96" rx="22" fill="#FFFFFF"/></g>

    <clipPath id="cf-bulb" clipPathUnits="userSpaceOnUse"><polygon id="pf-bulb"/></clipPath>
    <clipPath id="cb-bulb" clipPathUnits="userSpaceOnUse"><polygon id="pb-bulb"/></clipPath>
    <clipPath id="cf-label" clipPathUnits="userSpaceOnUse"><polygon id="pf-label"/></clipPath>
    <clipPath id="cb-label" clipPathUnits="userSpaceOnUse"><polygon id="pb-label"/></clipPath>
  </defs>

  <!-- Stationary surface -->
  <rect width="1280" height="720" fill="#13222A"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Standalone heading (independent timing: static, readable throughout) -->
  <text class="type" x="130" y="96" font-size="44" fill="#FFFFFF">From one spark to a whole <tspan fill="#D78267">network</tspan></text>

  <!-- Rough.js connectors are inserted here, under the stickers -->
  <g id="links"></g>

  <!-- Spark accent ticks around the bulb (GSAP-owned) -->
  <g id="spark" transform="translate(330 330)"></g>

  <g id="stickers"></g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="rough.bundle.js"></script>
<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('stage');
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

  // ---------- Palette check (resolved scene palette) ----------
  const FIELD = '#13222A';
  if (window.chroma) {
    const c = window.chroma;
    window.__paletteContrast = {
      headingWhite: c.contrast('#FFFFFF', FIELD), headingCoral: c.contrast('#D78267', FIELD),
      link: c.contrast('#C9D7DC', FIELD), labelInk: c.contrast('#273F49', '#FFFFFF')
    };
  }

  // ---------- Sticker construction ----------
  // Each sticker: home (static placement) > place (drop/rotate/scale) > [shadow, lift > (front, flap, label)]
  const stickerDefs = [
    { id: 'bulb',  art: 'art-bulb',  x: 330,  y: 330, rot: -8, curl: { ux: 0.70710678, uy: -0.70710678, dFlat: 200, dCurl: 72 } },
    { id: 'hub',   art: 'art-hub',   x: 720,  y: 250, rot: 0 },
    { id: 'plus',  art: 'art-plus',  x: 960,  y: 360, rot: 0 },
    { id: 'coral', art: 'art-coral', x: 1060, y: 190, rot: 0 },
    { id: 'leaf',  art: 'art-leaf',  x: 900,  y: 520, rot: 0 },
    { id: 'label', art: 'art-label', x: 340,  y: 598, rot: 4, curl: { ux: 0.85749293, uy: 0.51449576, dFlat: 215, dCurl: 120 } }
  ];
  const host = document.getElementById('stickers');
  const S = {};
  for (const d of stickerDefs) {
    const home = mk('g', { transform: `translate(${d.x} ${d.y}) rotate(${d.rot})`, id: 'sticker-' + d.id }, host);
    const place = mk('g', {}, home);
    const shadow = mk('g', {}, place);
    mk('use', { href: '#' + d.art, filter: 'url(#f-shadow)' }, shadow);
    const lift = mk('g', {}, place);
    const front = mk('g', d.curl ? { 'clip-path': `url(#cf-${d.id})` } : {}, lift);
    mk('use', { href: '#' + d.art, filter: 'url(#f-border)' }, front);
    let flap = null;
    if (d.curl) {
      flap = mk('g', {}, lift);
      const inner = mk('g', { 'clip-path': `url(#cb-${d.id})` }, flap);
      mk('use', { href: '#' + d.art, filter: 'url(#f-back)' }, inner);
    }
    // state owned by GSAP tweens on this plain object; render() is the single DOM writer
    S[d.id] = { d, place, shadow, lift, flap,
      st: { px: 0, py: 0, pr: 0, ps: 1, po: 0, ly: 0, ls: 1, sx: 5, sy: 8, so: 0.5, curl: 0 } };
  }
  // Label copy, revealed only once the label sticker is flat and complete
  const labelText = mk('text', { class: 'type', x: 0, y: 13, 'text-anchor': 'middle', 'font-size': 36, fill: '#273F49',
    'data-reveal-after': 'sticker-label', opacity: 0 }, S.label.lift);
  labelText.textContent = 'IDEA → SYSTEM';
  const labelState = { o: 0 };

  // ---------- Procedural paper curl / fold ----------
  function curlGeometry(id) {
    const s = S[id], c = s.d.curl, k = s.st.curl;
    const ux = c.ux, uy = c.uy, vx = -uy, vy = ux;
    const dist = c.dFlat + (c.dCurl - c.dFlat) * k;          // fold line distance from centre along u
    const Px = ux * dist, Py = uy * dist, B = 2000;
    const pt = (a, b) => `${(Px + vx * a + ux * b).toFixed(2)},${(Py + vy * a + uy * b).toFixed(2)}`;
    document.getElementById('pf-' + id).setAttribute('points', [pt(B, 0), pt(-B, 0), pt(-B, -B), pt(B, -B)].join(' '));
    document.getElementById('pb-' + id).setAttribute('points', [pt(B, 0), pt(-B, 0), pt(-B, B), pt(B, B)].join(' '));
    // reflection across the fold line: x' = x - 2((x-P)·u)u
    const pd = Px * ux + Py * uy;
    const m = [1 - 2 * ux * ux, -2 * ux * uy, -2 * ux * uy, 1 - 2 * uy * uy, 2 * pd * ux, 2 * pd * uy];
    s.flap.setAttribute('transform', `matrix(${m.map(v => v.toFixed(5)).join(' ')})`);
    s.flap.setAttribute('opacity', k > 0.002 ? 1 : 0);
  }

  // ---------- Rough.js connectors (seeded, generated once) ----------
  const gen = window.rough.generator();
  const linkDefs = [
    { a: [418, 318], b: [654, 262], seed: 11 },
    { a: [778, 278], b: [900, 340], seed: 23 },
    { a: [785, 238], b: [995, 202], seed: 37 },
    { a: [937, 422], b: [923, 458], seed: 41 }
  ];
  const linksHost = document.getElementById('links');
  const linkPaths = linkDefs.map(L => {
    const drawable = gen.line(L.a[0], L.a[1], L.b[0], L.b[1], { seed: L.seed, roughness: 1.4, bowing: 2.2, stroke: '#C9D7DC', strokeWidth: 3.5 });
    return gen.toPaths(drawable).map(p => {
      const el = mk('path', { d: p.d, fill: 'none', stroke: '#C9D7DC', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, linksHost);
      const len = el.getTotalLength();
      el.style.strokeDasharray = `${len} ${len}`;
      el.style.strokeDashoffset = len;
      return el;
    });
  });

  // ---------- Spark ticks ----------
  const sparkHost = document.getElementById('spark');
  const ticks = [];
  for (let i = 0; i < 7; i++) {
    const ang = (-150 + i * 22) * Math.PI / 180;
    const g = mk('g', { transform: `rotate(${(ang * 180 / Math.PI).toFixed(2)})` }, sparkHost);
    const ln = mk('line', { x1: 180, y1: 0, x2: 206, y2: 0, stroke: '#FFFFFF', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0 }, g);
    ticks.push({ ln, st: { r: 168, o: 0 } });
  }

  // ---------- Single DOM writer ----------
  function render() {
    for (const id in S) {
      const s = S[id], t = s.st;
      s.place.setAttribute('transform', `translate(${t.px.toFixed(2)} ${t.py.toFixed(2)}) rotate(${t.pr.toFixed(3)}) scale(${t.ps.toFixed(4)})`);
      s.place.setAttribute('opacity', t.po.toFixed(4));
      s.lift.setAttribute('transform', `translate(0 ${t.ly.toFixed(2)}) scale(${t.ls.toFixed(4)})`);
      s.shadow.setAttribute('transform', `translate(${t.sx.toFixed(2)} ${t.sy.toFixed(2)})`);
      s.shadow.setAttribute('opacity', t.so.toFixed(4));
      if (s.flap) curlGeometry(id);
    }
    labelText.setAttribute('opacity', labelState.o.toFixed(4));
    for (const tk of ticks) {
      tk.ln.setAttribute('x1', tk.st.r.toFixed(2)); tk.ln.setAttribute('x2', (tk.st.r + 26).toFixed(2));
      tk.ln.setAttribute('opacity', tk.st.o.toFixed(4));
    }
  }

  // ---------- Timeline ----------
  const tl = gsap.timeline({ paused: true, onUpdate: render });

  // Initial (pre-placement) states, lifted above the surface
  function lifted(id, o) { Object.assign(S[id].st, { po: 0, ly: -26, ls: 1.12, sx: 22, sy: 30, so: 0.22 }, o || {}); }
  lifted('bulb', { py: -70, pr: -14, curl: 1 });
  ['hub', 'plus', 'coral', 'leaf'].forEach((id, i) => lifted(id, { ps: 0.55, pr: i % 2 ? -16 : 16 }));
  lifted('label', { py: -46, pr: 10, curl: 1 });

  function place(id, at, dur, travelEase) {
    const st = S[id].st;
    tl.to(st, { po: 1, duration: 0.12, ease: 'none' }, at);
    tl.to(st, { px: 0, py: 0, pr: 0, ps: 1, duration: dur, ease: travelEase }, at);
    // lift resolves as the sticker presses into the surface
    tl.to(st, { ly: 0, ls: 1, sx: 5, sy: 8, so: 0.5, duration: dur * 0.75, ease: 'power2.inOut' }, at + dur * 0.4);
  }

  // Beat 1: the idea sticker is peeled up, carried and pressed down
  place('bulb', 0.0, 0.55, 'power2.out');
  tl.to(S.bulb.st, { curl: 0, duration: 0.45, ease: 'power2.inOut' }, 0.5);
  ticks.forEach((tk, i) => {
    tl.to(tk.st, { o: 1, duration: 0.08, ease: 'none' }, 0.56 + i * 0.012);
    tl.to(tk.st, { r: 214, duration: 0.36, ease: 'power2.out' }, 0.56 + i * 0.012);
    tl.to(tk.st, { o: 0, duration: 0.2, ease: 'none' }, 0.74 + i * 0.012);
  });

  // Beat 2: the system grows — nodes placed, rough links drawn as each node lands
  place('hub',   0.85, 0.36, 'back.out(1.6)');
  place('plus',  1.05, 0.36, 'back.out(1.6)');
  place('coral', 1.20, 0.36, 'back.out(1.6)');
  place('leaf',  1.38, 0.36, 'back.out(1.6)');
  const linkTimes = [[0.95, 0.32], [1.22, 0.26], [1.34, 0.3], [1.56, 0.2]];
  linkPaths.forEach((paths, i) => paths.forEach(p => tl.to(p, { strokeDashoffset: 0, duration: linkTimes[i][1], ease: 'power2.inOut' }, linkTimes[i][0])));

  // Beat 3: the label sticker is slapped on, its corner smoothed flat, then the copy appears
  place('label', 1.62, 0.42, 'power2.out');
  tl.to(S.label.st, { curl: 0, duration: 0.4, ease: 'power2.inOut' }, 1.86);
  tl.to(labelState, { o: 1, duration: 0.14, ease: 'none' }, 2.27);

  tl.to({}, { duration: 0.001 }, 2.999);
  tl.progress(0);
  render();

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  const reseek = (e) => {
    const t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    tl.seek(t, false); render();
  };
  window.addEventListener('hf-seek', reseek);
  document.addEventListener('hf-seek', reseek);
})();
</script>
