<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixilation — An idea becomes a connected system</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#12181D}
  #root{position:relative;width:100%;height:100%;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .txt{position:absolute;margin:0;font-family:"Courier New",Courier,monospace;color:#EEE7DC;white-space:nowrap}
  #headline{left:60px;top:48px;font-size:44px;line-height:54px;font-weight:700}
  #pose{left:836px;top:92px;font-size:18px;line-height:22px;font-weight:700}
  #note{left:836px;top:118px;font-size:15px;line-height:20px;font-weight:700}
  #slate{left:60px;top:681px;font-size:17px;line-height:22px;font-weight:700}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <h1 class="txt" id="headline">AN IDEA BECOMES<br>A CONNECTED SYSTEM</h1>
  <p class="txt" id="pose">POSE 01 / 32</p>
  <p class="txt" id="note">EACH POSE HELD 2 FRAMES · 15/S</p>
  <p class="txt" id="slate">TAKE 07 · SLIDE, NO STEPS · SAME COAT, SAME LIGHT</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(() => {
  // ---------- Centralised settings ----------
  const W = 1280, H = 720, EXP_RATE = 15, LAST = 31, FOOT = 600, D2R = Math.PI / 180;
  const C = {
    wallTop: '#1A2229', wallLow: '#27323B', floorFar: '#3F474E', floorNear: '#646D74',
    ink: '#343C43', light: '#EEE7DC', sage: '#8A9288', bar: '#12181D', lamp: '#FFF1CF'
  };
  // Palette validation (chroma-js): text roles must stay readable on their backings.
  for (const k in C) if (!chroma.valid(C[k])) throw Error('Invalid colour ' + k);
  if (chroma.contrast(C.light, C.wallTop) < 4.5 || chroma.contrast(C.light, C.bar) < 4.5) throw Error('Text contrast below target');

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const poseEl = document.getElementById('pose');

  // ---------- Deterministic hash (no unseeded randomness) ----------
  function hash(a, b) {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const MARKS = [230, 500, 770, 1040];

  // ---------- Stationary set: pre-rendered once (wall, floor, tape marks, grain, vignette) ----------
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  (function buildSet() {
    const g = bg.getContext('2d');
    let gr = g.createLinearGradient(0, 0, 0, 470);
    gr.addColorStop(0, C.wallTop); gr.addColorStop(1, C.wallLow);
    g.fillStyle = gr; g.fillRect(0, 0, W, 470);
    // key-light pool on the studio wall
    gr = g.createRadialGradient(560, 380, 20, 560, 380, 640);
    gr.addColorStop(0, 'rgba(132,150,164,0.30)'); gr.addColorStop(1, 'rgba(132,150,164,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, 470);
    // concrete floor
    gr = g.createLinearGradient(0, 470, 0, H);
    gr.addColorStop(0, C.floorFar); gr.addColorStop(1, C.floorNear);
    g.fillStyle = gr; g.fillRect(0, 470, W, H - 470);
    g.strokeStyle = 'rgba(138,146,136,0.16)'; g.lineWidth = 1;
    for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(640 + i * 70, 470); g.lineTo(640 + i * 260, H); g.stroke(); }
    for (const y of [492, 524, 570, 634]) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.fillStyle = '#161C21'; g.fillRect(0, 462, W, 9);
    // gaffer-tape floor marks: the planned pose positions
    g.strokeStyle = 'rgba(238,231,220,0.72)'; g.lineWidth = 5; g.lineCap = 'butt';
    for (const x of MARKS) { g.beginPath(); g.moveTo(x - 16, FOOT + 22); g.lineTo(x + 16, FOOT + 22); g.moveTo(x, FOOT + 12); g.lineTo(x, FOOT + 32); g.stroke(); }
    // stationary photographic grain (seeded)
    const img = g.getImageData(0, 0, W, H), d = img.data, rnd = mulberry32(89);
    for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    gr = g.createRadialGradient(640, 360, 280, 640, 360, 820);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // slate bar backing for the caption
    g.fillStyle = C.bar; g.fillRect(0, 668, W, 52);
  })();

  // ---------- Exposure sheet: pose planned per exposure index ----------
  const CAST = [
    { skin: '#C99A7A', hair: '#2A1E18' },
    { skin: '#8D5B3E', hair: '#141012' },
    { skin: '#E2B998', hair: '#6B4A2E' },
    { skin: '#A8775A', hair: '#2F2A28' }
  ];
  const SLIDES = [null, { start: 5, n: 10 }, { start: 9, n: 8 }, { start: 13, n: 7 }]; // all arrive by e20
  const FROM = 1420;

  function slideX(e, s, to) {
    if (e <= s.start) return FROM;
    if (e >= s.start + s.n) return to;
    const u = (e - s.start) / s.n;
    return FROM + (to - FROM) * (1 - Math.pow(1 - u, 2));
  }

  function poseFor(i, e) {
    const boil = (hash(e, i * 7 + 1) - 0.5);           // held-pose wobble of a live performer
    const p = { i, x: MARKS[i] + boil * 1.6, lean: 0, armL: 10, armR: 10, tilt: boil * 2.4, bulb: false, ...CAST[i] };
    if (i === 0) {
      p.armL = 12;
      p.armR = e < 2 ? 18 : e === 2 ? 75 : e < 20 ? 168 : 140;
      p.lean = e === 2 ? -1.5 : e === 3 ? -3 : 0;
      p.tilt += e < 3 ? 0 : e < 20 ? -9 : 6;
      p.bulb = true; p.bulbOn = e >= 4;
      return p;
    }
    const s = SLIDES[i], end = s.start + s.n;
    p.x = slideX(e, s, MARKS[i]) + (e >= end ? boil * 1.6 : 0);
    if (e > s.start && e < end) { p.lean = -6; p.armL = 14; p.armR = 26; p.tilt = -3; }
    else if (e === end) { p.lean = 2.5; }
    if (e >= 20) { p.armL = 40; p.armR = 40; }
    return p;
  }

  function hand(p, side) {
    const a = (side < 0 ? p.armL : p.armR) * D2R;
    const lx = side * 27 + side * Math.sin(a) * 100, ly = -244 + Math.cos(a) * 100;
    const r = p.lean * D2R;
    return { x: p.x + lx * Math.cos(r) - ly * Math.sin(r), y: FOOT + lx * Math.sin(r) + ly * Math.cos(r), a, side };
  }

  function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

  function drawPerson(p) {
    if (p.x > W + 80) return;
    const coatLit = chroma(C.sage).brighten(0.35).hex(), coatDark = chroma(C.sage).darken(1.1).hex();
    // contact shadow + long key-light shadow on the floor
    ctx.fillStyle = 'rgba(8,11,14,0.45)'; ellipse(p.x + 6, FOOT + 3, 48, 9);
    ctx.fillStyle = 'rgba(8,11,14,0.18)';
    ctx.beginPath(); ctx.moveTo(p.x - 18, FOOT); ctx.lineTo(p.x + 18, FOOT); ctx.lineTo(p.x + 175, FOOT + 36); ctx.lineTo(p.x + 122, FOOT + 42); ctx.closePath(); ctx.fill();

    ctx.save(); ctx.translate(p.x, FOOT); ctx.rotate(p.lean * D2R);
    // trousers (feet together: a slide, not a step)
    let g = ctx.createLinearGradient(-18, 0, 18, 0); g.addColorStop(0, '#4A535B'); g.addColorStop(1, '#232A30');
    ctx.fillStyle = g; rrect(-18, -128, 15, 124, 3); rrect(3, -128, 15, 124, 3);
    ctx.fillStyle = '#111518'; rrect(-23, -8, 21, 9, 4); rrect(2, -8, 23, 9, 4);
    // coat — same coat for every performer and exposure
    g = ctx.createLinearGradient(-38, 0, 38, 0); g.addColorStop(0, coatLit); g.addColorStop(0.45, C.sage); g.addColorStop(1, coatDark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-30, -250); ctx.quadraticCurveTo(0, -262, 30, -250); ctx.lineTo(38, -116); ctx.lineTo(-38, -116); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(-10, -254); ctx.lineTo(10, -254); ctx.lineTo(0, -214); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,24,28,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -214); ctx.lineTo(0, -118); ctx.stroke();
    ctx.fillStyle = '#2B3238'; for (const y of [-196, -170, -144]) ellipse(-4, y, 2.4, 2.4);
    ctx.strokeStyle = 'rgba(255,246,228,0.42)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-30, -250); ctx.lineTo(-38, -116); ctx.stroke();
    // neck + head
    ctx.fillStyle = chroma(p.skin).darken(0.5).hex(); ctx.fillRect(-7, -270, 14, 20);
    ctx.save(); ctx.translate(0, -284); ctx.rotate(p.tilt * D2R);
    g = ctx.createRadialGradient(-7, -8, 3, 0, 0, 26); g.addColorStop(0, chroma(p.skin).brighten(0.4).hex()); g.addColorStop(1, chroma(p.skin).darken(0.7).hex());
    ctx.fillStyle = g; ellipse(0, 0, 19, 23);
    ctx.fillStyle = p.hair; ctx.beginPath(); ctx.ellipse(0, -6, 20.5, 19, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillRect(-20.5, -8, 5, 12);
    ctx.restore();
    // arms
    for (const side of [-1, 1]) {
      const a = (side < 0 ? p.armL : p.armR) * D2R, sx = side * 27, sy = -244;
      const hx = sx + side * Math.sin(a) * 100, hy = sy + Math.cos(a) * 100;
      ctx.lineCap = 'round';
      ctx.strokeStyle = side < 0 ? chroma(C.sage).darken(0.15).hex() : chroma(C.sage).darken(0.7).hex();
      ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,246,228,0.22)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx - 4, sy); ctx.lineTo(hx - 4, hy); ctx.stroke();
      ctx.fillStyle = p.skin; ellipse(hx, hy, 8.5, 8.5);
    }
    ctx.restore();
  }

  function bulbPos(pA) { const h = hand(pA, 1); return { x: h.x + Math.sin(h.a) * 16, y: h.y + Math.cos(h.a) * 16 }; }

  function glow(x, y, r, a) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,236,200,' + a + ')'); g.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
  }

  function drawBulb(pA) {
    const b = bulbPos(pA);
    if (pA.bulbOn) { glow(b.x, b.y, 440, 0.07); glow(b.x, b.y, 110, 0.5); }
    ctx.fillStyle = '#2B3238'; rrect(b.x - 6, b.y + 9, 12, 9, 2);
    ctx.fillStyle = pA.bulbOn ? C.lamp : '#6F777C'; ellipse(b.x, b.y, 13, 14);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(b.x, b.y, 13, 14, 0, 0, Math.PI * 2); ctx.stroke();
  }

  // ---------- Cable: a physical prop re-positioned once per exposure ----------
  function cablePath(ps) {
    const b = bulbPos(ps[0]);
    const pts = [b];
    const segs = [];
    let prev = b;
    for (let i = 1; i < 4; i++) {
      const L = hand(ps[i], -1), R = hand(ps[i], 1);
      segs.push({ a: prev, b: L, sag: 30, node: true });
      segs.push({ a: L, b: R, sag: 8, node: false });
      prev = R;
    }
    const poly = [{ x: b.x, y: b.y, s: 0 }], nodes = [];
    let len = 0;
    for (const sg of segs) {
      const cx = (sg.a.x + sg.b.x) / 2, cy = (sg.a.y + sg.b.y) / 2 + sg.sag * 2;
      let px = sg.a.x, py = sg.a.y;
      for (let k = 1; k <= 24; k++) {
        const t = k / 24, u = 1 - t;
        const x = u * u * sg.a.x + 2 * u * t * cx + t * t * sg.b.x, y = u * u * sg.a.y + 2 * u * t * cy + t * t * sg.b.y;
        len += Math.hypot(x - px, y - py); poly.push({ x, y, s: len }); px = x; py = y;
        if (sg.node && k === 12) nodes.push({ x, y, s: len, r: 8 });
      }
    }
    nodes.push({ x: prev.x, y: prev.y, s: len, r: 10 });
    return { poly, nodes, len };
  }

  function drawCable(ps, e) {
    const progress = Math.min(1, Math.max(0, (e - 20) / 11));
    if (progress <= 0) return;
    const { poly, nodes, len } = cablePath(ps), lim = len * progress;
    const trace = (dy) => { ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y + dy); for (const q of poly) { if (q.s > lim) break; ctx.lineTo(q.x, q.y + dy); } ctx.stroke(); };
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(8,11,14,0.5)'; ctx.lineWidth = 6; trace(3);
    ctx.strokeStyle = C.light; ctx.lineWidth = 3.5; trace(0);
    for (const n of nodes) {
      const on = n.s <= lim + 0.5;
      if (on) glow(n.x, n.y, 52, 0.55);
      ctx.fillStyle = on ? C.lamp : '#59636B'; ellipse(n.x, n.y, n.r, n.r);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawSheet(poseNo) {
    const x0 = 836, y0 = 56;
    for (let k = 0; k < 32; k++) {
      const x = x0 + k * 12.5;
      ctx.fillStyle = k + 1 < poseNo ? C.sage : k + 1 === poseNo ? C.light : 'rgba(0,0,0,0)';
      ctx.fillRect(x, y0, 10, 22);
      ctx.strokeStyle = 'rgba(238,231,220,0.55)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y0 + 0.5, 9, 21);
    }
  }

  // ---------- Render: everything derives from composition time ----------
  function render(t) {
    const raw = Math.floor(Math.max(0, t) * EXP_RATE + 1e-6);
    const e = Math.min(raw, LAST);                 // exposure index; final pose held after LAST
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    const ps = [0, 1, 2, 3].map(i => poseFor(i, e));
    for (let i = 3; i >= 0; i--) drawPerson(ps[i]);
    drawBulb(ps[0]);
    drawCable(ps, e);
    ctx.fillStyle = C.bar; ctx.fillRect(0, 668, W, 52);
    const poseNo = e + 1;
    drawSheet(poseNo);
    const label = 'POSE ' + String(poseNo).padStart(2, '0') + ' / 32' + (raw >= LAST ? ' · FINAL HOLD' : '');
    if (poseEl.textContent !== label) poseEl.textContent = label;
  }

  // ---------- GSAP: single owner of composition time ----------
  const state = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(state, { t: 3, duration: 3, ease: 'none', onUpdate: () => render(state.t) }, 0);
  tl.addLabel('idea', 0).addLabel('slides', 1 / 3).addLabel('link', 21 / 15).addLabel('hold', LAST / 15);
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener('hf-seek', () => render(tl.time()));
  render(0);
})();
</script>
