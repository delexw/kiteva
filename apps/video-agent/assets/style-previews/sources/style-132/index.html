<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IDÉE — Cubist Painted Collage preview</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #2F3833; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; background: #2F3833; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @font-face { font-family: 'Didot'; src: local('Didot'); font-style: normal; font-weight: 400; }
  @font-face { font-family: 'Didot'; src: local('Didot Italic'), local('Didot-Italic'); font-style: italic; font-weight: 400; }

  .sans { font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif; }

<script src="gsap.min.js"></script>

<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs id="defs">
    <pattern id="ruled" width="90" height="14" patternUnits="userSpaceOnUse">
      <rect width="90" height="14" fill="#ECE4D0"/>
      <path d="M2 7h30M36 7h18M58 7h28" stroke="#332E29" stroke-width="2.5"/>
    </pattern>
    <pattern id="ruled-plain" width="60" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="60" height="12" fill="#ECE4D0"/>
      <path d="M0 6h60" stroke="#85867D" stroke-width="2"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 5h10" stroke="#332E29" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Stationary background field -->
  <rect id="bg" width="1280" height="720" fill="#2F3833"/>
  <rect id="bg-grain" width="1280" height="720" fill="#2F3833"/>

  <!-- Still life: facet groups are filled in by script from cached Paper.js geometry -->
  <g id="scene"></g>

  <!-- Standalone headings (independent timing: static, always readable) -->
  <g id="copy">
    <text x="60" y="130" font-size="78" fill="#ECE4D0" class="sans" font-weight="bold" letter-spacing="10">IDÉE</text>
    <text x="62" y="190" font-size="30" fill="#ECE4D0" class="serif" font-style="italic" fill-opacity="1">an idea becomes</text>
    <text x="62" y="232" font-size="30" fill="#ECE4D0" class="serif" font-style="italic">a connected system</text>
    <path d="M60 260h300" stroke="#AD9369" stroke-width="3"/>
  </g>

  <!-- Label card: text grouped with its paper backing -->
  <g id="label-card">
    <rect id="label-box" x="1060" y="640" width="190" height="52" fill="#ECE4D0" stroke="#332E29" stroke-width="2"/>
    <text x="1155" y="673" font-size="19" fill="#332E29" class="serif" text-anchor="middle" letter-spacing="3" data-reveal-after="label-box">PAPIER COLLÉ</text>
  </g>
</svg>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var G = window.CUBIST_GEOMETRY;
  var TONE = { ochre: '#AD9369', gray: '#85867D', umber: '#705F4B', paper: '#ECE4D0', ink: '#332E29' };
  var INK = '#332E29';
  var defs = document.getElementById('defs');
  var scene = document.getElementById('scene');

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  // Seeded PRNG (mulberry32) + string hash: textures are identical on every load.
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // Canvas 2D scumble bitmap (tileable), drawn once per facet with a seeded PRNG.
  // Strokes run along the pattern's x axis; the SVG patternTransform orients them to the plane.
  var SIZE = 160;
  function scumble(id, tone) {
    var c = document.createElement('canvas'); c.width = SIZE; c.height = SIZE;
    var x = c.getContext('2d'); var r = rng(hash(id));
    var light = TONE.paper, dark = tone === 'paper' ? TONE.gray : INK;
    var mids = [TONE.ochre, TONE.umber, TONE.gray];
    x.lineCap = 'round';
    for (var i = 0; i < 90; i++) {
      var px = r() * SIZE, py = r() * SIZE, len = 18 + r() * 46, w = 3 + r() * 9;
      var pick = r();
      x.strokeStyle = pick < 0.42 ? light : pick < 0.72 ? dark : mids[(r() * 3) | 0];
      x.globalAlpha = 0.06 + r() * 0.12;
      x.lineWidth = w;
      var bend = (r() - 0.5) * 10;
      for (var ox = -SIZE; ox <= SIZE; ox += SIZE) for (var oy = -SIZE; oy <= SIZE; oy += SIZE) {
        x.beginPath();
        x.moveTo(px + ox, py + oy);
        x.quadraticCurveTo(px + ox + len / 2, py + oy + bend, px + ox + len, py + oy + (r() - 0.5) * 3);
        x.stroke();
      }
    }
    return c.toDataURL('image/png');
  }

  // Stationary scene-dependent wall: dark slate café wall with seeded Canvas 2D grain (never animated).
  (function () {
    var W = 320, c = document.createElement('canvas'); c.width = W; c.height = W;
    var x = c.getContext('2d'), r = rng(hash('cafe-wall'));
    x.fillStyle = '#2F3833'; x.fillRect(0, 0, W, W); x.lineCap = 'round';
    for (var i = 0; i < 160; i++) {
      var px = r() * W, py = r() * W, len = 30 + r() * 70;
      x.strokeStyle = r() < 0.5 ? '#3A443E' : '#262D29'; x.globalAlpha = 0.35 + r() * 0.35; x.lineWidth = 6 + r() * 14;
      for (var ox = -W; ox <= W; ox += W) for (var oy = -W; oy <= W; oy += W) {
        x.beginPath(); x.moveTo(px + ox, py + oy); x.lineTo(px + ox + len * 0.94, py + oy + len * 0.34); x.stroke();
      }
    }
    var pat = el('pattern', { id: 'wall-grain', width: W, height: W, patternUnits: 'userSpaceOnUse' }, defs);
    var im = el('image', { width: W, height: W, href: c.toDataURL('image/png') }, pat);
    document.getElementById('bg-grain').setAttribute('fill', 'url(#wall-grain)');
  })();

  // Per-view registration offsets (authored): where each viewpoint starts before it locks in.
  var OFFSET = {
    'wall-plane-a': [-70, -36], 'wall-plane-ab': [0, -60], 'wall-plane-b': [80, -24],
    'table-top': [-96, 34], 'table-top-x-front': [0, 60], 'table-front': [96, 70],
    'guitar-front': [-130, 40], 'guitar-front-x-profile': [-10, -40], 'guitar-profile': [120, -70], 'guitar-neck': [-60, -110],
    'guitar-soundhole': [-130, 40], 'guitar-bridge': [-130, 40],
    'bottle-profile': [-110, 20], 'bottle-profile-x-top': [-40, -60], 'bottle-top': [40, -110],
    'glass-profile': [110, 60], 'glass-profile-x-rim': [120, 0], 'glass-rim': [130, -80]
  };
  // Line work follows its view's offset.
  var LINE_VIEW = {
    tableTop: 'table-top', tableFront: 'table-front',
    guitarFront: 'guitar-front', guitarProfile: 'guitar-profile', guitarNeck: 'guitar-neck', guitarStrings: 'guitar-front',
    bottleProfile: 'bottle-profile', bottleTop: 'bottle-top', bottleTopMouth: 'bottle-top', bottleTopShoulder: 'bottle-top',

  Object.keys(G.lines).forEach(function (k) {
    var view = LINE_VIEW[k];
    var g = groups[view];

    el('path', { d: G.lines[k], fill: 'none', stroke: INK, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'data-line': k }, g);

  el('path', { d: G.lines.bottleTopMouth, fill: INK }, groups['bottle-top']);

  layers.guitar.appendChild(groups['guitar-front']);
  layers.guitar.appendChild(groups['guitar-front-x-profile']);
  layers.guitar.appendChild(groups['guitar-soundhole']);
  layers.guitar.appendChild(groups['guitar-bridge']);

  layers.bottle.appendChild(groups['bottle-top']);

  // Printed-paper fragment with its approved words (container + label move as one).
  var frag = el('g', { id: 'view-paper-fragment', 'data-part': 'paper' }, layers.paper);
  var fragInner = el('g', { transform: 'rotate(-7 300 470)' }, frag);
  var fclip = el('clipPath', { id: 'clip-fragment' }, defs);

  el('rect', { x: 100, y: 340, width: 390, height: 72, fill: '#ECE4D0' }, fbody);
  el('path', { d: 'M110 360L470 352L476 590L300 598L118 588L112 470z', fill: 'none', stroke: INK, 'stroke-width': 2 }, fragInner);

  OFFSET['paper-fragment'] = [-80, 40]; groups['paper-fragment'] = frag;

  var order = ['wall-plane-a', 'wall-plane-b', 'wall-plane-ab', 'table-front', 'table-top', 'table-top-x-front', 'paper-fragment',
    'glass-rim', 'glass-profile', 'glass-profile-x-rim', 'bottle-profile', 'bottle-top', 'bottle-profile-x-top',
    'guitar-profile', 'guitar-neck', 'guitar-front', 'guitar-soundhole', 'guitar-bridge', 'guitar-strings', 'guitar-front-x-profile'];
  // 0–1.2 s: facets slide into registration from their per-view offsets.
  order.forEach(function (id, i) {
    var g = groups[id]; if (!g) return;
    var o = OFFSET[id] || [0, 0];
    var start = Math.min(0.3, i * 0.016);
    var endOpacity = id === 'bottle-top' ? 0.3 : 1;
    var from = { x: o[0], y: o[1], opacity: 0.35 }, to = { x: 0, y: 0, opacity: endOpacity, duration: 1.2 - start, ease: 'power2.inOut' };
    if (id === 'bottle-top') { from.scale = 0.86; from.transformOrigin = '50% 50%'; to.scale = 0.86; }
    tl.fromTo(g, from, to, start);
  });
  // 1.2–2.0 s: deliberate bottle view swap — profile recedes and shifts, top view comes forward.
  tl.addLabel('viewSwap', 1.2);
  tl.fromTo(groups['bottle-profile'], { x: 0, y: 0, opacity: 1 }, { x: -22, y: 10, opacity: 0.55, duration: 0.8, ease: 'sine.inOut', immediateRender: false }, 1.2);
  tl.fromTo(groups['bottle-profile-x-top'], { x: 0, y: 0, opacity: 1 }, { x: -11, y: 5, opacity: 0.8, duration: 0.8, ease: 'sine.inOut', immediateRender: false }, 1.2);
  tl.fromTo(groups['bottle-top'], { x: 0, y: 0, opacity: 0.3, scale: 0.86, transformOrigin: '50% 50%' }, { x: 6, y: -8, opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.2)', immediateRender: false }, 1.2);
  // 2.0–3.0 s: readable hold.
  tl.addLabel('hold', 2.0);
  tl.set({}, {}, 3.0);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0);
})();
</script>
