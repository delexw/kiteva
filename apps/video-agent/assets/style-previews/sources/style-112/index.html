<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#55C7CF" stroke-opacity=".08"></path></pattern><path id="c" d="M0 26V0H26" fill="none" stroke="#55C7CF" stroke-width="2"></path><rect id="n" x="-7" y="-7" width="14" height="14" fill="#0C1822" stroke="#55C7CF" stroke-width="1.5"></rect></defs><rect width="1280" height="720" fill="#0C1822" data-demo-actor="demo-actor-1"></rect><rect width="1280" height="720" fill="url(#g)" data-demo-actor="demo-actor-2"></rect><use href="#c" x="30" y="30" data-demo-actor="demo-actor-3"></use><use href="#c" transform="translate(1250 30) rotate(90)" data-demo-actor="demo-actor-4"></use><use href="#c" transform="translate(1250 690) rotate(180)" data-demo-actor="demo-actor-5"></use><use href="#c" transform="translate(30 690) rotate(270)" data-demo-actor="demo-actor-6"></use><g fill="none" stroke="#E7F4F3" data-demo-actor="demo-actor-7"><circle cx="640" cy="380" r="210" stroke-opacity=".15" data-demo-actor="demo-actor-8"></circle><circle cx="640" cy="380" r="140" stroke-opacity=".25" data-demo-actor="demo-actor-9"></circle><circle cx="640" cy="380" r="90" stroke="#55C7CF" stroke-dasharray="4 8" data-demo-actor="demo-actor-10"></circle><path d="M640 150V180M640 580V610M410 380H440M840 380H870" stroke-opacity=".6" data-demo-actor="demo-actor-11"></path><path d="M640 380L850 380M640 380L745 198M640 380L535 198M640 380L430 380M640 380L535 562M640 380L745 562" stroke-opacity=".45" data-demo-actor="demo-actor-12"></path></g><circle cx="640" cy="380" r="30" fill="#55C7CF" fill-opacity=".15" stroke="#55C7CF" stroke-width="2" data-demo-actor="demo-actor-13"></circle><circle cx="640" cy="380" r="6" fill="#55C7CF" data-demo-actor="demo-actor-14"></circle><use href="#n" x="850" y="380" data-demo-actor="demo-actor-15"></use><use href="#n" x="745" y="198" data-demo-actor="demo-actor-16"></use><use href="#n" x="535" y="198" data-demo-actor="demo-actor-17"></use><use href="#n" x="430" y="380" data-demo-actor="demo-actor-18"></use><use href="#n" x="535" y="562" data-demo-actor="demo-actor-19"></use><use href="#n" x="745" y="562" data-demo-actor="demo-actor-20"></use><g fill="none" stroke="#E7F4F3" stroke-opacity=".3" data-demo-actor="demo-actor-21"><rect x="70" y="160" width="250" height="230" data-demo-actor="demo-actor-22"></rect><rect x="960" y="160" width="250" height="300" data-demo-actor="demo-actor-23"></rect></g><circle cx="1085" cy="290" r="60" fill="none" stroke="#E7F4F3" stroke-opacity=".15" stroke-width="6" data-demo-actor="demo-actor-24"></circle><circle cx="1085" cy="290" r="60" fill="none" stroke="#55C7CF" stroke-width="6" stroke-dasharray="324 377" transform="rotate(-90 1085 290)" data-demo-actor="demo-actor-25"></circle><g fill="#55C7CF" data-demo-actor="demo-actor-26"><rect x="90" y="340" width="210" height="6" fill-opacity=".2" data-demo-actor="demo-actor-27"></rect><rect x="90" y="340" width="180" height="6" data-demo-actor="demo-actor-28"></rect></g><g font-family="Menlo, Consolas, &apos;Courier New&apos;, monospace" fill="#E7F4F3" data-demo-actor="demo-actor-29"><text x="70" y="90" font-size="22" letter-spacing="4" data-demo-actor="demo-actor-30">IDEA → CONNECTED SYSTEM</text><g font-size="14" data-demo-actor="demo-actor-31"><text x="90" y="190" fill="#55C7CF" data-demo-actor="demo-actor-32">// SYSTEM SCAN</text><text x="90" y="230" data-demo-actor="demo-actor-33">NODES ACQUIRED  06/06</text><text x="90" y="260" data-demo-actor="demo-actor-34">ACTIVE LINKS    06</text><text x="90" y="290" data-demo-actor="demo-actor-35">LATENCY         12 ms</text><text x="90" y="326" data-demo-actor="demo-actor-36">ASSEMBLY 86%</text><text x="980" y="190" fill="#55C7CF" data-demo-actor="demo-actor-37">// LINK INTEGRITY</text><text x="1085" y="297" text-anchor="middle" font-size="22" data-demo-actor="demo-actor-38">86%</text><text x="980" y="400" data-demo-actor="demo-actor-39">STATUS  CONNECTED</text><text x="980" y="430" data-demo-actor="demo-actor-40">SOURCE  IDEA_01</text></g><g font-size="12" fill="#55C7CF" data-demo-actor="demo-actor-41"><text x="640" y="335" text-anchor="middle" data-demo-actor="demo-actor-42">IDEA_01 · LOCKED</text><text x="866" y="384" data-demo-actor="demo-actor-43">N1 DATA</text><text x="760" y="192" data-demo-actor="demo-actor-44">N2 USERS</text><text x="450" y="192" data-demo-actor="demo-actor-45">N3 TEAM</text><text x="352" y="384" data-demo-actor="demo-actor-46">N4 TOOLS</text><text x="450" y="584" data-demo-actor="demo-actor-47">N5 FLOW</text><text x="760" y="584" data-demo-actor="demo-actor-48">N6 OUTPUT</text></g><text x="70" y="660" font-size="11" fill-opacity=".6" data-demo-actor="demo-actor-49">SIMULATED DATA — CONCEPT VISUAL, NOT A LIVE READOUT</text></g></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-112","selectedReferenceIds":[],"rationale":"The last plan was too subtle, so this one makes the HUD's start-up and acquisition the main event. The radar rings scale in, the six spoke lines draw out from the locked core to the node squares, and then the node labels light up. Then the readouts respond to the scan: the SYSTEM SCAN and LINK INTEGRITY panel text slides in, the integrity ring rotates in, and the assembly bar fills in. Panel frames, corner brackets, the grid and the disclaimer stay anchored. Node squares stay fixed as spoke endpoints so the connections stay intact. The large text and ring areas push changed pixels well past the threshold. Everything finishes by 2.05s.","tracks":[{"actorId":"demo-actor-9","role":"Middle radar ring powers up","action":"reveal","start":0,"duration":0.5,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.8,"rotation":0,"opacity":0}},{"actorId":"demo-actor-12","role":"Six scan spokes draw from core to nodes","action":"draw","start":0.05,"duration":0.75,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-13","role":"Core reticle locks on","action":"reveal","start":0.2,"duration":0.45,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-10","role":"Dashed acquisition ring spins into place","action":"reveal","start":0.35,"duration":0.55,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.8,"rotation":-15,"opacity":0}},{"actorId":"demo-actor-41","role":"Node and lock labels appear as nodes are acquired","action":"reveal","start":0.85,"duration":0.45,"ease":"steps(6)","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-31","role":"Panel readouts slide in after acquisition","action":"reveal","start":1.15,"duration":0.5,"ease":"power2.inOut","pose":{"x":0,"y":16,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-25","role":"Link integrity ring rotates into its 86% state","action":"reveal","start":1.35,"duration":0.55,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.8,"rotation":-15,"opacity":0}},{"actorId":"demo-actor-26","role":"Assembly progress bar fills in","action":"reveal","start":1.55,"duration":0.5,"ease":"steps(6)","pose":{"x":-24,"y":0,"scale":1,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#E7F4F3";
const background="#0C1822";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>(p.localName==='line' || getComputedStyle(p).fill==='none') && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
