<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comic Book Art — An idea becomes a connected system</title>
<style>

  <defs>

      <circle cx="5.5" cy="5.5" r="2.3" fill="#3768A1"/>
    </pattern>
    <pattern id="dots-idea" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="6" cy="6" r="2.6" fill="#E1B744"/>
    </pattern>
    <pattern id="dots-floor" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">

    </pattern>
    <clipPath id="clip-p1"><polygon points="40,40 470,40 430,680 40,680"/></clipPath>
    <clipPath id="clip-p2"><polygon points="500,40 1240,40 1240,680 460,680"/></clipPath>
  </defs>

  <!-- BACKGROUND (stationary): deep navy ink ground with a blue dot screen -->
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#1C2230"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dots-ground)" opacity="0.55"/>
  </g>

  <!-- PANELS (stationary paper planes, the brightest surfaces) -->

    <polygon id="panel-1" points="40,40 470,40 430,680 40,680" fill="#EEF1F5"/>
    <polygon points="40,40 470,40 430,680 40,680" fill="url(#dots-idea)" stroke="none"/>
    <polygon id="panel-2" points="500,40 1240,40 1240,680 460,680" fill="#EEF1F5"/>
    <g clip-path="url(#clip-p2)"><rect x="440" y="604" width="820" height="80" fill="url(#dots-floor)" stroke="none" opacity="0.8"/></g>
  </g>

  <!-- PANEL 1 CHARACTER: the idea bulb -->
  <g id="p1-art" clip-path="url(#clip-p1)">
    <g id="burst"></g>
    <g id="rays"></g>
    <g id="bulb">
      <circle id="bulb-glass" cx="240" cy="300" r="60" fill="#EEF1F5" stroke="#1C2230" stroke-width="7"/>
      <path id="filament" d="M222 318 L232 296 L240 318 L248 296 L258 318" fill="none" stroke="#1C2230" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="214" y="360" width="52" height="36" rx="4" fill="#1C2230"/>
      <rect x="220" y="370" width="40" height="5" fill="#3768A1"/>
      <rect x="220" y="382" width="40" height="5" fill="#3768A1"/>

  </g>

  <!-- PANEL 2 SPEED LINES (one-time climax accent), behind the network -->

  <!-- PANEL 2 CHARACTER: the connected system -->

    <g id="edges"></g>

  </g>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var V = window.ComicVendor, rough = V.rough, M = V.motion;
  var C = { ground: '#1C2230', ink: '#1C2230', keyline: '#0E1119', paper: '#EEF1F5', bubble: '#FFFFFF', red: '#C9403C', yellow: '#E1B744', blue: '#3768A1' };

  });

    return n;
  }
  function roughInto(parent, drawable, extra) {
    var out = [];
    gen.toPaths(drawable).forEach(function (p) {

      for (var k in extra || {}) a[k] = extra[k];
      out.push(el('path', a, parent));
    });
    return out;
  }
  function $(id) { return document.getElementById(id); }

  // ---------- Build cached geometry once (fixed Rough.js seeds) ----------
  var burstPts = [[240,170],[270,240],[340,220],[300,280],[370,330],[290,340],[300,420],[240,370],[180,420],[190,340],[110,330],[180,280],[140,220],[210,240]];

    roughInto($('rays'), gen.line(240 + Math.cos(a) * 82, 300 + Math.sin(a) * 82, 240 + Math.cos(a) * 112, 300 + Math.sin(a) * 112,
      { seed: 100 + r, roughness: 0.8, stroke: C.ink, strokeWidth: 5, disableMultiStroke: true }));
  }

  // Stamp ink: double keyline in the red spot ink (single fixed role: the "hit" impression).

  roughInto(stampInk, gen.rectangle(92, 498, 300, 118, { seed: 41, roughness: 1.2, stroke: C.red, strokeWidth: 7, disableMultiStroke: true }));
  roughInto(stampInk, gen.rectangle(104, 510, 276, 94, { seed: 42, roughness: 1.0, stroke: C.red, strokeWidth: 3, disableMultiStroke: true }));

  // Spark trail speed lines (local space, pointing back along -x).
  [[-34, -10, -96], [-36, 0, -124], [-34, 10, -92]].forEach(function (s, i) {
    roughInto($('spark-trail'), gen.line(s[0], s[1], s[2], s[1] * 1.8, { seed: 60 + i, roughness: 0.6, stroke: C.ink, strokeWidth: 4, disableMultiStroke: true }));
  });

  // Network: nodes + edges with authored draw cues.
  var N = { hub: [700, 380], a: [880, 220], b: [1080, 300], d: [1140, 500], e: [900, 540] };
  var EDGES = [
    ['hub', 'a', 1.18, 0.18], ['hub', 'e', 1.24, 0.18], ['a', 'b', 1.36, 0.16], ['e', 'd', 1.42, 0.16],
    ['b', 'd', 1.52, 0.14], ['a', 'e', 1.58, 0.14], ['hub', 'd', 1.62, 0.14]
  ];
  var NODE_POP = { hub: 1.04, a: 1.34, e: 1.40, b: 1.50, d: 1.56 };
  var edgeEls = EDGES.map(function (e, i) {
    var p0 = N[e[0]], p1 = N[e[1]];
    var paths = roughInto($('edges'), gen.line(p0[0], p0[1], p1[0], p1[1], { seed: 200 + i, roughness: 0.9, bowing: 1.2, stroke: C.ink, strokeWidth: 9, disableMultiStroke: true }), { pathLength: 1, 'stroke-dasharray': '1 1' });
    return { paths: paths, start: e[2], dur: e[3] };
  });
  var nodeEls = {};

    var g = el('g', { 'data-node': k }, $('nodes'));

    nodeEls[k] = g;
  });

    var sy = kf(t, [0, 0.12, 0.24, 0.36, 0.46], [0.55, 0.78, 1.14, 0.95, 1]);
    var sx = kf(t, [0, 0.12, 0.24, 0.36, 0.46], [0.9, 1.12, 0.9, 1.04, 1]);

    var bs = t < 0.3 ? 0 : kf(t, [0.3, 0.5, 0.62], [0.35, 1.1, 1], out);

    Object.keys(nodeEls).forEach(function (k) {
      var t0 = NODE_POP[k];
      var s = t < t0 ? 0 : kf(t, [t0, t0 + 0.12, t0 + 0.2], [0.2, 1.18, 1], out);
      tf(nodeEls[k], 0, 0, s, s, 0, N[k][0], N[k][1]);
      op(nodeEls[k], t < t0 ? 0 : 1);
    });
    edgeEls.forEach(function (e) {
      var p = seg(t, e.start, e.start + e.dur, io);
      e.paths.forEach(function (pth) { pth.setAttribute('stroke-dashoffset', (1 - p).toFixed(4)); op(pth, p > 0 ? 1 : 0); });
    });

    // Beat 4 — climax: concentration lines rush inward once, the whole system jolts and settles.
    var cs = kf(t, [1.72, 1.96], [1.22, 1], out);
    tf(conc, 0, 0, cs, cs, 0, CX, CY);
    concEls.forEach(function (c) { op(c.el, seg(t, c.at, c.at + 0.06)); });
    var js = kf(t, [1.72, 1.82, 1.98], [1, 1.05, 1], io);
    tf(network, 0, 0, js, js, 0, CX, CY);

    var bsc = kf(t, [1.98, 2.14, 2.22], [0.3, 1.06, 1], out);
    tf(bubble, 0, 0, bsc, bsc, 0, 1124, 560);
    op(bubble, t >= 1.98 ? 1 : 0);
    op(bubbleText, seg(t, 2.22, 2.3));
  }

  // ---------- Single paused GSAP timeline: the shared seekable clock ----------
  var clock = { t: 0 };
  var tl = gsap.timeline({ paused: true, onUpdate: function () { render(tl.time()); } });
  tl.to(clock, { t: 3, duration: 3, ease: 'none' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener('hf-seek', function (ev) {
    var d = ev && ev.detail;
    var time = d && typeof d.time === 'number' ? d.time : tl.time();
    render(time);
  });
  window.__renderAt = render;
  render(0);
})();
</script>
