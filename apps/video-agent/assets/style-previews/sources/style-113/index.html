<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="au" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FAAD0"></stop><stop offset=".5" stop-color="#9B87C3"></stop><stop offset="1" stop-color="#65AAA5"></stop></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F6F4" stop-opacity=".2"></stop><stop offset="1" stop-color="#F2F6F4" stop-opacity=".05"></stop></linearGradient><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"></feGaussianBlur></filter><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter><g id="chip"><rect x="-70" y="-28" width="140" height="56" rx="18" fill="url(#gl)" stroke="#F2F6F4" stroke-opacity=".5"></rect><circle cx="-42" cy="0" r="7" fill="#F2F6F4"></circle><rect x="-26" y="-4" width="72" height="8" rx="4" fill="#F2F6F4" opacity=".55"></rect></g></defs><rect width="1280" height="720" fill="#142535" data-demo-actor="demo-actor-1"></rect><g filter="url(#bl)" opacity=".8" data-demo-actor="demo-actor-2"><path d="M-100 560C220 330 440 640 720 400S1120 150 1400 280V480C1120 380 900 660 640 590S160 660-100 720Z" fill="url(#au)" data-demo-actor="demo-actor-3"></path><ellipse cx="1040" cy="120" rx="280" ry="90" fill="#9B87C3" data-demo-actor="demo-actor-4"></ellipse><ellipse cx="760" cy="660" rx="260" ry="80" fill="#65AAA5" data-demo-actor="demo-actor-5"></ellipse></g><rect x="660" y="140" width="520" height="460" rx="36" fill="#142535" opacity=".35" filter="url(#sh)" transform="translate(0 18)" data-demo-actor="demo-actor-6"></rect><rect x="660" y="140" width="520" height="460" rx="36" fill="url(#gl)" stroke="#F2F6F4" stroke-opacity=".4" data-demo-actor="demo-actor-7"></rect><path d="M696 141H1144" stroke="#F2F6F4" stroke-opacity=".8" data-demo-actor="demo-actor-8"></path><g stroke="#F2F6F4" stroke-opacity=".6" stroke-width="1.5" fill="none" data-demo-actor="demo-actor-9"><path d="M920 370L790 240M920 370L1050 240M920 370L790 500M920 370L1050 500" data-demo-actor="demo-actor-10"></path><circle cx="920" cy="370" r="82" stroke-dasharray="2 8" data-demo-actor="demo-actor-11"></circle></g><circle cx="920" cy="370" r="46" fill="#142535" opacity=".5" data-demo-actor="demo-actor-12"></circle><circle cx="920" cy="370" r="46" fill="url(#gl)" stroke="#F2F6F4" stroke-opacity=".7" data-demo-actor="demo-actor-13"></circle><circle cx="920" cy="370" r="10" fill="#F2F6F4" data-demo-actor="demo-actor-14"></circle><use href="#chip" x="790" y="240" data-demo-actor="demo-actor-15"></use><use href="#chip" x="1050" y="240" data-demo-actor="demo-actor-16"></use><use href="#chip" x="790" y="500" data-demo-actor="demo-actor-17"></use><use href="#chip" x="1050" y="500" data-demo-actor="demo-actor-18"></use><g font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" fill="#F2F6F4" data-demo-actor="demo-actor-19"><text x="100" y="250" font-size="18" letter-spacing="6" opacity=".75" data-demo-actor="demo-actor-20">01 — FROM SPARK</text><text x="96" y="340" font-size="68" font-weight="300" data-demo-actor="demo-actor-21">An idea</text><text x="96" y="420" font-size="68" font-weight="600" data-demo-actor="demo-actor-22">becomes a</text><text x="96" y="500" font-size="68" font-weight="600" data-demo-actor="demo-actor-23">connected system</text><rect x="100" y="540" width="90" height="2" fill="#7FAAD0" data-demo-actor="demo-actor-24"></rect></g></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-113","selectedReferenceIds":[],"rationale":"The last plan was too subtle, so this one is a large, precise reveal. The frosted panel stays anchored over the still aurora, and its contents assemble. The headline block rises in first, then the core disc and its dot pop in at the centre. The four glass chips glide inward from their corners, and the four connector lines draw from core to chips to finish the 'connected system'. No card stack, carousel, tilt or orb deformation is depicted, so no reference fits. The headline is large, so its reveal alone gives a strong change at card size. Everything is in place by 2.2s for a readable hold.","tracks":[{"actorId":"demo-actor-19","role":"Headline copy block rises in","action":"reveal","start":0,"duration":0.6,"ease":"power2.inOut","pose":{"x":0,"y":24,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-12","role":"Core disc shadow appears under the glass core","action":"reveal","start":0.4,"duration":0.45,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-13","role":"Glass core disc pops in","action":"reveal","start":0.45,"duration":0.45,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-14","role":"Core spark dot lights","action":"reveal","start":0.6,"duration":0.35,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-15","role":"Top-left chip glides into place","action":"reveal","start":0.8,"duration":0.5,"ease":"power2.inOut","pose":{"x":-40,"y":-30,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-16","role":"Top-right chip glides into place","action":"reveal","start":0.95,"duration":0.5,"ease":"power2.inOut","pose":{"x":40,"y":-30,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-17","role":"Bottom-left chip glides into place","action":"reveal","start":1.1,"duration":0.5,"ease":"power2.inOut","pose":{"x":-40,"y":30,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-18","role":"Bottom-right chip glides into place","action":"reveal","start":1.25,"duration":0.5,"ease":"power2.inOut","pose":{"x":40,"y":30,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-10","role":"Connector lines draw from core to each chip","action":"draw","start":1.5,"duration":0.7,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}}]};
const svg=document.querySelector('svg');
const foreground="#F2F6F4";
const background="#142535";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>(p.localName==='line' || getComputedStyle(p).fill==='none') && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
