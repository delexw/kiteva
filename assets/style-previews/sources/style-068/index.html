emo-actor="demo-actor-10"></path></g><use href="#p" x="620" y="150" data-demo-actor="demo-actor-11"></use><use href="#p" x="960" y="300" data-demo-actor="demo-actor-12"></use><use href="#p" x="560" y="440" data-demo-actor="demo-actor-13"></use><use href="#p" x="870" y="500" data-demo-actor="demo-actor-14"></use><rect x="80" y="210" width="420" height="300" rx="28" fill="#F6F7F0" fill-opacity=".08" stroke="#F6F7F0" stroke-opacity=".35" filter="url(#s)" data-demo-actor="demo-actor-15"></rect><rect x="81" y="211" width="418" height="2" rx="1" fill="#F6F7F0" fill-opacity=".5" data-demo-actor="demo-actor-16"></rect><text x="116" y="266" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" letter-spacing="4" fill="#7AAEB4" data-demo-actor="demo-actor-17">01 · FROM ONE TO MANY</text><text font-family="Helvetica Neue,Arial,sans-serif" font-weight="300" font-size="44" fill="#F6F7F0" data-demo-actor="demo-actor-18"><tspan x="114" y="340">An idea becomes</tspan><tspan x="114" y="394" font-weight="600">a connected system</tspan></text><text x="116" y="454" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" fill="#F6F7F0" fill-opacity=".8" data-demo-actor="demo-actor-19">Layers of clarity, linked by intent.</text><circle cx="130" cy="486" r="5" fill="#A698C5" data-demo-actor="demo-actor-20"></circle><rect x="146" y="483" width="80" height="6" rx="3" fill="#F6F7F0" fill-opacity=".3" data-demo-actor="demo-actor-21"></rect></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-068","selectedReferenceIds":[],"rationale":"A glassmorphism system map. A text panel on the left introduces four frosted node cards on the right, linked by dashed connectors over blurred colour orbs. The headline (actor-18) rises in first to set up the idea. Then the four glass cards rise and settle one at a time in connection order (top, right, bottom-left, bottom-right). Each card is one \u003cuse>, so its dot and bars move with its frosted body. The dashed connector group (actor-6) fades in last so the links appear once both ends are present. It fades rather than draws because the authored dasharray would clash with a draw. The left glass panel, the background and the blurred orbs stay fixed, so the backdrop showing through stays stable. The card-stacking and carousel references were rejected because these cards never overlap or slide along a track. Tilt was rejected because there is no hover-card subject.","tracks":[{"actorId":"demo-actor-18","role":"Headline 'An idea becomes / a connected system' rises into the anchored glass panel","action":"reveal","start":0,"duration":0.6,"ease":"power2.inOut","pose":{"x":0,"y":20,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-11","role":"Top glass node card floats up into place","action":"reveal","start":0.35,"duration":0.55,"ease":"back.out(1.2)","pose":{"x":0,"y":32,"scale":0.82,"rotation":0,"opacity":0}},{"actorId":"demo-actor-12","role":"Right glass node card follows","action":"reveal","start":0.6,"duration":0.55,"ease":"back.out(1.2)","pose":{"x":0,"y":32,"scale":0.82,"rotation":0,"opacity":0}},{"actorId":"demo-actor-13","role":"Bottom-left glass node card follows","action":"reveal","start":0.85,"duration":0.55,"ease":"back.out(1.2)","pose":{"x":0,"y":32,"scale":0.82,"rotation":0,"opacity":0}},{"actorId":"demo-actor-14","role":"Bottom-right glass node card completes the set","action":"reveal","start":1.1,"duration":0.55,"ease":"back.out(1.2)","pose":{"x":0,"y":32,"scale":0.82,"rotation":0,"opacity":0}},{"actorId":"demo-actor-6","role":"Dashed connectors fade in once all cards are seated, linking the system","action":"reveal","start":1.5,"duration":0.5,"ease":"sine.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#F6F7F0";
const background="#182837";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
