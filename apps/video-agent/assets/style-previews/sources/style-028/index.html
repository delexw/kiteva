<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#243746}
#root{position:relative;width:100%;height:100%}
svg{width:100%;height:100%;display:block}
text{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
</style></head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
 <defs>
  <clipPath id="clipH1"><rect id="clipH1r" x="70" y="62" width="0" height="72"></rect></clipPath>
  <clipPath id="clipH2"><rect id="clipH2r" x="70" y="122" width="0" height="72"></rect></clipPath>
 </defs>
 <!-- stationary night field: palette foreground token used as the scene key -->
 <rect x="0" y="0" width="1280" height="720" fill="#243746"></rect>

 <!-- headline -->
 <g clip-path="url(#clipH1)"><g id="h1"><text x="80" y="118" font-size="50" font-weight="700" fill="#F7F3E9">An idea becomes</text></g></g>
 <g clip-path="url(#clipH2)"><g id="h2"><text x="80" y="178" font-size="50" font-weight="700" fill="#DD7353">a connected system</text></g></g>
 <g id="rule"><rect x="80" y="204" width="96" height="10" rx="5" fill="#EAC664"></rect></g>

 <!-- connector lines (truly stroked, unfilled) -->
 <g stroke="#F7F3E9" stroke-width="6" stroke-linecap="round" fill="none">
  <path class="ln" id="l0" d="M412 450H640"></path>
  <path class="ln" id="l1" d="M640 450L820 300"></path>
  <path class="ln" id="l2" d="M640 450L820 600"></path>
  <path class="ln" id="l3" d="M820 300H1020"></path>
  <path class="ln" id="l4" d="M820 600H1020"></path>
  <path class="ln" id="l5" d="M820 300V600"></path>
  <path class="ln" id="l6" d="M1020 300V600"></path>
 </g>

 <!-- bulb: halo rings are lighter flat fills (no bloom) -->
 <g transform="translate(300 420)">
  <g id="halo">
   <circle r="176" fill="#EAC664" opacity="0.10"></circle>
   <circle r="146" fill="#EAC664" opacity="0.16"></circle>
  </g>
  <g id="globe"><circle r="112" fill="#EAC664"></circle>
   <path d="M-38 10q38-56 76 0" stroke="#243746" stroke-width="8" fill="none" stroke-linecap="round"></path></g>
  <g id="base">
   <rect x="-44" y="106" width="88" height="30" rx="10" fill="#267D82"></rect>
   <rect x="-32" y="144" width="64" height="22" rx="10" fill="#267D82"></rect>
  </g>
 </g>
 <g stroke="#DD7353" stroke-width="8" stroke-linecap="round" fill="none">
  <path class="ray" d="M300 226v-36"></path>
  <path class="ray" d="M164 280l-26-26"></path>
  <path class="ray" d="M436 280l26-26"></path>
 </g>

 <!-- nodes: rounded squares, consistent radius -->
 <g transform="translate(640 450)"><g class="node" id="n0"><rect x="-46" y="-46" width="92" height="92" rx="24" fill="#DD7353"></rect><circle r="12" fill="#243746"></circle></g></g>
 <g transform="translate(820 300)"><g class="node" id="n1"><rect x="-46" y="-46" width="92" height="92" rx="24" fill="#267D82"></rect><circle r="12" fill="#F7F3E9"></circle></g></g>
 <g transform="translate(820 600)"><g class="node" id="n2"><rect x="-46" y="-46" width="92" height="92" rx="24" fill="#267D82"></rect><circle r="12" fill="#F7F3E9"></circle></g></g>
 <g transform="translate(1020 300)"><g class="node" id="n3"><rect x="-46" y="-46" width="92" height="92" rx="24" fill="#EAC664"></rect><circle r="12" fill="#243746"></circle></g></g>
 <g transform="translate(1020 600)"><g class="node" id="n4"><rect x="-46" y="-46" width="92" height="92" rx="24" fill="#F7F3E9"></rect><circle r="12" fill="#243746"></circle></g></g>

 <g id="foot"><text x="80" y="664" font-size="20" font-weight="600" letter-spacing="3" fill="#F7F3E9">SPARK · LINK · SYSTEM</text></g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(function(){
 // Palette validation (chroma-js): text pairs against the actual navy field.
 var field='#243746';
 [['#F7F3E9',4.5],['#DD7353',3]].forEach(function(p){
  if(chroma.contrast(p[0],field)<p[1]) console.warn('contrast below target',p[0]);
 });
 var tl=gsap.timeline({paused:true});
 // headline mask wipes
 tl.fromTo('#clipH1r',{attr:{width:0}},{attr:{width:520},duration:0.6,ease:'power2.inOut'},0.05);
 tl.fromTo('#h1',{y:14},{y:0,duration:0.6,ease:'power2.inOut'},0.05);
 tl.fromTo('#clipH2r',{attr:{width:0}},{attr:{width:560},duration:0.6,ease:'power2.inOut'},0.25);
 tl.fromTo('#h2',{y:14},{y:0,duration:0.6,ease:'power2.inOut'},0.25);
 tl.fromTo('#rule',{scaleX:0,transformOrigin:'0% 50%'},{scaleX:1,duration:0.4,ease:'power2.inOut'},0.6);
 // spark
 tl.fromTo('#globe',{scale:0.6,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,duration:0.5,ease:'back.out(1.2)'},0.1);
 tl.fromTo('#base',{y:24,opacity:0},{y:0,opacity:1,duration:0.4,ease:'power2.inOut'},0.3);
 tl.fromTo('#halo',{scale:0.7,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,duration:0.6,ease:'power2.inOut'},0.45);
 document.querySelectorAll('.ray').forEach(function(p,i){
  var L=p.getTotalLength();
  tl.fromTo(p,{attr:{'stroke-dasharray':L,'stroke-dashoffset':L}},{attr:{'stroke-dashoffset':0},duration:0.3,ease:'power2.inOut'},0.55+i*0.06);
 });
 // link: draw strokes, nodes pop when line arrives
 var draws=[['#l0',0.85,0.4],['#l1',1.2,0.35],['#l2',1.25,0.35],['#l3',1.55,0.3],['#l4',1.6,0.3],['#l5',1.75,0.3],['#l6',1.85,0.3]];
 draws.forEach(function(d){
  var p=document.querySelector(d[0]),L=p.getTotalLength();
  tl.fromTo(p,{attr:{'stroke-dasharray':L,'stroke-dashoffset':L}},{attr:{'stroke-dashoffset':0},duration:d[2],ease:'power2.inOut'},d[1]);
 });
 var pops=[['#n0',1.15],['#n1',1.5],['#n2',1.55],['#n3',1.82],['#n4',1.88]];
 pops.forEach(function(n){
  tl.fromTo(n[0],{scale:0.4,rotation:-12,opacity:0,transformOrigin:'50% 50%'},{scale:1,rotation:0,opacity:1,duration:0.4,ease:'back.out(1.2)'},n[1]);
 });
 tl.to({},{duration:0.001},2.999);
 window.__timelines=window.__timelines||{};
 window.__timelines.video=tl;
})();
</script>
