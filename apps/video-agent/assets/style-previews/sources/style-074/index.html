actor-18">share</text><text x="975" y="560" data-demo-actor="demo-actor-19">build</text><text x="1056" y="432" data-demo-actor="demo-actor-20">link</text></g><g transform="rotate(12 1110 120)" data-demo-actor="demo-actor-21"><rect x="1050" y="96" width="120" height="48" rx="24" fill="#DB8CBB" stroke="#293341" stroke-width="2" data-demo-actor="demo-actor-22"></rect><text x="1110" y="128" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="22" fill="#293341" data-demo-actor="demo-actor-23">NEW!</text></g><rect x="640" y="618" width="520" height="40" rx="20" fill="#E9EDF0" stroke="#293341" stroke-width="2" data-demo-actor="demo-actor-24"></rect><rect x="646" y="624" width="400" height="28" rx="14" fill="#A5C365" data-demo-actor="demo-actor-25"></rect><text x="664" y="644" font-family="Verdana,sans-serif" font-weight="bold" font-size="15" fill="#293341" data-demo-actor="demo-actor-26">CONNECTING SYSTEM… 77%</text><use href="#sp" transform="translate(1200 200) scale(1.3)" fill="#DB8CBB" data-demo-actor="demo-actor-27"></use><use href="#sp" transform="translate(610 230)" fill="#7497D0" data-demo-actor="demo-actor-28"></use><use href="#sp" transform="translate(150 640) scale(.8)" fill="#A5C365" data-demo-actor="demo-actor-29"></use><use href="#sp" transform="translate(1190 540) scale(.7)" fill="#293341" data-demo-actor="demo-actor-30"></use></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-074","selectedReferenceIds":[],"rationale":"This is a Y2K system map: a chrome 'idea.sys' title, a large glossy IDEA planet with a pink orbit ring, plastic tubes running to three glossy planets (share, build, link), a tilted NEW! sticker and a progress bar. The motion is an elastic interface build. The orbit ring swings 12° around the planet, the plastic tubes appear, the three planets pop in one after another with back.out (each glint moves with its own planet), and the NEW! sticker gives a bounded pop. The previous draw failed because the tubes are \u003cuse> elements, so they use reveal here. The title, labels, progress bar, sparkles and dotted background stay fixed and readable. All motion finishes by about 1.9s. No reference applies: motion-014 needs a single deforming orb, and nothing here has chapters or story copy.","tracks":[{"actorId":"demo-actor-7","role":"Pink orbit ring swings around the IDEA planet","action":"transform","start":0.1,"duration":0.8,"ease":"sine.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":12,"opacity":1}},{"actorId":"demo-actor-5","role":"Translucent blue tube casing appears","action":"reveal","start":0.3,"duration":0.5,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-6","role":"White tube core appears with casing","action":"reveal","start":0.3,"duration":0.5,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-11","role":"Pink share planet elastic pop-in","action":"reveal","start":0.65,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-12","role":"Share planet glint follows","action":"reveal","start":0.65,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-13","role":"Green build planet elastic pop-in","action":"reveal","start":0.9,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-14","role":"Build planet glint follows","action":"reveal","start":0.9,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-15","role":"Blue link planet elastic pop-in","action":"reveal","start":1.15,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-16","role":"Link planet glint follows","action":"reveal","start":1.15,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-21","role":"NEW! sticker bounded pop","action":"transform","start":1.4,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":1.2,"rotation":8,"opacity":1}}]};
const svg=document.querySelector('svg');
const foreground="#293341";
const background="#E9EDF0";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
