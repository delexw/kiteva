<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claymation — An idea becomes a connected system</title>
<style>
  /* OS-bundled macOS system fonts: declared via local() so no font file is needed */
  @font-face { font-family: "Arial Rounded MT Bold"; src: local("Arial Rounded MT Bold"), local("ArialRoundedMTBold"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Trebuchet MS"; src: local("Trebuchet MS"), local("TrebuchetMS"); font-weight: 400; font-style: normal; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #4F7F96; }
  #video { position: relative; width: 100%; height: 100%; overflow: hidden; background: #4F7F96; }
  #clay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  /* digital title layer, deliberately separate from the clay world */
  #title-card {
    position: absolute; left: 56px; top: 44px; padding: 20px 30px 18px 26px;
    background: #444B3D; color: #F0E4D3; border-radius: 22px;
    box-shadow: 0 8px 0 rgba(20, 30, 36, 0.28);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
    opacity: 0; will-change: transform, opacity;
  }
  #title-card h1 { margin: 0; font-size: 46px; line-height: 1.12; font-weight: 700; letter-spacing: 0.2px; }
  #title-card p { margin: 10px 0 0 2px; font-family: "Trebuchet MS", "Helvetica Neue", Arial, sans-serif; font-size: 16px; letter-spacing: 2px; color: #F0E4D3; }
</style>
</head>
<body>
<div id="video" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="clay" width="1280" height="720" data-demo-actor="demo-actor-1"></canvas>
  <div id="title-card" data-demo-actor="demo-actor-6">
    <h1>An idea becomes<br>a connected system</h1>
    <p data-reveal-after="title-card">simulated clay · 12 exposures/s · no glaze</p>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="clay-scene.bundle.js"></script>
<script>
(function () {
  var DURATION = 3, EXPOSURES_PER_SECOND = 12;
  var clay = window.ClayScene.createClayScene(document.getElementById('clay'));
  var S = clay.state;

  // Pose timeline: the single owner of every clay pose value. It is never played;
  // it is sampled only at discrete exposure times (stop-motion holds).
  var pose = gsap.timeline({ paused: true });
  pose.set(S, { head: 0, eyes: 1, mouth: 0, lean: 0, c0: 0, c1: 0, c2: 0, c3: 0, c4: 0, n0: 0, n1: 0, n2: 0, n3: 0, boil: 1 }, 0)
    // the idea is pressed onto the set
    .to(S, { head: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.08)
    // anticipation: blink, lean back, "oh!" replacement mouth
    .to(S, { eyes: 0.15, duration: 0.08, ease: 'power2.inOut' }, 0.58)
    .to(S, { eyes: 1, duration: 0.08, ease: 'power2.inOut' }, 0.66)
    .to(S, { lean: 5, duration: 0.25, ease: 'power2.inOut' }, 0.55)
    .set(S, { mouth: 1 }, 0.67)
    // two clay coils are pushed out of the idea
    .to(S, { lean: -3, duration: 0.3, ease: 'power2.inOut' }, 0.8)
    .to(S, { c0: 1, duration: 0.5, ease: 'power2.inOut' }, 0.75)
    .to(S, { c1: 1, duration: 0.5, ease: 'power2.inOut' }, 0.8)
    // first nodes are pressed in where the coils land
    .to(S, { n0: 1, duration: 0.35, ease: 'back.out(2)' }, 1.2)
    .to(S, { n2: 1, duration: 0.35, ease: 'back.out(2)' }, 1.26)
    // the system branches
    .to(S, { c2: 1, duration: 0.4, ease: 'power2.inOut' }, 1.42)
    .to(S, { c3: 1, duration: 0.4, ease: 'power2.inOut' }, 1.46)
    .to(S, { n1: 1, duration: 0.35, ease: 'back.out(2)' }, 1.8)
    .to(S, { n3: 1, duration: 0.35, ease: 'back.out(2)' }, 1.84)
    // closing link makes it a connected loop
    .to(S, { c4: 1, duration: 0.35, ease: 'power2.inOut' }, 1.98)
    // reaction: settle upright and smile
    .to(S, { lean: 0, duration: 0.2, ease: 'power2.inOut' }, 2.15)
    .set(S, { mouth: 2 }, 2.3)
    // final held exposure: no boil after the scene settles
    .set(S, { boil: 0 }, 2.45)
    .set({}, {}, DURATION);

  var clock = { t: 0 };
  var lastExposure = -1;
  function drawAt(t) {
    var n = Math.min(DURATION * EXPOSURES_PER_SECOND, Math.floor(t * EXPOSURES_PER_SECOND + 1e-4));
    pose.seek(n / EXPOSURES_PER_SECOND, false);
    S.exposure = n;
    clay.render();
    lastExposure = n;
  }

  var tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: function () { drawAt(clock.t); } }, 0);
  // digital title overlay (panel and copy reveal together as one group)
  tl.fromTo('#title-card', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.inOut' }, 0.05);
  tl.set({}, {}, DURATION);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    drawAt(t);
  });
  tl.seek(0, false);
  drawAt(0);
})();
</script>

</html>
