<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutaway / Exploded 3D Illustration — style-127 preview</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101820; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; background: #101820; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .mono { font-family: Menlo, "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="DrawSVGPlugin.min.js"></script>
<script src="lens-scene.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <svg id="overlay" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <!-- standalone heading (independent timing: always visible) -->
    <text class="mono" x="70" y="80" font-size="13" fill="#8196A5" letter-spacing="0.5">EXPLODED ASSEMBLY · SECTION A–A · AXIS Z</text>

    <!-- flow legend (standalone, appears with the light path) -->
    <g id="legend" opacity="0">
      <text class="mono" x="1040" y="300" font-size="13" fill="#628BF4">SIGNAL</text>
      <text class="mono" x="1040" y="322" font-size="13" fill="#EF9F5C">ENERGY</text>
    </g>

    <!-- labels: group transform is reprojected from 3D part anchors on every seek -->
    <g id="labels"></g>

    <!-- standalone title -->
    <g class="sans" fill="#EFF4F7">
      <text x="70" y="616" font-size="36" font-weight="700">An idea becomes</text>
      <text x="70" y="660" font-size="36" font-weight="300">a connected system</text>
    </g>
  </svg>
</div>
<script>
(function () {
  "use strict";
  gsap.registerPlugin(DrawSVGPlugin);
  var NS = "http://www.w3.org/2000/svg";
  var LS = window.LensScene;
  var lens = LS.createLensScene(document.getElementById("stage"));
  var PARTS = LS.PARTS;

  // ---- build label overlay (card -> text, leader -> anchor dot) ----
  var LEAD = 64; // constant leader length in px; whole label group follows its anchor
  var labelsG = document.getElementById("labels");
  var labelGroups = [], cards = [], texts = [], leaders = [], dots = [];
  PARTS.forEach(function (p, i) {
    var n = i + 1;
    var g = document.createElementNS(NS, "g");
    g.setAttribute("id", "label-" + n);
    var card = document.createElementNS(NS, "rect");
    card.setAttribute("id", "card-" + n);
    card.setAttribute("fill", "#101820");
    card.setAttribute("stroke", "#8196A5");
    card.setAttribute("stroke-width", "1");
    card.setAttribute("rx", "3");
    var text = document.createElementNS(NS, "text");
    text.setAttribute("class", "mono");
    text.setAttribute("font-size", "13");
    text.setAttribute("fill", "#EFF4F7");
    text.setAttribute("text-anchor", "end");
    text.setAttribute("data-reveal-after", "card-" + n);
    text.textContent = p.label;
    var leader = document.createElementNS(NS, "path");
    leader.setAttribute("id", "leader-" + n);
    leader.setAttribute("d", "M" + (-LEAD - 2) + " 0 H-5");
    leader.setAttribute("stroke", "#EFF4F7");
    leader.setAttribute("stroke-width", "1.5");
    leader.setAttribute("fill", "none");
    var dot = document.createElementNS(NS, "circle");
    dot.setAttribute("r", "4");
    dot.setAttribute("cx", "0");
    dot.setAttribute("cy", "0");
    dot.setAttribute("fill", "#EFF4F7");
    dot.setAttribute("data-arrowhead-for", "leader-" + n);
    g.appendChild(card); g.appendChild(text); g.appendChild(leader); g.appendChild(dot);
    labelsG.appendChild(g);
    var right = -LEAD - 2;
    text.setAttribute("x", String(right - 12));
    text.setAttribute("y", "4.5");
    var w = Math.ceil(p.label.length * 7.9) + 24; // monospace advance (13px) + padding, font-independent
    card.setAttribute("x", String(right - w));
    card.setAttribute("y", "-13");
    card.setAttribute("width", String(w));
    card.setAttribute("height", "26");
    labelGroups.push(g); cards.push(card); texts.push(text); leaders.push(leader); dots.push(dot);
  });

  // ---- GSAP-owned scene state (part offsets, cutaway, camera arc, light path) ----
  var S = { sep: 0, cut: 2.4, az: 0.62, beam: 0 };
  var stateTl = gsap.timeline({ paused: true });
  stateTl
    .set(S, { sep: 0, cut: 2.4, az: 0.62, beam: 0 }, 0)
    .to(S, { az: 0.34, duration: 1.2, ease: "sine.inOut" }, 0.3)          // calm camera arc
    .to(S, { sep: 1, duration: 0.9, ease: "power2.inOut" }, 0.5)          // axial separation
    .to(S, { cut: 0, duration: 0.7, ease: "sine.inOut" }, 0.65)           // quadrant cutaway sweeps in
    .to(S, { beam: 1, duration: 0.5, ease: "power2.inOut" }, 1.15)        // light path travels
    .to(S, { beam: 0, duration: 0.15, ease: "power2.inOut" }, 2.3)
    .to(S, { cut: 2.4, duration: 0.3, ease: "power2.inOut" }, 2.35)       // section closes
    .to(S, { sep: 0, duration: 0.35, ease: "power2.inOut" }, 2.35)        // precise reassembly
    .to(S, { az: 0.62, duration: 0.35, ease: "sine.inOut" }, 2.35)
    .to({}, { duration: 0.3 }, 2.7);

  function sync(t) {
    stateTl.totalTime(Math.max(0, Math.min(3, t)), true);
    var a = lens.render(S);
    for (var i = 0; i < labelGroups.length; i++) {
      labelGroups[i].setAttribute("transform", "translate(" + a[i][0].toFixed(2) + " " + a[i][1].toFixed(2) + ")");
    }
  }

  // Driver: a function-valued tween property, so every render/seek of the
  // master timeline (including suppressed-event seeks) re-derives the 3D frame.
  var clock = { _t: 0, t: function (v) { if (arguments.length) { this._t = v; sync(v); return; } return this._t; } };

  var tl = gsap.timeline({ paused: true });
  tl.fromTo(clock, { t: 0 }, { t: 3, duration: 3, ease: "none" }, 0);

  // label reveal: card -> text (data-reveal-after) -> leader draw -> anchor dot on arrival
  for (var i = 0; i < cards.length; i++) {
    var b = 1.35 + i * 0.09;
    tl.fromTo(cards[i], { opacity: 0, scaleX: 0, transformOrigin: "100% 50%" }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "power2.inOut" }, b);
    tl.fromTo(texts[i], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "sine.inOut" }, b + 0.2);
    tl.fromTo(leaders[i], { drawSVG: "0% 0%" }, { drawSVG: "0% 100%", duration: 0.24, ease: "power2.inOut" }, b + 0.2);
    tl.fromTo(dots[i], { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, b + 0.44);
    // exit before reassembly: dot -> leader -> text -> card
    tl.to(dots[i], { opacity: 0, duration: 0.04, ease: "none" }, 2.32);
    tl.to(leaders[i], { drawSVG: "0% 0%", duration: 0.1, ease: "power2.inOut" }, 2.34);
    tl.to(texts[i], { opacity: 0, duration: 0.06, ease: "none" }, 2.4);
    tl.to(cards[i], { opacity: 0, scaleX: 0, duration: 0.12, ease: "power2.inOut" }, 2.46);
  }
  tl.fromTo("#legend", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.inOut" }, 1.2);
  tl.to("#legend", { opacity: 0, duration: 0.15, ease: "sine.inOut" }, 2.32);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.totalTime(0, true);
  sync(0);

  window.addEventListener("hf-seek", function (e) {
    var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tl.time();
    tl.totalTime(t, true);
    sync(t);
  });
})();
</script>
