<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manga Production Theatre — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FFFFFF; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFFFFF; }
  .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #151515; background: #FFFFFF; }
  .abs { position: absolute; }
  svg { display: block; overflow: visible; }

  /* stationary scenery */
  .floor { left: 0; top: 470px; width: 1280px; height: 250px;
    background-image: radial-gradient(circle, #151515 1px, transparent 1.35px);
    background-size: 7px 7px; background-position: 2px 2px; }
  .floor-edge { left: 0; top: 469px; width: 1280px; height: 3px; background: #151515; }

  /* board (flown flat) */
  .board-rig { left: 490px; top: 0; width: 680px; height: 450px; will-change: transform; }
  .board { position: absolute; left: 0; top: 86px; width: 650px; height: 335px; background: #FFFFFF;
    border: 5px solid #151515; box-shadow: 10px 10px 0 #151515; }
  .board h2 { position: absolute; left: 24px; top: 18px; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
  .board .panel { position: absolute; left: 24px; top: 62px; width: 602px; height: 182px;
    background-image: radial-gradient(circle, #151515 1px, transparent 1.35px); background-size: 7px 7px; }
  .board .caption { position: absolute; left: 24px; top: 270px; margin: 0; font-size: 18px; font-weight: 600; }
  .hanger { position: absolute; top: 34px; width: 3px; height: 57px; background: #151515; }

  /* dialogue */
  .balloon { left: 30px; top: 170px; width: 340px; height: 245px; }
  .speaker { position: absolute; left: 0; width: 330px; top: 74px; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  .line { position: absolute; left: 0; width: 330px; top: 106px; text-align: center; font-size: 26px; font-weight: 400; white-space: nowrap; }
  .underline { position: absolute; left: 82px; top: 144px; width: 166px; height: 4px; border-radius: 2px; background: #F47B45; transform-origin: 0 50%; }

  /* crew */
  .crew { will-change: transform; }
  .badge { position: absolute; left: 50%; transform: translateX(-50%); width: 112px; height: 21px; border-radius: 11px;
    background: #151515; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-align: center; line-height: 21px; white-space: nowrap; }
  .badge .dot { position: absolute; left: 8px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #F47B45; opacity: 0; }
  .status { position: absolute; left: 50%; transform: translateX(-50%); width: 106px; height: 19px; border-radius: 10px;
    background: #FFFFFF; border: 1.5px solid #151515; font-size: 12px; font-weight: 700; text-align: center; line-height: 19px; white-space: nowrap; }
  .status span { position: absolute; left: 0; right: 0; top: 0; }
  .director-badge { left: 95px; top: 672px; width: 132px; height: 24px; border-radius: 12px; background: #151515; color: #FFFFFF;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-align: center; line-height: 24px; }
  @media (prefers-reduced-motion: reduce) { .crew, .board-rig { will-change: auto; } }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <div class="stage" id="stage">
    <!-- stationary backstage set: fly rail, perspective lines, halftone floor -->
    <svg class="abs" style="left:0;top:0" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true">
      <path d="M20 25L1200 465M470 0L1200 465" stroke="#151515" stroke-width="2" opacity=".18" fill="none"/>
      <rect x="0" y="28" width="1280" height="6" fill="#151515"/>
      <path d="M40 34v10M240 34v10M440 34v10M640 34v10M840 34v10M1040 34v10M1240 34v10" stroke="#151515" stroke-width="3"/>
    </svg>
    <div class="abs floor"></div>
    <div class="abs floor-edge"></div>

    <!-- presentation board: travels right-to-left as one flown flat; shadow is outside any mask -->
    <div class="abs board-rig" id="boardRig">
      <div class="hanger" style="left:60px"></div>
      <div class="hanger" style="left:590px"></div>
      <div class="board" id="board">
        <h2>01 / CONNECT THE IDEA</h2>
        <div class="panel">
          <svg width="602" height="182" viewBox="0 0 602 182" aria-hidden="true">
            <g fill="none" stroke="#151515" stroke-width="6" stroke-linecap="round">
              <path id="e1" d="M301 91L92 56" pathLength="1"/>
              <path id="e2" d="M301 91L168 146" pathLength="1"/>
              <path id="e3" d="M92 56L168 146" pathLength="1"/>
              <path id="e4" d="M301 91L438 140" pathLength="1"/>
              <path id="e5" d="M301 91L516 50" pathLength="1"/>
              <path id="e6" d="M438 140L516 50" pathLength="1"/>
            </g>
            <g fill="#FFFFFF" stroke="#151515" stroke-width="5">
              <circle id="n1" cx="92" cy="56" r="15"/>
              <circle id="n2" cx="168" cy="146" r="15"/>
              <circle id="n3" cx="438" cy="140" r="15"/>
              <circle id="n4" cx="516" cy="50" r="15"/>
              <circle cx="301" cy="91" r="34"/>
            </g>
            <text x="301" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#151515" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="1">IDEA</text>
          </svg>
        </div>
        <p class="caption">One idea becomes a connected system.</p>
      </div>
    </div>

    <!-- director speech balloon (persistent) -->
    <div class="abs balloon" id="balloon">
      <svg width="340" height="245" viewBox="30 170 340 245" aria-hidden="true">
        <defs><pattern id="tone" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#151515"/></pattern></defs>
        <ellipse cx="200" cy="318" rx="160" ry="92" fill="url(#tone)"/>
        <path d="M39 295C19 175 345 167 351 285C356 357 249 381 134 366L112 402 97 358C64 346 44 326 39 295Z" fill="#FFFFFF" stroke="#151515" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      <div class="speaker">DIRECTOR</div>
      <div class="line" id="line1">Let’s bring it to life.</div>
      <div class="line" id="line2" style="opacity:0">Now it’s a system.</div>
      <div class="underline" id="underline" style="opacity:0"></div>
    </div>

    <!-- director reaction marks (brief, only at the dialogue change) -->
    <svg class="abs" id="react" style="left:200px;top:400px;opacity:0" width="60" height="50" viewBox="200 400 60 50" aria-hidden="true">
      <path d="M210 428V412M226 434L238 419M236 446H254" stroke="#F47B45" stroke-width="7" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- placed prop box (appears where the stage crew sets it down) -->
    <div class="abs" id="placedBox" style="opacity:0"></div>

    <div id="crewLayer"></div>
    <div class="abs director-badge">DIRECTOR</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var INK = "#151515", PAPER = "#FFFFFF", ACCENT = "#F47B45";
  // Shared faceless silhouette: round blank head + short pointed body, one continuous contour (no seam).
  var FIG = "M-10 4 C-64-18-70-81-35-109 C0-139 48-115 55-77 C63-43 48-17 24 1 L49-3 30 22 31 89 8 62-11 63-34 92-31 23-57 15Z";
  var VB = { x: -120, y: -150, w: 250, h: 280 };

  // Role-specific prop SVG (figure units). Groups with ids are posed by the timeline only.
  var PROPS = {
    director:
      '<g transform="translate(28 33) rotate(-8)">' +
        '<path d="M0 0H54V39H0Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="4"/>' +
        '<path d="M6 14H48M6 26H40" stroke="' + INK + '" stroke-width="2.5"/>' +
        '<g id="clapArm"><path d="M0 0L49-20 54-8 5 12Z" fill="' + INK + '"/><path d="M15-6l8 9m8-16 8 9" stroke="' + PAPER + '" stroke-width="4"/></g>' +
      '</g>',
    stage:
      '<g id="carriedBox"><path d="M28 35H83V79H28Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="5"/><path d="M28 35L83 79M28 52H83" stroke="' + INK + '" stroke-width="3"/></g>',
    art:
      '<g id="pencil" transform="rotate(0)"><path d="M35 70L65 5 78 11 48 76 32 88Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="5" stroke-linejoin="round"/>' +
        '<path d="M32 88L36 79 41 81Z" fill="' + INK + '"/><path d="M62 11L75 17" stroke="' + INK + '" stroke-width="4"/></g>',
    lighting:
      '<path d="M80-20V92M58 92H102" stroke="' + INK + '" stroke-width="6" stroke-linecap="round" fill="none"/>' +
      '<g id="lampHead">' +
        '<g id="beam" opacity="0"><path d="M54-56L38-80M66-60L60-88M46-44L24-58" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/></g>' +
        '<rect x="56" y="-50" width="50" height="32" rx="6" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="5"/>' +
        '<path d="M56-50h12v32h-12z" fill="' + INK + '"/>' +
        '<circle id="lampLed" cx="96" cy="-34" r="4.5" fill="' + ACCENT + '" opacity="0"/>' +
      '</g>',
    sound:
      '<path d="M-62-50V-74C-62-150 54-150 54-74V-50" fill="none" stroke="' + INK + '" stroke-width="7"/>' +
      '<rect x="-70" y="-66" width="16" height="30" rx="6" fill="' + INK + '"/><rect x="46" y="-66" width="16" height="30" rx="6" fill="' + INK + '"/>' +
      '<rect x="22" y="30" width="66" height="44" rx="3" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="5"/>' +
      '<path d="M36 40V66M52 40V66M68 40V66" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="31" y="56" width="10" height="7" fill="' + INK + '"/><rect id="fader" x="47" y="56" width="10" height="7" fill="' + INK + '"/><rect x="63" y="50" width="10" height="7" fill="' + INK + '"/>' +
      '<circle id="mixLed" cx="80" cy="38" r="4" fill="' + ACCENT + '" opacity="0"/>',
    camera:
      '<g transform="translate(-86 24)">' +
        '<path d="M24 32L3 98M24 32L49 98M24 32V98" stroke="' + INK + '" stroke-width="5" stroke-linecap="round" fill="none"/>' +
        '<g id="camHead">' +
          '<path d="M0 8L-20 -2V34L0 24Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>' +
          '<rect width="50" height="32" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<g transform="translate(11 -9)"><circle r="12" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="4"/><path id="reel1" d="M-8 0H8M0-8V8" stroke="' + INK + '" stroke-width="3"/></g>' +
          '<g transform="translate(37 -9)"><circle r="12" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="4"/><path id="reel2" d="M-8 0H8M0-8V8" stroke="' + INK + '" stroke-width="3"/></g>' +
          '<circle id="recLed" cx="41" cy="16" r="4.5" fill="' + ACCENT + '" opacity="0"/>' +
        '</g>' +
      '</g>'
  };

  // Stable role IDs, home positions (figure origin in px), scale and status copy.
  var ROLES = [
    { id: "director", label: "DIRECTOR", x: 160, y: 556, s: 1.0, statuses: [] },
    { id: "stage",    label: "STAGE CREW", x: 470, y: 588, s: 0.55, statuses: ["Ready", "Delivering", "Placed"] },
    { id: "art",      label: "ART DEPT",   x: 640, y: 596, s: 0.55, statuses: ["Ready", "Drawing links", "Done"] },
    { id: "lighting", label: "LIGHTING",   x: 805, y: 556, s: 0.55, statuses: ["Ready", "Aiming", "Lit"] },
    { id: "sound",    label: "SOUND",      x: 975, y: 572, s: 0.55, statuses: ["Ready", "Cue in", "Waiting"] },
    { id: "camera",   label: "CAMERA",     x: 1150, y: 588, s: 0.55, statuses: ["Ready", "Tracking", "Locked"] }
  ];

  // Cue schedule (seconds) mirrored from STORYBOARD.json beats. Each role is independent: idle -> travel -> work -> return/settle -> idle.
  var CUES = {
    board:    { slide: [0.0, 0.66] },
    stage:    { out: [0.10, 0.36], place: [0.36, 0.50], back: [0.52, 0.82], trip: { x: 50, y: -68 } },
    art:      { out: [0.62, 0.92], draw: [0.94, 1.70], back: [1.72, 2.00], trip: { x: 20, y: -60 } },
    lighting: { adjust: [0.92, 1.28] },
    camera:   { track: [1.22, 2.20] },
    director: { cue: 1.70, settle: 2.05 },
    sound:    { cue: [2.00, 2.22] }
  };

  var stage = document.getElementById("stage");
  var layer = document.getElementById("crewLayer");

  function figureSVG(role) {
    var w = VB.w * role.s, h = VB.h * role.s;
    return '<svg width="' + w + '" height="' + h + '" viewBox="' + VB.x + ' ' + VB.y + ' ' + VB.w + ' ' + VB.h + '" aria-hidden="true">' +
      '<g id="' + role.id + '-body"><path d="' + FIG + '" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="7" stroke-linejoin="round"/>' +
      (PROPS[role.id] || "") + '</g></svg>';
  }

  ROLES.forEach(function (role) {
    var el = document.createElement("div");
    el.className = "abs crew";
    el.id = "crew-" + role.id;
    var ox = -VB.x * role.s, oy = -VB.y * role.s;
    el.style.left = (role.x - ox) + "px";
    el.style.top = (role.y - oy) + "px";
    el.style.width = (VB.w * role.s) + "px";
    el.style.height = (VB.h * role.s) + "px";
    var html = figureSVG(role);
    if (role.id !== "director") {
      // badge column centred on the figure origin
      var col = '<div style="position:absolute;left:' + (ox - 60) + 'px;width:120px;top:' + (oy + 55) + 'px;height:46px">' +
        '<div class="badge" style="top:0"><span class="dot" id="dot-' + role.id + '"></span>' + role.label + '</div>' +
        '<div class="status" style="top:25px">' + role.statuses.map(function (t, i) {
          return '<span id="st-' + role.id + '-' + i + '" style="opacity:' + (i === 0 ? 1 : 0) + '">' + t + '</span>';
        }).join("") + '</div></div>';
      html += col;
    }
    el.innerHTML = html;
    layer.appendChild(el);
  });

  // placed box uses the same viewBox/scale as the stage crew at its trip position, dropped slightly
  (function () {
    var r = ROLES[1], s = r.s, pb = document.getElementById("placedBox");
    pb.style.left = (r.x + CUES.stage.trip.x + VB.x * s) + "px";
    pb.style.top = (r.y + CUES.stage.trip.y + VB.y * s) + "px";
    pb.innerHTML = '<svg width="' + VB.w * s + '" height="' + VB.h * s + '" viewBox="' + VB.x + ' ' + VB.y + ' ' + VB.w + ' ' + VB.h + '" aria-hidden="true"><g transform="translate(0 12)">' + PROPS.stage.replace('id="carriedBox"', '') + '</g></svg>';
  })();

  function $(id) { return document.getElementById(id); }

  var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
  function ft(target, from, to, at) { to.immediateRender = false; tl.fromTo(target, from, to, at); }
  function swap(a, b, at, d) { ft(a, { opacity: 1 }, { opacity: 0, duration: d || 0.1, ease: "none" }, at); ft(b, { opacity: 0 }, { opacity: 1, duration: d || 0.1, ease: "none" }, at); }
  function status(role, i, at) { swap($("st-" + role + "-" + (i - 1)), $("st-" + role + "-" + i), at, 0.1); }
  function dot(role, on, off) {
    ft($("dot-" + role), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, on);
    ft($("dot-" + role), { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, off);
  }

  // Fixed initial states (time 0)
  gsap.set("#boardRig", { x: 790 });
  gsap.set(["#e1", "#e2", "#e3", "#e4", "#e5", "#e6"], { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set(["#n1", "#n2", "#n3", "#n4"], { scale: 0, transformOrigin: "50% 50%" });
  gsap.set("#clapArm", { rotation: 0, svgOrigin: "2 6" });
  gsap.set("#pencil", { rotation: 0, svgOrigin: "56 40" });
  gsap.set("#lampHead", { rotation: 0, svgOrigin: "80 -30" });
  gsap.set("#camHead", { rotation: 0, svgOrigin: "24 16" });
  gsap.set(["#reel1", "#reel2"], { rotation: 0, svgOrigin: "0 0" });
  gsap.set("#director-body", { rotation: 0, svgOrigin: "0 90" });
  gsap.set("#lighting-body", { rotation: 0, svgOrigin: "0 90" });
  gsap.set("#stage-body", { rotation: 0, svgOrigin: "0 90" });

  // 1) Board: substantial right-to-left slide of the flown flat (scenery handoff, motion-012 adaptation)
  ft("#boardRig", { x: 790 }, { x: 0, duration: CUES.board.slide[1] - CUES.board.slide[0], ease: "power3.out" }, CUES.board.slide[0]);

  // 2) Stage crew: quick delivery, set the box down, return and stop.
  var st = CUES.stage;
  dot("stage", st.out[0], st.place[1]);
  status("stage", 1, st.out[0]);
  ft("#crew-stage", { x: 0, y: 0 }, { x: st.trip.x, y: st.trip.y, duration: st.out[1] - st.out[0], ease: "power2.inOut" }, st.out[0]);
  ft("#stage-body", { rotation: 0 }, { rotation: 8, duration: 0.07, ease: "power2.out" }, st.place[0]);
  ft("#stage-body", { rotation: 8 }, { rotation: 0, duration: 0.08, ease: "power2.inOut" }, st.place[0] + 0.07);
  swap($("carriedBox"), $("placedBox"), st.place[0] + 0.06, 0.04);
  status("stage", 2, st.place[1]);
  ft("#crew-stage", { x: st.trip.x, y: st.trip.y }, { x: 0, y: 0, duration: st.back[1] - st.back[0], ease: "power2.inOut" }, st.back[0]);

  // 3) Art dept: deliberate trip, draw the network links on the board, freeze once readable, return.
  var ar = CUES.art;
  dot("art", ar.out[0], ar.draw[1]);
  status("art", 1, ar.out[0]);
  ft("#crew-art", { x: 0, y: 0 }, { x: ar.trip.x, y: ar.trip.y, duration: ar.out[1] - ar.out[0], ease: "sine.inOut" }, ar.out[0]);
  ft("#pencil", { rotation: 0 }, { rotation: 165, duration: 0.14, ease: "power2.out" }, ar.out[1] - 0.12);
  [[0.94, 175], [1.12, 155], [1.30, 175], [1.48, 158]].forEach(function (k, i, arr) {
    var prev = i === 0 ? 165 : arr[i - 1][1];
    ft("#pencil", { rotation: prev }, { rotation: k[1], duration: 0.18, ease: "sine.inOut" }, k[0]);
  });
  ft("#pencil", { rotation: 158 }, { rotation: 0, duration: 0.16, ease: "power2.inOut" }, ar.draw[1]);
  var edges = [["#e1", 0.96, "#n1"], ["#e2", 1.08, "#n2"], ["#e3", 1.20, null], ["#e4", 1.30, "#n3"], ["#e5", 1.42, "#n4"], ["#e6", 1.54, null]];
  edges.forEach(function (e) {
    ft(e[0], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.14, ease: "power1.inOut" }, e[1]);
    if (e[2]) ft(e[2], { scale: 0 }, { scale: 1, duration: 0.14, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, e[1] + 0.1);
  });
  status("art", 2, ar.draw[1]);
  ft("#crew-art", { x: ar.trip.x, y: ar.trip.y }, { x: 0, y: 0, duration: ar.back[1] - ar.back[0], ease: "sine.inOut" }, ar.back[0]);

  // 4) Lighting: short lamp adjustment toward the board, then hold steady.
  var li = CUES.lighting.adjust;
  dot("lighting", li[0], li[1]);
  status("lighting", 1, li[0]);
  ft("#lighting-body", { rotation: 0 }, { rotation: -3, duration: 0.1, ease: "power2.out" }, li[0]);
  ft("#lighting-body", { rotation: -3 }, { rotation: 0, duration: 0.14, ease: "power2.inOut" }, li[1] - 0.14);
  ft("#lampHead", { rotation: 0 }, { rotation: -26, duration: li[1] - li[0] - 0.08, ease: "back.out(1.2)" }, li[0]);
  ft("#lampLed", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, li[0] + 0.12);
  ft("#beam", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, li[0] + 0.16);
  status("lighting", 2, li[1]);

  // 5) Camera: slower smooth tracking tilt toward the board during the camera cue, then lock off.
  var ca = CUES.camera.track;
  dot("camera", ca[0], ca[1]);
  status("camera", 1, ca[0]);
  ft("#camHead", { rotation: 0 }, { rotation: 10, duration: ca[1] - ca[0], ease: "sine.inOut" }, ca[0]);
  ft(["#reel1", "#reel2"], { rotation: 0 }, { rotation: 270, duration: ca[1] - ca[0], ease: "sine.inOut" }, ca[0]);
  ft("#recLed", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, ca[0]);
  ft("#recLed", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, ca[1]);
  status("camera", 2, ca[1]);

  // 6) Director: dialogue updates in a persistent balloon; clap + 2.5deg nod toward the board; brief reaction marks.
  var di = CUES.director;
  ft("#clapArm", { rotation: 0 }, { rotation: -24, duration: 0.12, ease: "power2.out" }, di.cue - 0.16);
  ft("#clapArm", { rotation: -24 }, { rotation: 0, duration: 0.05, ease: "power3.in" }, di.cue - 0.04);
  ft("#director-body", { rotation: 0 }, { rotation: -2.5, duration: 0.12, ease: "power2.out" }, di.cue);
  ft("#director-body", { rotation: -2.5 }, { rotation: 0, duration: 0.2, ease: "power2.inOut" }, di.settle - 0.2);
  swap($("line1"), $("line2"), di.cue, 0.12);
  ft("#underline", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.18, ease: "power2.out" }, di.cue + 0.06);
  ft("#underline", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "none" }, di.cue + 0.52);
  ft("#react", { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.08, ease: "back.out(1.2)" }, di.cue + 0.01);
