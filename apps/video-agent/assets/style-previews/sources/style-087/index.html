<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Puppet Animation — An Idea Becomes a Connected System</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14273A; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #14273A; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #heading { position: absolute; left: 0; right: 0; top: 74px; text-align: center; color: #F3EAD7;
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; pointer-events: none; }
  #heading .act { font-size: 16px; letter-spacing: 8px; margin: 0 0 10px 0; opacity: 0.92; }
  #heading .title { font-size: 38px; margin: 0; line-height: 1.15; }
  #heading .block { display: inline-block; padding: 4px 22px 8px; transform: translateX(80px); }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="heading"><div class="block">
    <p class="act">ACT I · SCENE II</p>
    <p class="title">An Idea Becomes a Connected System</p>
  </div></div>
</div>
<script src="gsap.min.js"></script>
<script src="scene.js"></script>
<script>
(function () {
  var FPS_EXPOSURE = 15; // digital marionette poses held "on twos" at 30 fps delivery
  var stage = PuppetScene.createScene(document.getElementById('stage'));

  // Pose state: each property owned only by poseTl.
  var pose = {
    crouch: 0.55, lean: 0.22, chestTilt: 0, facing: 0.42,
    headPitch: 0.25, headYaw: 0.25, headTilt: 0.05,
    armRaise: 0.55, armForward: 0.55, elbow: 1.0, freeArm: 0.12,
    glow: 0, bulbScale: 1, barSway: 0,
    thread: [0, 0, 0, 0], house: [0, 0, 0, 0], win: [0, 0, 0, 0]
  };

  var poseTl = gsap.timeline({ paused: true });
  // Anticipation: sink lower around the unlit idea.
  poseTl.to(pose, { crouch: 0.72, lean: 0.32, headPitch: 0.35, barSway: -0.12, duration: 0.35, ease: 'power2.inOut' }, 0);
  // Rise and lift the idea overhead (weight pushes through planted feet).
  poseTl.to(pose, { crouch: 0.06, lean: -0.06, headPitch: -0.3, headYaw: 0.3, chestTilt: 0.08, duration: 0.6, ease: 'back.out(1.2)' }, 0.35);
  poseTl.to(pose, { armRaise: 2.55, armForward: 0.2, elbow: 0.15, freeArm: 0.35, barSway: 0.18, duration: 0.6, ease: 'power2.inOut' }, 0.4);
  // The idea lights.
  poseTl.to(pose, { glow: 1, duration: 0.2, ease: 'power2.inOut' }, 0.95);
  poseTl.to(pose, { bulbScale: 1.3, duration: 0.12, ease: 'power2.inOut' }, 0.95);
  poseTl.to(pose, { bulbScale: 1.0, duration: 0.25, ease: 'back.out(1.2)' }, 1.07);
  // Yarn threads travel to each miniature house; houses stand up on arrival.
  var tStart = [1.1, 1.3, 1.5, 1.95], tDur = [0.45, 0.45, 0.45, 0.35];
  for (var i = 0; i < 4; i++) {
    poseTl.to(pose.thread, { [i]: 1, duration: tDur[i], ease: 'sine.inOut' }, tStart[i]);
    poseTl.to(pose.house, { [i]: 1, duration: 0.35, ease: 'back.out(1.2)' }, tStart[i] + tDur[i] - 0.08);
    poseTl.to(pose.win, { [i]: 1, duration: 0.2, ease: 'power2.inOut' }, tStart[i] + tDur[i] + 0.15);
  }
  // Follow-through: puppet turns to regard the system, control bar settles.
  poseTl.to(pose, { headYaw: 0.75, headPitch: 0.05, headTilt: -0.08, facing: 0.6, crouch: 0.12, lean: 0.04, armRaise: 2.35, barSway: 0, duration: 0.7, ease: 'power2.inOut' }, 1.75);
  poseTl.to(pose, { freeArm: 0.18, chestTilt: 0, duration: 0.5, ease: 'sine.inOut' }, 1.9);

  var clock = { t: 0 };
  var lastQ = -1;
  function draw(force) {
    var t = Math.max(0, Math.min(3, clock.t));
    var q = Math.min(3, Math.round(t * FPS_EXPOSURE) / FPS_EXPOSURE);
    if (!force && q === lastQ) return;
    lastQ = q;
    poseTl.seek(q, true);
    stage.apply(pose);
  }

  var tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: 3, duration: 3, ease: 'none', onUpdate: function () { draw(false); } }, 0);
  tl.fromTo('#heading', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.inOut' }, 0.05);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  function syncFromTimeline() { clock.t = tl.time(); draw(true); }
  window.addEventListener('hf-seek', function (e) {
    var s = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : null;
    if (s !== null) tl.seek(s, false);
    syncFromTimeline();
  });
  tl.seek(0, false);
  syncFromTimeline();
})();
</script>
