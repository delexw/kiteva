<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Retrofuturism — An Idea Becomes a Connected System</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141D24}
#root{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <svg id="hud" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <clipPath id="c-label"><rect id="w-label" x="72" y="96" width="0" height="34"></rect></clipPath>
      <clipPath id="c-l1"><rect id="w-l1" x="72" y="130" width="0" height="96"></rect></clipPath>
      <clipPath id="c-l2"><rect id="w-l2" x="72" y="226" width="0" height="96"></rect></clipPath>
      <clipPath id="c-l3"><rect id="w-l3" x="72" y="330" width="0" height="72"></rect></clipPath>
      <clipPath id="c-tag"><rect id="w-tag" x="72" y="430" width="0" height="30"></rect></clipPath>
    </defs>
    <!-- Instrument plate: opaque backing so copy contrast is independent of the 3D render -->
    <rect x="48" y="72" width="560" height="414" rx="18" fill="#141D24" stroke="#314449" stroke-width="2"></rect>
    <circle cx="64" cy="88" r="4" fill="#314449"></circle><circle cx="592" cy="88" r="4" fill="#314449"></circle>
    <circle cx="64" cy="470" r="4" fill="#314449"></circle><circle cx="592" cy="470" r="4" fill="#314449"></circle>
    <g font-family="Futura, 'Century Gothic', 'Avenir Next', 'Helvetica Neue', sans-serif">
      <text id="t-label" x="80" y="120" font-size="16" letter-spacing="6" fill="#BC7751" clip-path="url(#c-label)">MODEL 1962 · IDEA ENGINE</text>
      <text id="t-l1" x="80" y="206" font-size="76" font-weight="bold" fill="#EEE3CB" clip-path="url(#c-l1)">An Idea</text>
      <text id="t-l2" x="80" y="302" font-size="76" font-weight="bold" fill="#EEE3CB" clip-path="url(#c-l2)">Becomes a</text>
      <text id="t-l3" x="80" y="384" font-size="52" font-style="italic" fill="#6B9693" clip-path="url(#c-l3)">Connected System</text>
      <text id="t-tag" x="80" y="452" font-size="18" letter-spacing="2" fill="#EEE3CB" clip-path="url(#c-tag)">Atomic-age wiring for the world of tomorrow</text>
    </g>
    <path id="rules" d="M80 410H460M80 420H400M80 430H340" fill="none" stroke="#BC7751" stroke-width="3" stroke-dasharray="380" stroke-dashoffset="380"></path>
  </svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.bundle.js"></script>
<script>
(function(){
  // Palette audit (chroma-js): each label against its actual opaque backing #141D24.
  const plate = '#141D24';
  for (const [id, fg] of [['t-label','#BC7751'],['t-l1','#EEE3CB'],['t-l2','#EEE3CB'],['t-l3','#6B9693'],['t-tag','#EEE3CB']]) {
    if (chroma.contrast(fg, plate) < 4.5) console.warn('Low contrast on ' + id);
  }
  const engine = window.IdeaEngine.create(document.getElementById('stage'));
  const s = engine.state;
  const tl = gsap.timeline({ paused: true, onUpdate: engine.draw });

  // Beat 1: power on. Nucleus ignites, rays extend, orbit rings swing into their gimbal tilt.
  tl.to(s, { nuc: 1, duration: 0.5, ease: 'back.out(1.4)' }, 0);
  tl.to(s, { rays: 1, duration: 0.5, ease: 'power2.out' }, 0.3);
  tl.to(s, { ring0: 1, duration: 0.75, ease: 'power2.inOut' }, 0.15);
  tl.to(s, { ring1: 1, duration: 0.75, ease: 'power2.inOut' }, 0.33);
  tl.to(s, { ring2: 1, duration: 0.75, ease: 'power2.inOut' }, 0.51);

  // Interface layer: display-style wipes print the copy line by line.
  tl.to('#w-label', { attr: { width: 420 }, duration: 0.55, ease: 'steps(12)' }, 0.3);
  tl.to('#w-l1', { attr: { width: 520 }, duration: 0.5, ease: 'power2.inOut' }, 0.45);
  tl.to('#w-l2', { attr: { width: 520 }, duration: 0.5, ease: 'power2.inOut' }, 0.68);
  tl.to('#w-l3', { attr: { width: 520 }, duration: 0.55, ease: 'power2.inOut' }, 0.92);
  tl.to('#rules', { attr: { 'stroke-dashoffset': 0 }, duration: 0.45, ease: 'power2.out' }, 1.2);
  tl.to('#w-tag', { attr: { width: 520 }, duration: 0.5, ease: 'power2.inOut' }, 1.35);

  // Beat 2: connection. Emissive wiring and the teal feed cable draw into the console; one signal pulse travels.
  tl.to(s, { cable: 1, duration: 0.7, ease: 'power2.inOut' }, 0.9);
  tl.to(s, { wire0: 1, duration: 0.6, ease: 'power2.inOut' }, 1.0);
  tl.to(s, { wire1: 1, duration: 0.6, ease: 'power2.inOut' }, 1.1);
  tl.to(s, { wire2: 1, duration: 0.65, ease: 'power2.inOut' }, 1.2);
  tl.to(s, { pulse: 1, duration: 0.65, ease: 'sine.inOut' }, 1.75);

  // Beat 3: the system responds. Toggles flip, gauge arc draws, needle swings, lamp lights.
  tl.to(s, { tog0: 1, duration: 0.3, ease: 'back.out(1.6)' }, 1.5);
  tl.to(s, { tog1: 1, duration: 0.3, ease: 'back.out(1.6)' }, 1.6);
  tl.to(s, { tog2: 1, duration: 0.3, ease: 'back.out(1.6)' }, 1.7);
  tl.to(s, { arc: 1, duration: 0.5, ease: 'power2.inOut' }, 1.7);
  tl.to(s, { needle: 1, duration: 0.5, ease: 'back.out(1.3)' }, 1.85);
  tl.to(s, { lamp: 1, duration: 0.35, ease: 'power2.out' }, 2.1);

  // Hold: complete, settled scene from ~2.45s to 3s.
  tl.to({}, { duration: 0.001 }, 2.999);

  const redraw = () => engine.draw();
  window.addEventListener('hf-seek', redraw);
  document.addEventListener('hf-seek', redraw);
  tl.progress(0); engine.draw();
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
})();
</script>

</html>
