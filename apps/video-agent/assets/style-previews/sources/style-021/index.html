<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>style-021 Hand-drawn Illustration — an idea becomes a connected system</title>
<style>
  @font-face { font-family: "Marker Felt"; src: local("Marker Felt"), local("MarkerFelt-Thin"), local("Marker Felt Thin"); font-display: block; }

  #root canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

    position: absolute; margin: 0; padding: 6px 10px 10px 4px; white-space: nowrap;
    font-family: "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive, sans-serif;
    color: #343E42; line-height: 1; letter-spacing: 0.5px;
    clip-path: inset(0 100% 0 0);

  #pen { z-index: 2; }
  .hand { z-index: 3; }
  #heading { left: 112px; top: 66px; font-size: 42px; transform: rotate(-3deg); transform-origin: 0 100%; }
  #caption { left: 516px; top: 556px; font-size: 48px; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="art" width="1280" height="720" aria-hidden="true"></canvas>
  <canvas id="pen" width="1280" height="720" aria-hidden="true"></canvas>
  <p id="heading" class="hand">an idea…</p>
  <p id="caption" class="hand">…becomes a connected system</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.js"></script>
<script>
  // GSAP owns composition time; the scene is a pure function of that time.
  (function () {
    var scene = window.__style021Scene;
    var clock = { t: 0 };
    var tl = gsap.timeline({ paused: true, onUpdate: function () { scene.render(tl.time()); } });
    tl.to(clock, { t: scene.duration, duration: scene.duration, ease: "none" }, 0);
    Object.keys(scene.labels).forEach(function (k) { tl.addLabel(k, scene.labels[k]); });
    window.__timelines = window.__timelines || {};
    window.__timelines["video"] = tl;
    function onSeek(e) { var tt = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tl.time(); scene.render(tt); }
    window.addEventListener("hf-seek", onSeek);
    document.addEventListener("hf-seek", onSeek);
    scene.render(0);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { scene.render(tl.time()); });
  })();
</script>
