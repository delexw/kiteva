<div id="video" data-style-id="style-123" data-style-renderer="Three.js; Soft Surface Lighting and Material Detail" data-motion-engine="GSAP; Procedural Paper Curl and Fold Deformation" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">

<!-- Style renderer: Three.js + Soft Surface Lighting and Material Detail; motion: GSAP + Procedural Paper Curl and Fold Deformation.

<script src="./scene.bundle.js"></script>
<script id="timeline-video">
  // GSAP owns θ (page-opening angle) and the camera dolly; the scene bundle evaluates every
  // transform from these values and renders, so forward, backward and direct seeks are exact.
  (function () {
    var scene = window.__scene123;
    var proxy = scene.proxy;
    var tl = gsap.timeline({ paused: true, onUpdate: scene.evaluate });
    tl.fromTo(proxy, { dolly: 0 }, { dolly: 1, duration: 2.5, ease: "sine.inOut", immediateRender: true }, 0);
    tl.fromTo(proxy, { theta: 20 }, { theta: 180, duration: 2.35, ease: "power2.inOut", immediateRender: false }, 0.1);
    tl.to(proxy, { dolly: 1, duration: 0.5, ease: "none" }, 2.5); // settled reading hold to 3.0 s
    tl.seek(0, false);
    window.__timelines = window.__timelines || {};
    window.__timelines.video = tl;
    window.addEventListener("hf-seek", function (e) {
      var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : null;
      if (t !== null) tl.seek(Math.min(3, Math.max(0, t)), false);
      scene.evaluate();
    });
  })();
</script>
