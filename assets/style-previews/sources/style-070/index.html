const plan={"styleId":"style-070","selectedReferenceIds":[],"rationale":"Pearlescent silk ribbons sweep across the frame, with pearls resting on and below them, joined by thin threads. The surface is revealed through measured flow. The main iridescent band (actor-2) slides in from the left as it fades up, like silk unfurling. Its paler inner layer (actor-3) follows a beat later for depth. The bright sheen edge (actor-4, a stroked unfilled path) then draws along the top of the silk. Next the pearls appear in a stagger: first the free pearl at left, then the pearls resting on the ribbon. The two threads (actors 5 and 6, stroked) draw toward the lower-right pearl, which forms last as the point where they meet. The serif headline and caption never move. The morphing-orb reference was rejected because the pearls are small rigid beads, not a deforming orb. Tilt and chapter handoffs aren't supported by this single scene.","tracks":[{"actorId":"demo-actor-2","role":"Main iridescent silk band flows in from the left and settles","action":"reveal","start":0,"duration":0.8,"ease":"power2.inOut","pose":{"x":-48,"y":0,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-3","role":"Pale inner silk fold follows for layered depth","action":"reveal","start":0.2,"duration":0.8,"ease":"power2.inOut","pose":{"x":-32,"y":0,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-4","role":"Bright sheen edge draws along the top of the silk","action":"draw","start":0.5,"duration":0.7,"ease":"sine.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-9","role":"Left pearl (thread origin) forms","action":"reveal","start":0.8,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-11","role":"Pearl resting on the left ribbon crest forms","action":"reveal","start":0.95,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-7","role":"Central pearl on the ribbon forms","action":"reveal","start":1.1,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-10","role":"Upper-right pearl on the ribbon forms","action":"reveal","start":1.25,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-5","role":"Lilac thread draws from the left pearl toward the lower-right pearl","action":"draw","start":1.2,"duration":0.6,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-6","role":"Sage thread draws from the central pearl to the same node","action":"draw","start":1.35,"duration":0.5,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-8","role":"Lower-right pearl forms where both threads meet, completing the system","action":"reveal","start":1.65,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#3F4351";
const background="#F1EDEA";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');

 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
