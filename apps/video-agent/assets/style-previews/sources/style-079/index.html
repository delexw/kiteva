<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1F2C34; }
  #root { position: relative; width: 100%; height: 100%; background: #1F2C34; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  .copy { position: absolute; margin: 0; white-space: nowrap; }
  #h1 { left: 80px; top: 58px; font: 400 44px/52px Georgia, "Times New Roman", serif; color: #EEE6D4; }
  #h2 { left: 80px; top: 110px; font: italic 400 44px/52px Georgia, "Times New Roman", serif; color: #B3885F; }
  #tag { right: 80px; top: 80px; font: 400 14px/20px "Helvetica Neue", Arial, sans-serif; letter-spacing: 3px; color: #EEE6D4; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <p id="h1" class="copy">An idea becomes</p>
  <p id="h2" class="copy">a connected system</p>
  <p id="tag" class="copy">MINIATURE STAGE · 1:87</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="diorama.js"></script>
<script>
(function () {
  const diorama = window.createDiorama(document.getElementById('stage'));

  // Scene state: every property has exactly one owning tween on this timeline.
  const state = {
    azimuth: 18, radius: 50,
    tower: 0.02, orb: 0, glow: 0, halo: 0, screen: 0,
    roads: 0, ring: 0, trees: 0, figures: 0,
    house0: 0, house1: 0, house2: 0, house3: 0,
    pod0: 0, pod1: 0, pod2: 0, pod3: 0,
    win0: 0, win1: 0, win2: 0, win3: 0
  };
  const draw = () => diorama.render(state);

  const tl = gsap.timeline({ paused: true, onUpdate: draw });
  // Camera: one bounded orbit + push-in that eases into the frontal isometric hero view.
  tl.to(state, { azimuth: 45, duration: 2.6, ease: 'power2.inOut' }, 0);
  tl.to(state, { radius: 46, duration: 2.6, ease: 'power2.inOut' }, 0);
  // Part animation: the idea rises first.
  tl.to(state, { tower: 1, duration: 0.7, ease: 'back.out(1.2)' }, 0.1);
  tl.to(state, { orb: 1, duration: 0.5, ease: 'back.out(1.6)' }, 0.55);
  tl.to(state, { halo: 1, duration: 0.6, ease: 'sine.inOut' }, 0.7);
  tl.to(state, { glow: 1, duration: 0.6, ease: 'sine.inOut' }, 0.75);
  tl.to(state, { screen: 1, duration: 1.4, ease: 'none' }, 0.8);
  // Roads extend outward from the tower, then the back link closes the loop.
  tl.to(state, { roads: 1, duration: 0.7, ease: 'power2.inOut' }, 0.8);
  tl.to(state, { ring: 1, duration: 0.5, ease: 'power2.inOut' }, 1.35);
  // Houses rise at the road ends, staggered.
  ['house0', 'house1', 'house2', 'house3'].forEach((k, i) => {
    tl.to(state, { [k]: 1, duration: 0.45, ease: 'back.out(1.4)' }, 1.05 + i * 0.12);
  });
  tl.to(state, { trees: 1, duration: 0.45, ease: 'back.out(1.4)' }, 1.3);
  tl.to(state, { figures: 1, duration: 0.35, ease: 'back.out(1.4)' }, 1.5);
  // Flow: a pod travels from the idea to each house; its windows light on arrival.
  ['pod0', 'pod1', 'pod2', 'pod3'].forEach((k, i) => {
    const s = 1.55 + i * 0.12;
    tl.to(state, { [k]: 1, duration: 0.55, ease: 'power1.inOut' }, s);
    tl.to(state, { ['win' + i]: 1, duration: 0.2, ease: 'sine.out' }, s + 0.5);
  });
  tl.to({}, { duration: 0.001 }, 2.999);

  draw();
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  // Redraw on any framework seek (direct, backward or out of order).
  window.addEventListener('hf-seek', (e) => {
    const t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    tl.time(t, false);
    draw();
  });
})();
</script>

</html>
