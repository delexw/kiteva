<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photorealism — style-061 caustic optics preview</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #151C1F; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; background: #151C1F; overflow: hidden; }
  #gl { position: absolute; inset: 0; }
  #copy { position: absolute; inset: 0; pointer-events: none; color: #ECE9E2;
    font-family: Georgia, "Times New Roman", serif; }
  #copy .t { position: absolute; left: 7.03%; margin: 0; white-space: nowrap; }
  #kicker { top: 15.6%; font-size: 1.95vh; letter-spacing: 0.29em; color: #ECE9E2; }
  #h1 { top: 19.9%; font-size: 6.4vh; font-weight: normal; line-height: 1.13; color: #ECE9E2; }
  #h1 em { font-style: italic; }
  #rule { top: 37%; width: 7.8%; height: 1px; background: #93A5A4; transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"
     data-style-renderer="Three.js, PBR Materials, Postprocessing" data-motion-engine="GSAP"
     data-recipe="caustic_optics" data-optics-note="Caustics are an analytic real-time approximation, not path-traced">
  <div id="gl"></div>
  <div id="copy">
    <p class="t" id="kicker">STUDY Nº 61 — STILL LIFE</p>
    <h1 class="t" id="h1"><em>An idea becomes</em><br>a connected system.</h1>
    <div class="t" id="rule"></div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<!-- Style renderer: Three.js WebGLRenderer (SRGB output + ACESFilmicToneMapping set explicitly), PMREM RoomEnvironment,
     MeshPhysicalMaterial brushed steel + transmission/IOR glass + transmissive water film, PCF soft shadows, analytic contact shadows,
     EffectComposer/RenderPass/BokehPass/OutputPass. Bundled locally from node_modules/three with esbuild (src/ -> scene.bundle.js).
     Motion engine: GSAP paused timeline. Recipe: caustic_optics. Floor caustics are derived from the same analytic water height
     field that bends the water normals and follow the key light. This is an approximation, NOT path-traced. -->
<script src="scene.bundle.js"></script>
<script>
(function () {
  var W = 1280, H = 720;
  var PAL = window.PhotorealStillLife.PAL;
  Object.keys(PAL).forEach(function (k) { if (!chroma.valid(PAL[k])) throw new Error('invalid palette token ' + k); });
  var view = window.PhotorealStillLife.createScene(document.getElementById('gl'), W, H);

  // Scene state. Only the GSAP timeline writes it, and every frame is a pure function of it.
  var INIT = { rollA: 0, phase: 0, ripFront: 0, ripAmp: 0, linkGate: 1, bd: 0, cd: 0, lightAz: -10, az: -6, el: 17, dist: 12.2, focus: 0 };
  var st = Object.assign({}, INIT);
  function draw() { view.render(st); }

  var tl = gsap.timeline({ paused: true, onUpdate: draw, defaults: { immediateRender: false } });
  tl.set(st, INIT, 0);
  // 0.00–0.85 s: the glass idea rolls into the water film and decelerates to rest (rolling without slipping)
  tl.fromTo(st, { rollA: 0 }, { rollA: 1, duration: 0.85, ease: 'power2.out' }, 0);
  // Ambient water phase: eases to rest by 2.6 s so the final hold is a still photograph
  tl.fromTo(st, { phase: 0 }, { phase: 1.6, duration: 2.6, ease: 'sine.out' }, 0);
  // 0.85–2.6 s: a ripple spreads from the rest point at ~2.7 m/s. Its caustic rings cross the floor
  // and carry rods A–B and A–C out to the steel nodes.
  tl.fromTo(st, { ripFront: 0 }, { ripFront: 4.8, duration: 1.75, ease: 'none' }, 0.85);
  tl.fromTo(st, { ripAmp: 0 }, { ripAmp: 0.035, duration: 0.15, ease: 'power1.out' }, 0.85);
  tl.fromTo(st, { ripAmp: 0.035 }, { ripAmp: 0, duration: 1.6, ease: 'power2.in' }, 1.0);
  // 1.85–2.5 s: the outer links close the system
  tl.fromTo(st, { bd: 0 }, { bd: 1, duration: 0.55, ease: 'power2.inOut' }, 1.85);
  tl.fromTo(st, { cd: 0 }, { cd: 1, duration: 0.55, ease: 'power2.inOut' }, 1.95);
  // 0–2.6 s: the key light swings 14°. Shadows, caustics and the glass focus spot travel with it.
  tl.fromTo(st, { lightAz: -10 }, { lightAz: 4, duration: 2.6, ease: 'sine.inOut' }, 0);
  // 0–2.6 s: measured 10° camera arc with a slight dolly-in. Focus pulls from the idea to the system.
  tl.fromTo(st, { az: -6 }, { az: 4, duration: 2.6, ease: 'sine.inOut' }, 0);
  tl.fromTo(st, { dist: 12.2 }, { dist: 11.3, duration: 2.6, ease: 'power2.inOut' }, 0);
  tl.fromTo(st, { focus: 0 }, { focus: 1, duration: 1.9, ease: 'sine.inOut' }, 0.5);
  // Standalone copy (independent timing)
  tl.fromTo('#kicker', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
  tl.fromTo('#h1', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.2);
  tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power2.inOut' }, 0.6);
  // Settled hold 2.6–3.0 s
  tl.set(st, { focus: 1 }, 3);

  tl.progress(1).progress(0);
  draw();

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  function resync(e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : null;
    if (t !== null) tl.seek(t, false);
    draw();
  }
  window.addEventListener('hf-seek', resync);
  document.addEventListener('hf-seek', resync);
})();
</script>
