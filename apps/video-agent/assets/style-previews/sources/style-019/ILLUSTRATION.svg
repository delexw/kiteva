<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720'><defs><pattern id='h' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#252A30' stroke-width='1' opacity='0.3'/></pattern><circle id='d' r='9' fill='#FAF5EA' stroke='#252A30' stroke-width='2'/></defs><rect x='0' y='0' width='1280' height='720' fill='#FAF5EA'/><g font-family='Helvetica Neue, Arial, sans-serif' font-size='12' letter-spacing='3' fill='#252A30'><text x='80' y='70'>THE SYSTEMS ISSUE</text><text x='1200' y='70' text-anchor='end'>NO. 19 — AUTUMN</text></g><line x1='80' y1='86' x2='1200' y2='86' stroke='#252A30' stroke-width='1.5'/><g font-family='Georgia, Times New Roman, serif' font-size='66' fill='#252A30'><text x='80' y='200'>An idea</text><text x='80' y='272'>becomes a</text><text x='80' y='344' font-style='italic' fill='#A84235'>connected</text><text x='80' y='416'>system.</text></g><line x1='80' y1='452' x2='140' y2='452' stroke='#A84235' stroke-width='3'/><g font-family='Helvetica Neue, Arial, sans-serif' font-size='15' fill='#252A30'><text x='80' y='494'>Every network begins</text><text x='80' y='516'>as a single point of</text><text x='80' y='538'>thought, then learns</text><text x='80' y='560'>to reach outward.</text><text x='350' y='494'>Links multiply, the</text><text x='350' y='516'>pattern holds, and the</text><text x='350' y='538'>whole grows larger</text><text x='350' y='560'>than its parts.</text></g><rect x='700' y='130' width='500' height='420' fill='url(#h)'/><rect x='700' y='130' width='500' height='420' fill='none' stroke='#252A30'/><g stroke='#252A30' stroke-width='2'><path d='M950 340L790 220M950 340L1110 210M950 340L820 470M950 340L1100 480M950 340L950 180M950 340L760 350M950 340L1140 350M790 220L950 180L1110 210M820 470L1100 480'/></g><use href='#d' x='790' y='220'/><use href='#d' x='1110' y='210'/><use href='#d' x='820' y='470'/><use href='#d' x='1100' y='480'/><use hre