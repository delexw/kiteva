<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF" data-demo-actor="demo-actor-1"></rect><circle cx="262" cy="190" r="52" fill="#C92B2B" data-demo-actor="demo-actor-2"></circle><line x1="300" y1="226" x2="590" y2="418" stroke="#000000" stroke-width="3" data-demo-actor="demo-actor-3"></line><text x="330" y="272" transform="rotate(33.5 330 272)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#000000" data-demo-actor="demo-actor-4">AN IDEA BECOMES</text><g transform="rotate(-16 760 420)" data-demo-actor="demo-actor-5"><rect x="560" y="300" width="300" height="180" fill="#000000" data-demo-actor="demo-actor-6"></rect><rect x="470" y="512" width="580" height="26" fill="#E8BE30" data-demo-actor="demo-actor-7"></rect><rect x="900" y="236" width="96" height="96" fill="#2453A0" data-demo-actor="demo-actor-8"></rect><rect x="770" y="600" width="220" height="12" fill="#C92B2B" data-demo-actor="demo-actor-9"></rect><rect x="1010" y="392" width="150" height="10" fill="#000000" data-demo-actor="demo-actor-10"></rect><rect x="1050" y="576" width="80" height="14" fill="#000000" data-demo-actor="demo-actor-11"></rect><rect x="1083" y="543" width="14" height="80" fill="#000000" data-demo-actor="demo-actor-12"></rect><path d="M860 330 L900 300 M996 332 L1060 392 M860 470 L1010 400 M1090 543 L1085 402" stroke="#000000" stroke-width="2" fill="none" data-demo-actor="demo-actor-13"></path><text x="470" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#000000" data-demo-actor="demo-actor-14">A CONNECTED const plan={"styleId":"style-004","selectedReferenceIds":[],"rationale":"Suprematist composition on an open white field: a red circle, a large tilted black rectangle, a blue square, a long yellow bar and a short red bar, joined by thin connecting lines. The motion is slow and measured, using position, rotation and proportion. The circle grows in, the black rectangle settles in from a slight extra tilt, and the blue square drifts down from the upper right. Then the yellow and red bars slide into alignment. All five forms are filled shapes, so they use reveal and no draw is used, which fixes the previous error. The thin lines, text, cross and small accents stay still. Everything holds from about 1.8s. No reference fits these abstract forms.","tracks":[{"actorId":"demo-actor-2","role":"red circle grows in at the top left","action":"reveal","start":0,"duration":0.6,"ease":"sine.inOut","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-6","role":"black rectangle settles in from a slight extra tilt","action":"reveal","start":0.25,"duration":0.7,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":0.8,"rotation":-10,"opacity":0}},{"actorId":"demo-actor-8","role":"blue square drifts down into balance","action":"reveal","start":0.6,"duration":0.6,"ease":"sine.inOut","pose":{"x":40,"y":-32,"scale":1,"rotation":12,"opacity":0}},{"actorId":"demo-actor-7","role":"yellow bar slides in from the left","action":"reveal","start":0.9,"duration":0.6,"ease":"power2.inOut","pose":{"x":-48,"y":0,"scale":1,"rotation":0,"opacity":0}},{"actorId":"demo-actor-9","role":"red bar slides in from the right","action":"reveal","start":1.15,"duration":0.55,"ease":"power2.inOut","pose":{"x":44,"y":0,"scale":1,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#000000";
const background="#FFFFFF";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
