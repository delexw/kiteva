demo-actor="demo-actor-10"></rect><g stroke="#E05AAA" stroke-width="1.5" filter="url(#gl)" data-demo-actor="demo-actor-11"><path d="M0 430H1280M0 442H1280M0 460H1280M0 486H1280M0 524H1280M0 580H1280M0 660H1280" data-demo-actor="demo-actor-12"></path><path d="M640 430L640 720M640 430L420 720M640 430L200 720M640 430L-20 720M640 430L-240 720M640 430L860 720M640 430L1080 720M640 430L1300 720M640 430L1520 720" data-demo-actor="demo-actor-13"></path></g><g filter="url(#gl)" data-demo-actor="demo-actor-14"><path d="M640 300 L640 486 L420 580 M640 486 L908 580 M420 580 L280 660 M908 580 L1080 660" fill="none" stroke="#5DCEE0" stroke-width="3" data-demo-actor="demo-actor-15"></path><circle cx="640" cy="300" r="10" fill="#F8ECDC" data-demo-actor="demo-actor-16"></circle><g fill="#171333" stroke="#5DCEE0" stroke-width="3" data-demo-actor="demo-actor-17"><circle cx="640" cy="486" r="8" data-demo-actor="demo-actor-18"></circle><circle cx="420" cy="580" r="9" data-demo-actor="demo-actor-19"></circle><circle cx="908" cy="580" r="9" data-demo-actor="demo-actor-20"></circle><circle cx="280" cy="660" r="11" data-demo-actor="demo-actor-21"></circle><circle cx="1080" cy="660" r="11" data-demo-actor="demo-actor-22"></circle></g></g><text x="640" y="96" text-anchor="middle" font-family="Futura,Trebuchet MS,sans-serif" font-style="italic" font-weight="800" font-size="58" fill="url(#sun)" stroke="#F8ECDC" stroke-width="1.5" letter-spacing="4" data-demo-actor="demo-actor-23">AN IDEA BECOMES</text><text x="640" y="140" text-anchor="middle" font-family="Futura,Trebuchet MS,sans-serif" font-size="20" letter-spacing="12" fill="#5DCEE0" data-demo-actor="demo-actor-24">A CONNECTED SYSTEM</text></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-072","selectedReferenceIds":[],"rationale":"Read the PNG and SVG. The image is a striped synthwave sun behind outlined mountains, a pink perspective grid, and a cyan network running from a beacon at the sun's centre down to nodes on the grid, with the title above. The motion builds toward the horizon: the sun rises from behind the dark floor and mountains (they hide it naturally) and its stripes rise with it. Then the beacon lights, the cyan network draws down the grid, and its nodes pop in from the horizon outward on the beat. Finally the title and subtitle punch in. The grid, mountains, stars and background stay still. No reference used, since this is a single scene with no chapter change.","tracks":[{"actorId":"demo-actor-8","role":"Striped sun rises from behind the horizon floor","action":"reveal","start":0,"duration":0.8,"ease":"power2.inOut","pose":{"x":0,"y":48,"scale":1,"rotation":0,"opacity":0.2}},{"actorId":"demo-actor-16","role":"Beacon at the sun's centre lights","action":"reveal","start":0.6,"duration":0.35,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-15","role":"Cyan network line draws down the grid","action":"draw","start":0.75,"duration":0.8,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-18","role":"Horizon junction node","action":"reveal","start":1,"duration":0.3,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-19","role":"Left mid node","action":"reveal","start":1.2,"duration":0.3,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-20","role":"Right mid node","action":"reveal","start":1.25,"duration":0.3,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-21","role":"Left foreground node","action":"reveal","start":1.45,"duration":0.3,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-22","role":"Right foreground node","action":"reveal","start":1.5,"duration":0.3,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-23","role":"Title AN IDEA BECOMES punches in","action":"reveal","start":1.55,"duration":0.45,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.8,"rotation":0,"opacity":0}},{"actorId":"demo-actor-24","role":"Subtitle settles in under the title","action":"reveal","start":1.8,"duration":0.45,"ease":"sine.inOut","pose":{"x":0,"y":-16,"scale":1,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#F8ECDC";
const background="#171333";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
