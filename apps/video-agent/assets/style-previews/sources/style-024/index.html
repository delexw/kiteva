e ③ 'now every part talks!' rises into place","action":"reveal","start":1.8,"duration":0.4,"ease":"back.out(1.2)","pose":{"x":0,"y":16,"scale":0.85,"rotation":0,"opacity":0}},{"actorId":"demo-actor-34","role":"Red marker underlines under the title and note ③ draw last","action":"draw","start":1.8,"duration":0.6,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}}]};

  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));

 }
}
