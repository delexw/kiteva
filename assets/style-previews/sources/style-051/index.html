<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Screen Printing — One Spark</title>
<link rel="preload" as="image" href="assets/paper-fiber.png">
<link rel="preload" as="image" href="assets/grain-teal.png">
<link rel="preload" as="image" href="assets/grain-orange.png">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#D9E0E3}
  [data-composition-id="video"]{position:relative;width:100%;height:100%;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  .type{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
</style>
</head>
<body>
<div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Fixed (seeded, static) ink-edge roughness: applied only to ink shapes, never to lettering. -->
    <filter id="inkEdge" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Prepared ink-grain masks (tools/make-textures.mjs, fixed seeds). -->
    <mask id="grainTeal" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <image href="assets/grain-teal.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
    </mask>
    <mask id="grainOrange" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <image href="assets/grain-orange.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
    </mask>
    <!-- Squeegee pulls: one clip per screen, driven from composition time. -->
    <clipPath id="tealPull" clipPathUnits="userSpaceOnUse"><rect id="tealPullRect" x="-40" y="-40" width="0" height="800"/></clipPath>
    <clipPath id="orangePull" clipPathUnits="userSpaceOnUse"><rect id="orangePullRect" x="-60" y="-60" width="1400" height="0"/></clipPath>
    <clipPath id="labelPull" clipPathUnits="userSpaceOnUse"><rect id="labelPullRect" x="40" y="634" width="0" height="78"/></clipPath>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect x="0" y="0" width="8" height="22" fill="#DD3F18"/>
    </pattern>
  </defs>

  <!-- PAPER: cool blue-gray recycled stock; stationary, with a static fibre texture. -->
  <rect x="0" y="0" width="1280" height="720" fill="#D9E0E3"/>
  <image href="assets/paper-fiber.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" style="mix-blend-mode:multiply"/>

  <!-- SCREEN 1 — deep teal ink -->
  <g id="screen-teal" data-demo-actor="demo-actor-1">
    <g filter="url(#inkEdge)" mask="url(#grainTeal)">
      <g clip-path="url(#tealPull)">
        <rect x="600" y="-30" width="720" height="780" fill="#0B4F58"/>
      </g>
    </g>
    <g clip-path="url(#tealPull)" class="type" fill="#0B4F58">
      <text x="60" y="120" font-size="92">ONE</text>
    </g>
  </g>

  <!-- SCREEN 2 — vermilion-orange ink, multiply overprint, registration settle -->
  <g id="screen-orange" data-demo-actor="demo-actor-2" style="mix-blend-mode:multiply">
    <g id="orangeReg">
      <g filter="url(#inkEdge)" mask="url(#grainOrange)">
        <g clip-path="url(#orangePull)">
          <circle cx="600" cy="380" r="240" fill="#DD3F18"/>
          <!-- Hatch band with a true knockout box (evenodd hole) that holds the label. -->
          <path id="label-box" d="M0 626H606V720H0Z M40 634H452V712H40Z" fill="url(#hatch)" fill-rule="evenodd"/>
        </g>
      </g>
      <g clip-path="url(#orangePull)" class="type" fill="#DD3F18">
        <text x="60" y="205" font-size="92">SPARK</text>
      </g>
    </g>
  </g>

  <!-- Label inside knockout box: revealed only after the box exists. -->
  <g data-reveal-after="label-box" clip-path="url(#labelPull)" class="type" fill="#0B4F58" font-size="28" letter-spacing="2">
    <text x="60" y="664">BECOMES A</text>
    <text x="60" y="698">CONNECTED SYSTEM</text>
  </g>

  <!-- SCREEN 3 — opaque paper-tone ink: network lines, nodes, bulb -->
  <g id="screen-paper" filter="url(#inkEdge)" data-demo-actor="demo-actor-3">
    <g fill="none" stroke="#D9E0E3" stroke-width="12" stroke-linecap="round">
      <path id="link-bulb-top" class="link" d="M560 360L960 160"/>
      <path id="link-top-right" class="link" d="M960 160L1150 300"/>
      <path id="link-top-hub" class="link" d="M960 160L1000 470"/>
      <path id="link-right-hub" class="link" d="M1150 300L1000 470"/>
      <path id="link-hub-lowright" class="link" d="M1000 470L1180 600"/>
      <path id="link-hub-lowleft" class="link" d="M1000 470L850 620"/>
    </g>
    <g fill="#D9E0E3">
      <circle id="node-top" class="node" cx="960" cy="160" r="28"/>
      <circle id="node-right" class="node" cx="1150" cy="300" r="28"/>
      <circle id="node-hub" class="node" cx="1000" cy="470" r="28"/>
      <circle id="node-lowright" class="node" cx="1180" cy="600" r="28"/>
      <circle id="node-lowleft" class="node" cx="850" cy="620" r="28"/>
    </g>
    <g id="bulb" fill="#D9E0E3">
      <circle id="bulbGlobe" cx="520" cy="350" r="96"/>
      <path id="bulbBase" d="M470 420h100v70h-100zM486 505h68v26h-68z"/>
    </g>
  </g>

  <!-- SCREEN 2, second pull — orange details overprinted on the paper-tone ink -->
  <g id="orange-detail" style="mix-blend-mode:multiply" filter="url(#inkEdge)" data-demo-actor="demo-actor-4">
    <path id="filament" d="M490 380q30-80 60 0" fill="none" stroke="#DD3F18" stroke-width="10" stroke-linecap="round"/>
    <g fill="#DD3F18">
      <circle id="dot-top" class="dot" cx="960" cy="160" r="13"/>
      <circle id="dot-hub" class="dot" cx="1000" cy="470" r="13"/>
      <circle id="dot-lowleft" class="dot" cx="850" cy="620" r="13"/>
    </g>
  </g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="motion-print.js"></script>
<script>
(function(){
  // Palette audit (chroma-js): text pairs measured against the opaque paper.
  const PAPER='#D9E0E3', TEAL='#0B4F58', ORANGE='#DD3F18';
  window.__paletteAudit={teal_on_paper:+chroma.contrast(TEAL,PAPER).toFixed(2),orange_on_paper_large:+chroma.contrast(ORANGE,PAPER).toFixed(2),paper_on_teal:+chroma.contrast(PAPER,TEAL).toFixed(2)};

  // Motion (pure utilities) owns every animated value; GSAP only supplies seekable time.
  const {interpolate,easeInOut,easeOut,backOut,clamp}=window.PrintMotion;
  const prog=(t,a,b)=>clamp(0,1,(t-a)/(b-a));
  const tealW=interpolate([0.05,0.62],[0,1360],{ease:easeInOut,clamp:true});
  const orangeH=interpolate([0.45,1.02],[0,840],{ease:easeInOut,clamp:true});
  const regX=interpolate([0.45,1.18],[16,0],{ease:easeOut,clamp:true});
  const regY=interpolate([0.45,1.18],[-11,0],{ease:easeOut,clamp:true});
  const labelW=interpolate([1.06,1.34],[0,412],{ease:easeInOut,clamp:true});
  const globeS=interpolate([0.95,1.28],[0.6,1],{ease:backOut,clamp:true});
  const baseY=interpolate([1.08,1.4],[34,0],{ease:easeOut,clamp:true});
  const popS=p=>interpolate([0,1],[0.55,1],{ease:backOut})(p);

  const q=s=>document.querySelector(s);
  const tealRect=q('#tealPullRect'),orangeRect=q('#orangePullRect'),labelRect=q('#labelPullRect');
  const reg=q('#orangeReg'),globe=q('#bulbGlobe'),base=q('#bulbBase'),fil=q('#filament');
  // Cache geometry once.
  // Draw windows (seconds) kept in script so no HyperFrames clip-timing attributes are implied.
  const LINK_TIMES={'link-bulb-top':[1.05,1.42],'link-top-right':[1.42,1.68],'link-top-hub':[1.42,1.74],'link-right-hub':[1.68,1.92],'link-hub-lowright':[1.74,1.98],'link-hub-lowleft':[1.74,1.96]};
  const NODE_TIMES={'node-top':1.38,'node-right':1.64,'node-hub':1.70,'node-lowright':1.94,'node-lowleft':1.92};
  const links=[...document.querySelectorAll('.link')].map(el=>({el,len:el.getTotalLength(),a:LINK_TIMES[el.id][0],b:LINK_TIMES[el.id][1]}));
  const nodes=[...document.querySelectorAll('.node')].map(el=>({el,at:NODE_TIMES[el.id],cx:+el.getAttribute('cx'),cy:+el.getAttribute('cy')}));
  const dots=[...document.querySelectorAll('.dot')].map((el,i)=>({el,at:2.0+i*0.06,cx:+el.getAttribute('cx'),cy:+el.getAttribute('cy')}));
  const filLen=fil.getTotalLength();
  links.forEach(l=>l.el.setAttribute('stroke-dasharray',l.len+' '+(l.len+20)));
  fil.setAttribute('stroke-dasharray',filLen+' '+(filLen+20));
  const scaleAbout=(cx,cy,s)=>`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`;

  function render(time){
    const t=clamp(0,3,time);
    tealRect.setAttribute('width',tealW(t).toFixed(2));
    orangeRect.setAttribute('height',orangeH(t).toFixed(2));
    reg.setAttribute('transform',`translate(${regX(t).toFixed(2)} ${regY(t).toFixed(2)})`);
    labelRect.setAttribute('width',labelW(t).toFixed(2));

    const g=prog(t,0.95,1.28);
    globe.setAttribute('opacity',g>0?1:0);
    globe.setAttribute('transform',scaleAbout(520,350,globeS(t).toFixed(4)));
    const bp=prog(t,1.08,1.4);
    base.setAttribute('opacity',(clamp(0,1,bp*2.5)).toFixed(3));
    base.setAttribute('transform',`translate(0 ${baseY(t).toFixed(2)})`);

    for(const l of links){const p=easeInOut(prog(t,l.a,l.b));l.el.setAttribute('stroke-dashoffset',(l.len*(1-p)).toFixed(2));l.el.setAttribute('visibility',p>0?'visible':'hidden');}
    for(const n of nodes){const p=prog(t,n.at,n.at+0.26);n.el.setAttribute('opacity',p>0?1:0);n.el.setAttribute('transform',scaleAbout(n.cx,n.cy,popS(p).toFixed(4)));}
    for(const d of dots){const p=prog(t,d.at,d.at+0.24);d.el.setAttribute('opacity',p>0?1:0);d.el.setAttribute('transform',scaleAbout(d.cx,d.cy,popS(p).toFixed(4)));}
    const fp=easeInOut(prog(t,2.0,2.3));
    fil.setAttribute('stroke-dashoffset',(filLen*(1-fp)).toFixed(2));fil.setAttribute('visibility',fp>0?'visible':'hidden');
  }

  const clock={t:0};
  const tl=gsap.timeline({paused:true,onUpdate:()=>render(tl.time())});
  tl.to(clock,{t:3,duration:3,ease:'none'},0);
  render(0);
  const resync=()=>render(tl.time());
  window.addEventListener('hf-seek',resync);document.addEventListener('hf-seek',resync);
  window.__printRender=render;
  window.__timelines=window.__timelines||{};
  window.__timelines.video=tl;
})();
</script>

</html>
