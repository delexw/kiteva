<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A spark at dusk — Post-Impressionist Painting preview</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2E2D4F}
  #root{position:relative;width:100%;height:100%;overflow:hidden}
  #paint{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #card{position:absolute;left:5%;top:7.5%;width:52%;padding:22px 30px 22px 30px;box-sizing:border-box;
    background:#EEE2C2;color:#344F60;
    clip-path:polygon(0.6% 3%,8% 0.4%,22% 2.2%,41% 0%,63% 1.8%,84% 0.3%,99.2% 2.6%,100% 30%,99.1% 62%,99.8% 97%,80% 99.4%,57% 98%,33% 100%,12% 98.6%,0.4% 99.6%,0% 64%,0.9% 31%)}
  @font-face{font-family:"Didot";font-style:normal;font-weight:400;src:local("Didot"),local("Didot Regular"),local("Georgia")}
  @font-face{font-family:"Didot";font-style:italic;font-weight:400;src:local("Didot Italic"),local("Georgia Italic"),local("Georgia")}
  @font-face{font-family:"Bodoni 72";font-style:normal;font-weight:400;src:local("Bodoni 72 Book"),local("Bodoni 72"),local("Georgia")}
  @font-face{font-family:"Bodoni 72";font-style:italic;font-weight:400;src:local("Bodoni 72 Book Italic"),local("Bodoni 72 Italic"),local("Georgia Italic")}
  #card h1{margin:0;font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:52px;line-height:1.08;color:#344F60}
  #card p{margin:10px 0 0 0;font-family:Didot,"Bodoni 72",Georgia,serif;font-style:italic;font-size:28px;line-height:1.2;color:#344F60}
  #card .rule{display:block;width:150px;height:6px;margin-top:12px;border-radius:3px;background:#B26B57}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="paint" width="1280" height="720"></canvas>
  <div id="card">
    <h1>A spark at dusk</h1>
    <p>lights the whole village, one road at a time</p>
    <span class="rule"></span>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(function(){
'use strict';
const W=1280,H=720;
// ---- Resolved scene palette (dusk field; approved token roles kept for village objects) ----
const C={
  ink:'#344F60', gold:'#B58B42', land:'#638873', brick:'#B26B57', paper:'#EEE2C2',
  sky:['#2E2D4F','#3F3A62','#5A4A72','#7B5A7A','#A36F82','#C98880','#E0A684'],
  under:['#4C6466','#455B60','#536C6C','#3F5559'],
  lit:['#638873','#6F9478','#7FA27A','#5A7E6C','#8DAA72'],
  warmLit:['#B9A566','#C9A860','#9FA56C'],
  band:['#344F60','#2C4453','#3A586A'],
  cypress:['#23382F','#2E4A3B','#3E5E48','#344F60','#1C2E2A'],
  sun:['#F4DC9A','#EBC777','#D9AE5C','#B58B42'],
  house:['#B26B57','#C47E66','#9E5C4C'],
  road:['#B26B57','#9E5C4C'], roadHi:'#D49A74',
  dark:'#2B2F48', glowCore:'#F6D98E'
};
// seeded PRNG (mulberry32) — all stroke layouts are built once, deterministically
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(36036);
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- hill contour lookup ----
function quadPts(p0,c,p1,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]]);}return o;}
const hillPts=[].concat(quadPts([0,470],[220,400],[460,455],80),quadPts([460,455],[700,510],[900,440],80),quadPts([900,440],[1100,370],[1280,455],80));
const hillY=new Float32Array(W+1);
(function(){let j=0;for(let x=0;x<=W;x++){while(j<hillPts.length-2&&hillPts[j+1][0]<x)j++;const a=hillPts[j],b=hillPts[j+1];const f=b[0]===a[0]?0:clamp((x-a[0])/(b[0]-a[0]),0,1);hillY[x]=a[1]+(b[1]-a[1])*f;}})();
const bandY=x=>{const p=quadAt([0,640],[320,600],[640,630],[1280,620],x);return p;};
function quadAt(p0,c,p1,p2,x){ // two-segment band, second uses reflected control
  if(x<=640){const t=x/640,u=1-t;return u*u*p0[1]+2*u*t*c[1]+t*t*p1[1];}
  const c2=[2*p1[0]-c[0],2*p1[1]-c[1]];const t=(x-640)/640,u=1-t;return u*u*p1[1]+2*u*t*c2[1]+t*t*p2[1];
}

// ---- brush stroke primitive: quadratic stroke, partially drawn by exact de Casteljau split ----
function mkStroke(x,y,a,len,w,col,bend){const dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;const nx=-Math.sin(a),ny=Math.cos(a);
  return {x0:x-dx,y0:y-dy,cx:x+nx*bend,cy:y+ny*bend,x1:x+dx,y1:y+dy,w,col,hi:chroma(col).brighten(0.55).hex(),nx,ny};}
function drawStroke(ctx,s,f,alpha){
  if(f<=0||alpha<=0)return; f=Math.min(1,f);
  const qx=s.x0+(s.cx-s.x0)*f,qy=s.y0+(s.cy-s.y0)*f;
  const u=1-f;const ex=u*u*s.x0+2*u*f*s.cx+f*f*s.x1,ey=u*u*s.y0+2*u*f*s.cy+f*f*s.y1;
  ctx.globalAlpha=alpha;ctx.strokeStyle=s.col;ctx.lineWidth=s.w;
  ctx.beginPath();ctx.moveTo(s.x0,s.y0);ctx.quadraticCurveTo(qx,qy,ex,ey);ctx.stroke();
  // impasto ridge: thin lighter streak riding one side of the stroke
  const o=-s.w*0.22;ctx.globalAlpha=alpha*0.45;ctx.strokeStyle=s.hi;ctx.lineWidth=Math.max(1.5,s.w*0.3);
  ctx.beginPath();ctx.moveTo(s.x0+s.nx*o,s.y0+s.ny*o);ctx.quadraticCurveTo(qx+s.nx*o,qy+s.ny*o,ex+s.nx*o,ey+s.ny*o);ctx.stroke();
}

// ---- stationary layer: dusk sky streaks, hill underpainting, foreground band (painted once) ----
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function paintBackground(){
  const g=bg.getContext('2d');g.lineCap='round';
  const bands=C.sky.length;
  for(let i=0;i<bands;i++){g.fillStyle=C.sky[i];g.fillRect(0,Math.floor(i*480/bands),W,Math.ceil(480/bands)+2);}
  // horizontal comma streaks that undulate like evening air, after "Road with Cypress and Star" (1890) — re-authored
  for(let i=0;i<2600;i++){
    const x=R()*W,y=R()*490;const bi=clamp(Math.floor(y/480*bands+(R()-0.5)*1.4),0,bands-1);
    const a=Math.sin(x*0.006+y*0.02)*0.22+(R()-0.5)*0.18;
    drawStroke(g,mkStroke(x,y,a,30+R()*42,8+R()*6,C.sky[bi],(R()-0.5)*8),1,0.75);
  }
  // hill underpainting (dim, before village light)
  g.globalAlpha=1;g.fillStyle=C.under[0];g.beginPath();g.moveTo(0,hillY[0]);for(let x=0;x<=W;x+=4)g.lineTo(x,hillY[x]);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  for(let i=0;i<1500;i++){const x=R()*W,top=hillY[Math.floor(x)];const y=top+6+R()*(H-top-6);
    const slope=(hillY[Math.min(W,Math.floor(x)+8)]-hillY[Math.max(0,Math.floor(x)-8)])/16;
    drawStroke(g,mkStroke(x,y,Math.atan(slope)+(R()-0.5)*0.3,22+R()*26,7+R()*5,pick(C.under),(R()-0.5)*6),1,0.8);}
  // foreground band
  g.globalAlpha=0.92;g.fillStyle=C.band[0];g.beginPath();g.moveTo(0,bandY(0));for(let x=0;x<=W;x+=8)g.lineTo(x,bandY(x));g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  for(let i=0;i<520;i++){const x=R()*W,y=bandY(x)+8+R()*(H-bandY(x));
    drawStroke(g,mkStroke(x,y,-0.18+(R()-0.5)*0.3,26+R()*30,8+R()*6,pick(C.band),(R()-0.5)*6),1,0.85);}
  g.globalAlpha=1;
})();

// ---- village geometry ----
const houses=[{x:470,y:562},{x:690,y:532},{x:930,y:556},{x:1130,y:586}];
const roadDefs=[{a:0,b:1,c:[580,606]},{a:1,b:2,c:[812,596]},{a:1,b:2,c:[806,480]},{a:2,b:3,c:[1040,614]}];
const roads=roadDefs.map(r=>{const p0=[houses[r.a].x,houses[r.a].y-2],p1=[houses[r.b].x,houses[r.b].y-2];const pts=quadPts(p0,r.c,p1,48);
  const dabs=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];const a=Math.atan2(y1-y0,x1-x0);const nx=-Math.sin(a),ny=Math.cos(a);
    for(const side of [-5,5]) dabs.push({f:i/(pts.length-1),s:mkStroke((x0+x1)/2+nx*side,(y0+y1)/2+ny*side,a+(R()-0.5)*0.15,Math.hypot(x1-x0,y1-y0)+6,5+R()*2,pick(C.road),(R()-0.5)*2)});
    if(i%2===0)dabs.push({f:i/(pts.length-1),s:mkStroke((x0+x1)/2,(y0+y1)/2,a,10,3.5,C.roadHi,0)});}
  return dabs;});

// localized repainting of the hill, radiating from each lit house
const lightTime=[0.95,1.5,1.95,2.3];const waveStart=[1.0,1.5,1.95,2.3];const waveDur=[1.1,1.0,0.65,0.35];
const repaint=[];const waveR=[0,0,0,0];
for(let i=0;i<2300;i++){const x=R()*W,top=hillY[Math.floor(x)];const yb=bandY(x)+14;if(yb<=top+4)continue;const y=top+3+R()*(yb-top-3);
  let best=0,bt=1e9,bd=0;for(let h=0;h<4;h++){const d=Math.hypot(x-houses[h].x,(y-houses[h].y)*1.6);const t=lightTime[h]+d/520;if(t<bt){bt=t;best=h;bd=d;}}
  const slope=(hillY[Math.min(W,Math.floor(x)+8)]-hillY[Math.max(0,Math.floor(x)-8)])/16;
  const col=bd<95?pick(C.warmLit):pick(C.lit);
  repaint.push({h:best,d:bd,s:mkStroke(x,y,Math.atan(slope)+(R()-0.5)*0.45,20+R()*24,7+R()*5,col,(R()-0.5)*7)});
  waveR[best]=Math.max(waveR[best],bd+50);}

// cypress: vertical flame strokes, bottom to top
const cyp=[];for(let i=0;i<300;i++){const s=Math.pow(R(),0.85);const y=604-s*362;const hw=50*Math.pow(1-s,0.55)*Math.min(1,s*5+0.45);
  const side=R()*2-1;const x=172+side*hw*0.85+Math.sin(s*9)*5;
  cyp.push({o:clamp(s+(R()-0.5)*0.08,0,1),s:mkStroke(x,y,-Math.PI/2+side*0.35+(R()-0.5)*0.25,24+R()*24,7+R()*5,pick(C.cypress),side*6+(R()-0.5)*4)});}
cyp.sort((a,b)=>a.o-b.o);

// sun: tangential dabs from core outward; halos: dashed ring dabs swept by angle
const sun={x:1040,y:150};const sunD=[];
for(let i=0;i<170;i++){const r=Math.sqrt(R())*60,th=R()*Math.PI*2;const ci=r<20?0:r<36?1:r<50?2:3;
  sunD.push({o:r/62,s:mkStroke(sun.x+Math.cos(th)*r,sun.y+Math.sin(th)*r,th+Math.PI/2,12+R()*12,7+R()*4,C.sun[Math.min(3,ci+(R()<0.25?1:0))],r*0.15)});}
const halo=[];[[88,22,C.gold,6],[116,28,'#C99A4E',5.5]].forEach(([r,n,col,w],ri)=>{for(let k=0;k<n;k++){const th=-Math.PI/2+k/n*Math.PI*2+ri*0.07;
  halo.push({o:k/n,ring:ri,s:mkStroke(sun.x+Math.cos(th)*r,sun.y+Math.sin(th)*r,th+Math.PI/2,r*2*Math.PI/n*0.58,w,col,r*0.04)});}});

// houses: brush dabs clipped to the house silhouette
const HS=1.15;const housePath=new Path2D('M-22 0V-26L0-44L22-26V0Z');
const houseDabs=houses.map(()=>{const d=[];for(let i=0;i<16;i++){const yy=-2-R()*44;d.push({o:-yy/46,s:mkStroke((R()-0.5)*40,yy,(R()-0.5)*0.6,18+R()*10,8+R()*3,pick(C.house),(R()-0.5)*4)});}return d.sort((a,b)=>a.o-b.o);});
const sparkRays=Array.from({length:10},(_,k)=>({a:k/10*Math.PI*2+R()*0.3,l:0.7+R()*0.6}));

// ---- GSAP-owned state (accessors mark the canvas dirty; redraw happens synchronously after seek) ----
const ctx=document.getElementById('paint').getContext('2d');
const raw={cyp:0,sun:0,halo:0,h0:0,h1:0,h2:0,h3:0,r0:0,r1:0,r2:0,r3:0,l0:0,l1:0,l2:0,l3:0,w0:0,w1:0,w2:0,w3:0};
const S={};let queued=false;
Object.keys(raw).forEach(k=>Object.defineProperty(S,k,{enumerable:true,get(){return raw[k];},set(v){raw[k]=v;if(!queued){queued=true;queueMicrotask(render);}}}));

function render(){
  queued=false;
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(bg,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';
  // 1. localized repaint of the land
  for(const r of repaint){const wv=raw['w'+r.h];if(wv<=0)continue;const f=(wv*waveR[r.h]-r.d)/50;if(f>0)drawStroke(ctx,r.s,f,0.9);}
  // 2. roads painted one at a time
  for(let i=0;i<4;i++){const p=raw['r'+i];if(p<=0)continue;for(const d of roads[i]){const f=(p-d.f)*48;if(f>0)drawStroke(ctx,d.s,f,0.95);}}
  // 3. warm light pools behind houses
  for(let i=0;i<4;i++){const l=raw['l'+i];if(l<=0)continue;const h=houses[i];
    const g=ctx.createRadialGradient(h.x,h.y-24,2,h.x,h.y-24,70);g.addColorStop(0,'rgba(246,206,120,'+(0.42*l)+')');g.addColorStop(1,'rgba(246,206,120,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(h.x-72,h.y-96,144,144);}
  // 4. houses
  for(let i=0;i<4;i++){const p=raw['h'+i];if(p<=0)continue;const h=houses[i];
    ctx.save();ctx.translate(h.x,h.y+(1-p)*10);ctx.scale(HS,HS);
    ctx.save();ctx.clip(housePath);ctx.globalAlpha=1;
    for(const d of houseDabs[i]){const f=(p*1.25-d.o*0.7)/0.35;if(f>0)drawStroke(ctx,d.s,f,1);}
    ctx.restore();
    const oa=clamp((p-0.55)/0.45,0,1);if(oa>0){ctx.globalAlpha=oa;ctx.strokeStyle=C.ink;ctx.lineWidth=4;ctx.stroke(housePath);}
    if(oa>0){const l=raw['l'+i];ctx.globalAlpha=oa;ctx.fillStyle=chroma.mix(C.dark,C.gold,l,'rgb').hex();ctx.fillRect(-7,-22,14,14);
      if(l>0){ctx.globalAlpha=l;ctx.fillStyle=C.glowCore;ctx.fillRect(-4,-19,8,8);}}
    ctx.restore();
    // spark flare: rays burst then fold back into the steady window glow
    const l=raw['l'+i];if(l>0&&l<1){const k=Math.sin(Math.PI*l);ctx.globalAlpha=k;ctx.strokeStyle=C.glowCore;ctx.lineWidth=3.5;
      const cx=h.x,cy=h.y-17*HS;for(const r of sparkRays){const r0=12,r1=12+30*k*r.l;ctx.beginPath();ctx.moveTo(cx+Math.cos(r.a)*r0,cy+Math.sin(r.a)*r0);ctx.lineTo(cx+Math.cos(r.a)*r1,cy+Math.sin(r.a)*r1);ctx.stroke();}}
  }
  // 5. cypress flame strokes
  if(raw.cyp>0)for(const c of cyp){const f=(raw.cyp*1.2-c.o)/0.2;if(f>0)drawStroke(ctx,c.s,f,0.95);}
  // 6. sun repainted from the core outward, then halo rings swept around it
  if(raw.sun>0)for(const d of sunD){const f=(raw.sun*1.25-d.o)/0.25;if(f>0)drawStroke(ctx,d.s,f,0.95);}
  if(raw.halo>0)for(const d of halo){const f=(raw.halo*1.2-d.o-d.ring*0.12)/0.08;if(f>0)drawStroke(ctx,d.s,f,d.ring?0.7:0.9);}
  ctx.globalAlpha=1;
}

// ---- seekable paused timeline: the single owner of every animated value ----
const tl=gsap.timeline({paused:true,onUpdate:render});
tl.to(S,{cyp:1,duration:0.8,ease:'power2.inOut'},0)
  .to(S,{sun:1,duration:0.6,ease:'power2.out'},0.1)
  .to(S,{halo:1,duration:0.7,ease:'sine.inOut'},0.35);
for(let i=0;i<4;i++)tl.to(S,{['h'+i]:1,duration:0.45,ease:'power2.out'},0.45+0.12*i);
tl.to(S,{l0:1,duration:0.3,ease:'sine.inOut'},lightTime[0]);
tl.to(S,{r0:1,duration:0.4,ease:'power2.inOut'},1.12);
tl.to(S,{l1:1,duration:0.25,ease:'sine.inOut'},lightTime[1]);
tl.to(S,{r1:1,duration:0.4,ease:'power2.inOut'},1.55);
tl.to(S,{r2:1,duration:0.42,ease:'power2.inOut'},1.58);
tl.to(S,{l2:1,duration:0.25,ease:'sine.inOut'},lightTime[2]);
tl.to(S,{r3:1,duration:0.33,ease:'power2.inOut'},1.98);
tl.to(S,{l3:1,duration:0.25,ease:'sine.inOut'},lightTime[3]);
for(let i=0;i<4;i++)tl.to(S,{['w'+i]:1,duration:waveDur[i],ease:'power2.out'},waveStart[i]);
tl.to({},{duration:0.001},2.999);
window.__timelines=window.__timelines||{};window.__timelines.video=tl;
const redraw=()=>render();
window.addEventListener('hf-seek',redraw);document.addEventListener('hf-seek',redraw);
tl.seek(0);render();
})();
