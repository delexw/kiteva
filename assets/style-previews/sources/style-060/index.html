<html>
<head>
<meta charset="utf-8">
<title>IDEA → SYSTEM — Cel-Shaded 3D preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #C9E0DA; }
  [data-composition-id="video"] { position: relative; width: 100%; height: 100%; background: #C9E0DA; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .copy { position: absolute; left: 80px; margin: 0; color: #26394A; font-family: "Trebuchet MS", Verdana, sans-serif; font-weight: 700; white-space: nowrap; }
  .title { top: 62px; font-size: 58px; line-height: 70px; letter-spacing: 0.5px; }
  .caption { top: 140px; font-size: 22px; line-height: 30px; }
</style>
</head>
<body>
<div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <h1 class="copy title">IDEA → SYSTEM</h1>
  <p class="copy caption">one spark, many links — drawn in light and line</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.bundle.js"></script>
<script>
// Motion owner: one paused GSAP timeline tweens the Three.js scene state (hero transform,
// rarity uniform, camera, reveal progress). Every frame is drawn from timeline time.
(function () {
  var scene = window.__celScene;
  if (!scene) throw Error('Cel-shaded scene renderer failed to load');

  var tl = gsap.timeline({ paused: true, onUpdate: function () { scene.draw(tl.time()); } });

  tl.fromTo(state, { bob: 0 }, { bob: 1, duration: 0.6, ease: 'none' }, 0);
  // Rarity step 0.6-1.2s: discrete tiers at 0.8 / 1.0 / 1.2s
  tl.to(state, { rarity: 3, duration: 0.6, ease: 'steps(3)' }, 0.6);
  tl.to(state, { heroS: 1.1, duration: 0.08, ease: 'power2.inOut' }, 1.0);
  tl.to(state, { heroS: 1, duration: 0.2, ease: 'back.out(1.2)' }, 1.08);
  // Charge squash 1.2-1.8s with camera dolly-in
  tl.to(state, { sx: 1.16, sy: 0.8, duration: 0.45, ease: 'power2.inOut' }, 1.25);
  tl.to(state, { tremble: 1, duration: 0.3, ease: 'power2.inOut' }, 1.4);
  tl.to(state, { tremble: 0, duration: 0.1, ease: 'power2.inOut' }, 1.75);
  tl.to(state, { cz: 8.6, duration: 0.6, ease: 'power2.inOut' }, 1.2);
  // Burst 1.8-2.1s: stretch release, seeded particles, ground shadow removed
  tl.to(state, { sx: 0.9, sy: 1.14, duration: 0.12, ease: 'power2.inOut' }, 1.8);
  tl.to(state, { sx: 1, sy: 1, duration: 0.35, ease: 'back.out(1.2)' }, 1.92);
  tl.to(state, { shadow: 0, duration: 0.15, ease: 'power2.inOut' }, 1.8);
  tl.to(state, { burst: 1, duration: 0.7, ease: 'power2.out' }, 1.8);
  // Isolated reveal: camera pull-back, glow card behind the hero, nodes and links connect
  tl.to(state, { cx: 0.45, cy: 0.35, cz: 16, tx: 0.25, ty: -0.05, duration: 0.55, ease: 'power2.inOut' }, 1.8);
  tl.to(state, { card: 1, duration: 0.35, ease: 'back.out(1.2)' }, 1.95);
  scene.nodeDelays.forEach(function (delay, i) { var v = {}; v['n' + i] = 1; v.duration = 0.42; v.ease = 'back.out(1.2)'; tl.to(state, v, 1.84 + delay); });
  tl.to(state, { links: 1, duration: 0.35, ease: 'power2.inOut' }, 2.15);
  // Settled by ~2.5s; hold to 3s
  tl.to(state, { hold: 1, duration: 0.4, ease: 'none' }, 2.6);

  window.__timelines = window.__timelines || {};
  window.__timelines["video"] = tl;
  window.addEventListener('hf-seek', function (e) {
    var time = e && e.detail ? Number(e.detail.time) : NaN;
    if (isFinite(time)) tl.time(time, true);
    scene.draw(tl.time());
  });
  scene.draw(0);
})();
</script>
