  tl.fromTo(st, { hemi: 0.9, fill: 0.35, glass: 0.3 }, { hemi: 0, fill: 0, glass: 0, duration: 0.3, ease: 'power2.inOut' }, 0.7);
  // 3. Light up (1.0 – 2.4 s): spotlight intensity + angle sweep, pattern travels over the floor
  tl.fromTo(st, { spot: 0 }, { spot: 6.5, duration: 0.8, ease: 'power2.inOut' }, 1.0);
  tl.fromTo(st, { glass: 0 }, { glass: 1, duration: 0.6, ease: 'sine.inOut' }, 1.05);
  tl.fromTo(st, { fit: 1.6 }, { fit: 1.04, duration: 1.3, ease: 'power2.inOut' }, 1.0);
  tl.fromTo(st, { tx: -2.6, tz: 3.6 }, { tx: 1.6, tz: 5.6, duration: 1.4, ease: 'sine.inOut' }, 1.0);
  tl.fromTo(st, { beam: 0 }, { beam: 0.05, duration: 0.8, ease: 'sine.inOut' }, 1.2);
  tl.fromTo(st, { hemi: 0 }, { hemi: 0.18, duration: 0.8, ease: 'sine.inOut' }, 1.4);
  // 4. White bloom finale is reserved for the full video; bloom stays 0 in this preview.
  tl.set(st, { bloom: 0 }, 3);

  // Copy (standalone headings; independent timing)
  tl.fromTo('#k1', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.inOut' }, 0.1);
  tl.fromTo('#h1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.inOut' }, 0.2);
  tl.fromTo('#h2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.inOut' }, 0.4);
  tl.fromTo('#k2', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.inOut' }, 1.7);

  tl.progress(1).progress(0); // fully build & record start values
  draw();

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  function resync(e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : null;
    if (t !== null) tl.seek(t, false);
    draw();
  }
  window.addEventListener('hf-seek', resync);
  document.addEventListener('hf-seek', resync);
})();
</script>
