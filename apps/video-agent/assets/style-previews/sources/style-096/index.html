<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0F1317}
#root{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(ellipse 46% 52% at 50% 54%,#27313A 0%,#1A2027 46%,#0F1317 100%)}
#stage3d,#overlay{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#overlay text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage3d" width="1280" height="720"></canvas>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <text id="eyebrow" x="80" y="96" font-size="13" letter-spacing="5" fill="#7FE0C8">HUB</text>
    <path id="leader" d="M640 392V250H700" fill="none" stroke="#C9D3D6" stroke-width="1" stroke-opacity="0.7"/>
    <text id="status-label" data-reveal-after="leader" x="708" y="254" font-size="13" letter-spacing="3" fill="#D3DCDE">STATUS LIGHT · LINKED</text>
    <text id="headline" x="640" y="590" font-size="36" font-weight="300" text-anchor="middle" letter-spacing="1" fill="#EEF2F2">An idea, connected.</text>
    <text id="subcopy" x="640" y="626" font-size="13" text-anchor="middle" letter-spacing="4" fill="#A9B5B9">ONE HUB · THREE THREADS · NOTHING EXTRA</text>
  </svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.js"></script>
<script id="video-timeline">
(function () {
  // GSAP is the single time owner: one linear proxy tween drives the Three.js
  // renderer (pure function of t); the SVG overlay tweens own opacity/y/dash.
  var scene = window.__styleScene;
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  tl.to(clock, { t: 3, duration: 3, ease: 'none', onUpdate: function () { scene.renderAt(clock.t); } }, 0);

  var leader = document.getElementById('leader');
  var len = leader.getTotalLength();
  gsap.set(leader, { strokeDasharray: len, strokeDashoffset: len });
  gsap.set(['#eyebrow', '#status-label', '#headline', '#subcopy'], { opacity: 0 });
  gsap.set('#headline', { y: 14 });
  gsap.set('#subcopy', { y: 8 });
  tl.to('#eyebrow', { opacity: 1, duration: 0.45, ease: 'sine.inOut' }, 0.3);
  tl.to('#headline', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.7);
  tl.to('#subcopy', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 1.95);
  tl.to(leader, { strokeDashoffset: 0, duration: 0.32, ease: 'power2.inOut' }, 1.98);
  tl.to('#status-label', { opacity: 1, duration: 0.25, ease: 'sine.inOut' }, 2.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["video"] = tl;

  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    if (Math.abs(tl.time() - t) > 1e-6) tl.seek(t, false);
    scene.renderAt(t);
  });
})();
</script>
