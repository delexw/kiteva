<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>style-110 · 3D Motion Graphics — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #303C40; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #303C40;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  /* Stationary key-light lift behind the assembly only; fades to the flat slate stage well before the copy column. */
  #stage-lift { position: absolute; left: 0; top: 0; width: 820px; height: 720px; pointer-events: none;
    background: radial-gradient(ellipse 430px 330px at 400px 380px, rgba(116,142,138,0.20), rgba(116,142,138,0) 100%); }
  #gl { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  .copy { position: absolute; left: 866px; margin: 0; white-space: nowrap; }
  #kicker { top: 234px; left: 870px; font-size: 19px; line-height: 22px; font-weight: 700; letter-spacing: 4px; color: #B9866C; }
  .hl { font-size: 58px; line-height: 58px; height: 58px; font-weight: 800; letter-spacing: -2px; color: #EDE9E1; }
  #hl1 { top: 274px; } #hl2 { top: 338px; } #hl3 { top: 402px; }
  #hl4 { top: 466px; color: #748E8A; }
  .body { left: 870px; font-size: 17px; line-height: 22px; font-weight: 400; color: #EDE9E1; }
  #body1 { top: 545px; } #body2 { top: 569px; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <div id="stage-lift"></div>
  <canvas id="gl" width="1280" height="720" aria-label="Copper core with four satin nodes assembling on a slate plinth"></canvas>
  <p class="copy" id="kicker">FIG. 03 — ASSEMBLY</p>
  <p class="copy hl" id="hl1">An idea</p>
  <p class="copy hl" id="hl2">becomes a</p>
  <p class="copy hl" id="hl3">connected</p>
  <p class="copy hl" id="hl4">system.</p>
  <p class="copy body" id="body1">One copper core, four satin nodes,</p>
  <p class="copy body" id="body2">a single key light from upper left.</p>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.bundle.js"></script>
<script>
(function () {
  // 3D state (camera, core, rods, XPBD-baked nodes) is owned by scene.render(time).
  // DOM copy opacity/translate is owned by GSAP tweens. One paused timeline drives both.
  var scene = window.Style110Scene.createScene(document.getElementById('gl'));
  var timeline = gsap.timeline({ paused: true });
  var draw = function () { scene.render(timeline.time()); };

  // Scene driver: a linear 0→3s proxy whose every update redraws from timeline time.
  var proxy = { t: 0 };
  timeline.to(proxy, { t: 3, duration: 3, ease: 'none', onUpdate: draw }, 0);

  // Copy reveals (complete and readable by 2.55s).
  timeline.fromTo('#kicker', { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.95);
  ['#hl1', '#hl2', '#hl3', '#hl4'].forEach(function (sel, i) {
    timeline.fromTo(sel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.15 + i * 0.16);
  });
  timeline.fromTo(['#body1', '#body2'], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.08 }, 2.05);
  timeline.to({}, { duration: 0.001 }, 2.999);

  timeline.eventCallback('onUpdate', draw);
  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : timeline.time();
    if (t !== timeline.time()) timeline.seek(t, false);
    scene.render(t);
  });
  timeline.seek(0, false);
  draw();

  window.__timelines = window.__timelines || {};
  window.__timelines.video = timeline;
})();
</script>
