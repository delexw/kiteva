<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Isometric Motion Graphics — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0E181E; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0E181E;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #F3EFE6; }
  #stage { position: absolute; inset: 0; }
  .iso-canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  .copy { position: absolute; left: 72px; top: 0; width: 380px; }
  .kicker { position: absolute; left: 72px; top: 186px; font-size: 14px; font-weight: 700; letter-spacing: 4px; line-height: 18px; white-space: nowrap; color: #F3EFE6; }
  .line { position: absolute; left: 70px; font-size: 56px; font-weight: 700; letter-spacing: -1px; line-height: 62px; white-space: nowrap; color: #F3EFE6; }
  .l1 { top: 226px; } .l2 { top: 288px; } .l3 { top: 350px; } .l4 { top: 412px; color: #63968D; }
  .rule { position: absolute; left: 72px; top: 500px; width: 60px; height: 6px; background: #C58662; transform-origin: 0 50%; }
  .body { position: absolute; left: 72px; top: 528px; font-size: 18px; font-weight: 500; line-height: 24px; white-space: nowrap; color: #F3EFE6; }
  .tag { position: absolute; left: 0; top: 0; padding: 5px 10px 4px; border-radius: 6px; font-size: 13px; font-weight: 700;
    letter-spacing: 3px; line-height: 16px; white-space: nowrap; background: #2C424F; color: #F3EFE6; }
  .tag.idea { background: #C58662; color: #0E181E; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <div id="stage"></div>
  <div class="kicker" id="kicker">ISOMETRIC STUDY · 30°</div>
  <div class="line l1" id="l1">An idea</div>
  <div class="line l2" id="l2">becomes a</div>
  <div class="line l3" id="l3">connected</div>
  <div class="line l4" id="l4">system.</div>
  <div class="rule" id="rule"></div>
  <div class="body" id="body">One core block, four links, shared axes.</div>
  <div class="tag idea" id="tag-idea">IDEA</div>
  <div class="tag" id="tag-people">PEOPLE</div>
  <div class="tag" id="tag-tools">TOOLS</div>
  <div class="tag" id="tag-data">DATA</div>
  <div class="tag" id="tag-flow">FLOW</div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="iso-scene.js"></script>
<script>
(function () {
  var iso = window.IsoScene.createScene(document.getElementById('stage'));
  var P = window.IsoScene.PALETTE;

  // Resolved scene palette contrast record (chroma-js); text sits on the stationary night field or its own tag.
  window.__paletteAudit = {
    creamOnCanvas: chroma.contrast(P.cream, P.canvas),
    tealOnCanvas: chroma.contrast(P.teal, P.canvas),
    creamOnSlateTag: chroma.contrast(P.cream, P.slate),
    canvasOnTerracottaTag: chroma.contrast(P.canvas, P.terracotta)
  };

  // GSAP is the single owner of every animated value below; the WebGL scene only reads them.
  function slots(n) { var a = []; for (var i = 0; i < n; i++) a.push({ v: 0 }); return a; }
  var S = { base: { v: 0 }, core: { v: 0 }, tiles: slots(iso.tileCount), links: slots(4), dots: slots(4),
            sats: slots(4), flow: slots(4), glow: slots(4) };
  function vals(a) { return a.map(function (o) { return o.v; }); }
  function draw() {
    iso.render({ base: S.base.v, core: S.core.v, tiles: vals(S.tiles), links: vals(S.links), dots: vals(S.dots),
                 sats: vals(S.sats), flow: vals(S.flow), glow: vals(S.glow) });
  }

  // Place 2D label tags at projected scene anchors (labels stay screen-space, never skewed).
  function placeTag(id, a, below, lift) {
    var el = document.getElementById(id);
    gsap.set(el, { x: Math.round(a.x), y: Math.round(a.y + (below ? lift : -lift)), xPercent: -50, yPercent: below ? 0 : -100 });
    return el;
  }
  var tags = {
    idea: placeTag('tag-idea', iso.anchors.idea, false, 44),
    people: placeTag('tag-people', iso.anchors.people, false, 40),
    tools: placeTag('tag-tools', iso.anchors.tools, false, 40),
    data: placeTag('tag-data', iso.anchors.data, true, 44),
    flow: placeTag('tag-flow', iso.anchors.flow, true, 44)
  };

  var tl = gsap.timeline({ paused: true, onUpdate: draw });

  // Beat 1 (0–0.95s): strata base rises, then 16 slab tiles drop in along the vertical axis, back-to-front.
  tl.fromTo(S.base, { v: 0 }, { v: 1, duration: 0.45, ease: 'power2.out' }, 0);
  S.tiles.forEach(function (o, k) {
    tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.42, ease: 'power2.out' }, 0.05 + iso.tileOrder[k] * 0.08);
  });
  // Copy reveals in its fixed 2D reading layer.
  tl.fromTo('#kicker', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.15);
  ['#l1', '#l2', '#l3', '#l4'].forEach(function (sel, i) {
    tl.fromTo(sel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.25 + i * 0.12);
  });
  tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power2.inOut' }, 0.85);
  tl.fromTo('#body', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 1.0);

  // Beat 2 (0.75–1.2s): the core idea block drops straight down onto the slab; its contact shadow tightens.
  tl.fromTo(S.core, { v: 0 }, { v: 1, duration: 0.45, ease: 'power2.in' }, 0.75);
  tl.fromTo(tags.idea, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.15);

  // Beat 3 (1.15–1.85s): four links extrude outward along the iso ground axes; junction dots appear.
  S.links.forEach(function (o, k) {
    tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.45, ease: 'power2.inOut' }, 1.15 + k * 0.06);
    tl.fromTo(S.dots[k], { v: 0 }, { v: 1, duration: 0.25, ease: 'back.out(1.7)' }, 1.45 + k * 0.06);
  });

  // Beat 4 (1.35–2.15s): satellite blocks rise out of the slab along +Y; labels follow each landing.
  var order = ['people', 'tools', 'data', 'flow'];
  S.sats.forEach(function (o, k) {
    var t0 = 1.35 + k * 0.1;
    tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.45, ease: 'back.out(1.2)' }, t0);
    tl.fromTo(tags[order[k]], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, t0 + 0.3);
  });

  // Beat 5 (1.7–2.65s): teal flow pulses travel core → satellite; each satellite cap lights on arrival.
  S.flow.forEach(function (o, k) {
    var t0 = 1.7 + k * 0.1;
    tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.5, ease: 'power1.inOut' }, t0);
    tl.fromTo(S.glow[k], { v: 0 }, { v: 1, duration: 0.2, ease: 'power2.out' }, t0 + 0.45);
  });

  // Hold the complete, settled scene to 3s.
  tl.to({}, { duration: 0.001 }, 2.999);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener('hf-seek', draw);
  tl.progress(1).progress(0);
  draw();
})();
</script>
