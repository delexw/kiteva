<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>style-058 Voxel Art — An idea becomes a system</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #30444C; }
  #root { position: relative; width: 100%; height: 100%; background: #30444C; overflow: hidden; }
  #voxels { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  #copy { position: absolute; left: 740px; top: 0; width: 540px; height: 720px; background: #30444C;
          font-family: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace; color: #EEE9DB; }
  #copy .kicker { position: absolute; left: 20px; top: 230px; font-size: 18px; line-height: 24px;
                  letter-spacing: 6px; color: #EEE9DB; white-space: nowrap; }
  #copy .line { position: absolute; left: 20px; font-size: 56px; line-height: 64px; font-weight: 700;
                color: #EEE9DB; white-space: nowrap; }
  #copy .l1 { top: 268px; }
  #copy .l2 { top: 332px; }
  #copy .l3 { top: 396px; }
  #copy .rule { position: absolute; left: 20px; top: 462px; width: 200px; height: 6px; background: #63928D; }
  #copy .sw { position: absolute; top: 488px; width: 40px; height: 40px; box-sizing: border-box; }
  #copy .s1 { left: 20px; background: #C0845D; }
  #copy .s2 { left: 68px; background: #63928D; }
  #copy .s3 { left: 116px; background: #30444C; border: 3px solid #EEE9DB; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="voxels" width="1280" height="720"></canvas>
  <div id="copy">
    <div class="kicker" id="kicker">01 BLOCK / ∞ BLOCKS</div>
    <div class="line l1" id="line1">AN IDEA</div>
    <div class="line l2" id="line2">BECOMES A</div>
    <div class="line l3" id="line3">SYSTEM</div>
    <div class="rule" id="rule"></div>
    <div class="sw s1" id="sw1"></div>
    <div class="sw s2" id="sw2"></div>
    <div class="sw s3" id="sw3"></div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="voxel-scene.bundle.js"></script>
<script>
(function () {
  // Palette check (chroma.js): every text pair sits on the opaque stage panel.
  var stage = '#30444C', cream = '#EEE9DB';
  if (chroma.contrast(cream, stage) < 4.5) throw Error('Copy contrast below 4.5:1');

  var voxels = window.VoxelScene.createVoxelScene(document.getElementById('voxels'), {
    width: 1280, height: 720, sceneRect: [60, 80, 700, 650]
  });

  // Scene clock proxy: the GSAP timeline is the single owner of scene time.
  // The setter redraws the voxel instances for whatever time GSAP renders,
  // so direct, backward and out-of-order seeks all produce the same frame.
  var sceneClock = { _t: 0 };
  Object.defineProperty(sceneClock, 't', {
    get: function () { return this._t; },
    set: function (v) { this._t = v; voxels.draw(v); }
  });
  voxels.draw(0);

  var tl = gsap.timeline({ paused: true });
  tl.fromTo(sceneClock, { t: 0 }, { t: 3, duration: 3, ease: 'none' }, 0);

  // Copy beats follow the build: idea -> assembly -> connected system.
  tl.fromTo('#kicker', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 0.15);
  tl.fromTo('#line1', { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.3);
  tl.fromTo('#line2', { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.95);
  tl.fromTo('#line3', { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 1.65);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 1.75);
  tl.fromTo(['#sw1', '#sw2', '#sw3'], { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.32, ease: 'back.out(1.2)', stagger: 0.1 }, 1.95);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    voxels.draw(t);
  });
})();
</script>

</html>
