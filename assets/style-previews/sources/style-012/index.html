<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><pattern id="s" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="7" height="14" fill="#000000"></rect></pattern><pattern id="c" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#000000"></rect><rect x="20" y="20" width="20" height="20" fill="#000000"></rect></pattern><g id="r" fill="none" stroke="#000000" stroke-width="12"><circle r="12"></circle><circle r="44"></circle><circle r="76"></circle><circle r="108"></circle><circle r="140"></circle><circle r="172"></circle><circle r="204"></circle><circle r="236"></circle></g><clipPath id="L"><rect x="640" y="100" width="280" height="520"></rect></clipPath><clipPath id="R"><rect x="920" y="100" width="300" height="520"></rect></clipPath></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-demo-actor="demo-actor-1"></rect><g clip-path="url(#L)" data-demo-actor="demo-actor-2"><use href="#r" x="920" y="360" data-demo-actor="demo-actor-3"></use></g><g clip-path="url(#R)" data-demo-actor="demo-actor-4"><use href="#r" x="944" y="360" data-demo-actor="demo-actor-5"></use></g><rect x="80" y="430" width="420" height="120" fill="url(#s)" data-demo-actor="demo-actor-6"></rect><rect x="80" y="560" width="160" height="80" fill="url(#c)" data-demo-actor="demo-actor-7"></rect><rect x="260" y="560" width="240" height="80" fill="url(#s)" transform="skewX(-14)" transform-origin="380 600" data-demo-actor="demo-actor-8"></rect><text x="80" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="84" fill="#000000" data-demo-actor="demo-actor-9">IDEA</text><text x="80" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="300" font-size="34" fill="#000000" data-demo-actor="demo-actor-10">radiates into</text><text x="80" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#000000" letter-spacing="3" data-demo-actor="demo-actor-11">A CONNECTED SYSTEM</text></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-012","selectedReferenceIds":[],"rationale":"The artwork is two clipped halves of the same set of rings, with the right half offset 24px. Moving only the right half's rings (actor-5, inside its fixed clip group) by -24px lines both halves up into one clean set of circles. When they return, the split illusion snaps back. It's a measured, continuous phase shift with no flicker. To echo the change, the vertical stripe block and the skewed stripe block slide 28px in opposite directions in sequence, which shifts their relationship to the checkerboard. The skewed block's own transform is kept inside its wrapper. The text and clip frames stay fixed. A vortex passage (motion-002) or chapter handoff (motion-012) isn't supported by this single scene, so no reference is used. Everything returns to its authored pose by about 2.1s.","tracks":[{"actorId":"demo-actor-5","role":"Right-half rings slide to line up with the left half, then return","action":"transform","start":0.2,"duration":0.8,"ease":"sine.inOut","pose":{"x":-24,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-6","role":"Vertical stripe field shifts phase to the right","action":"transform","start":0.6,"duration":0.7,"ease":"sine.inOut","pose":{"x":28,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-8","role":"Skewed stripe band counter-shifts against checkerboard","action":"transform","start":0.9,"duration":0.6,"ease":"sine.inOut","pose":{"x":-28,"y":0,"scale":1,"rotation":0,"opacity":1}}]};
const svg=document.querySelector('svg');
const foreground="#000000";
const background="#FFFFFF";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) {
  const selected=typeof plan!=='undefined' && plan.tracks.some(track=>track.actorId===prior.getAttribute('data-demo-actor'));
  if(selected){el.remove();return;}
  prior.remove();
 }
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
