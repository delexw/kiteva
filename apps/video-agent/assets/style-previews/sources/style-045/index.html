  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #415A64; }
  [data-composition-id="video"] { position: relative; width: 100%; height: 100%; overflow: hidden; }

<script src="gsap.min.js"></script>

<script>
(async () => {
  // Contrast guard using only palette tokens: every label sits on cream paper (#F6EDD9) in foreground ink (#3C4345).
  const paper = '#F6EDD9', ink = '#3C4345';
  if (chroma.contrast(ink, paper) < 4.5) throw new Error('Label ink/paper pairing below 4.5:1');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const timeline = await window.__collageBoot();
  window.__timelines = window.__timelines || {};
  window.__timelines.video = timeline;
})();
</script>
