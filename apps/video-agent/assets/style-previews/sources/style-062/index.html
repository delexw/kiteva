  #video { position: relative; width: 100%; height: 100%; background: #111C29; overflow: hidden; }

    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; }

<div id="video" data-style-id="style-062" data-style-renderer="Three.js; Points; UnrealBloomPass" data-motion-engine="GLSL; GSAP"

  <canvas id="gl" width="1280" height="720"></canvas>
  <h1 class="copy" id="title">an idea becomes a <b>connected system</b></h1>
  <p class="copy" id="kicker">PARTICLES · ONE STRUCTURE</p>
</div>
<script src="./gsap.min.js"></script>
<script src="./chroma.min.js"></script>
<!-- Style renderer: Three.js Points (ShaderMaterial on seeded BufferGeometry) + UnrealBloomPass.

<script src="./scene.bundle.js"></script>
<script id="timeline-video">
  // GSAP is the single owner of the uniforms (time, morph, trail, flash); GLSL derives every
  // particle position analytically from them, so forward, backward and direct seeks are exact.
  (function () {
    var scene = window.__scene062;
    var proxy = scene.proxy;
    var tl = gsap.timeline({ paused: true, onUpdate: scene.evaluate });
    // shared shader clock
    tl.fromTo(proxy, { time: 0 }, { time: 3, duration: 3, ease: "none", immediateRender: true }, 0);
    // 0–0.8 s drift as a turning sphere; 0.8–2.0 s flow into the bulb + network; 2.0–3.0 s hold
    tl.fromTo(proxy, { morph: 0 }, { morph: 1, duration: 1.2, ease: "power2.inOut", immediateRender: true }, 0.8);
    // ignition sparks (particle_spectacle recipe): trails open, then close before the hold
    tl.fromTo(proxy, { trail: 0 }, { trail: 1, duration: 0.25, ease: "sine.inOut", immediateRender: true }, 1.38);
    tl.to(proxy, { trail: 0, duration: 0.3, ease: "sine.inOut" }, 2.1);
    // finale: nodes flash as messenger sparks land, then settle by 2.6 s
    tl.fromTo(proxy, { flash: 0 }, { flash: 1, duration: 0.14, ease: "power2.inOut", immediateRender: true }, 1.95);
    tl.to(proxy, { flash: 0, duration: 0.5, ease: "sine.inOut" }, 2.09);
    tl.seek(0, false);
    window.__timelines = window.__timelines || {};
    window.__timelines.video = tl;
    window.addEventListener("hf-seek", function (e) {
      var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : null;
      if (t !== null) tl.seek(Math.min(3, Math.max(0, t)), false);
      scene.evaluate();
    });
  })();
</script>
