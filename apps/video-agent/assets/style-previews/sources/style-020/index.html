<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Luxury Editorial · An Idea, Connected.</title>
<style>
  /* Resolved scene palette (night editorial; source-frame refresh). Prior ivory swatch was an example only. */
  :root{
    --field:#0B1220;      /* deep ink-navy field (stationary) */
    --bone:#EDE8DF;       /* hero type and primary strokes */
    --steel:#93A1B6;      /* secondary type, ambient ring words */
    --amber:#C9974C;      /* accent: thin functional marks only */
    --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
    --text:Georgia,"Times New Roman",serif;
    --mono:"SF Mono",Menlo,Monaco,"Courier New",monospace;
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--field)}
  #root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--field)}
  /* Stationary lighting + grain: one soft cool light source behind the system, faint dot grid. */
  .bg-glow{position:absolute;inset:0;background:
      radial-gradient(circle at 940px 360px, rgba(122,148,188,.22) 0px, rgba(122,148,188,.08) 260px, rgba(11,18,32,0) 470px),
      radial-gradient(ellipse at 50% 50%, rgba(11,18,32,0) 55%, rgba(4,7,14,.55) 100%);}
  .bg-grid{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle, rgba(147,161,182,.22) 0.8px, transparent 1.2px);background-size:24px 24px;background-position:12px 12px}
  #diagram{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
  #copy{position:absolute;left:100px;top:0;width:500px;height:720px}
  .eyebrow{position:absolute;left:0;top:146px;font-family:var(--mono);font-size:12px;letter-spacing:6px;color:var(--amber);white-space:nowrap}
  .h1{position:absolute;left:-4px;font-family:var(--serif);font-size:88px;line-height:96px;color:var(--bone);white-space:pre;font-weight:400}
  #line1{top:236px}
  #line2wrap{position:absolute;left:-14px;top:330px;padding:0 24px 8px 10px;clip-path:inset(0 100% 0 0)}
  #line2{display:block;font-family:var(--serif);font-size:88px;line-height:96px;font-style:italic;color:var(--bone);white-space:pre}
  #caret{position:absolute;top:252px;left:-4px;width:2px;height:72px;background:var(--amber)}
  .rule{position:absolute;left:0;top:466px;width:64px;height:1px;background:var(--amber);transform-origin:0 50%}
  .body{position:absolute;left:0;top:492px;font-family:var(--text);font-size:18px;line-height:27px;color:var(--bone)}
  .est{position:absolute;left:0;top:628px;font-family:var(--mono);font-size:11px;letter-spacing:5px;color:var(--steel);white-space:nowrap}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <!-- SVG renderer: the connected system. Camera wrapper (#cam) owns only the slow push transform. -->
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
      <radialGradient id="discFill" cx="940" cy="360" r="228" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#22304A"/>
        <stop offset="0.7" stop-color="#18233A"/>
        <stop offset="1" stop-color="#141E33"/>
      </radialGradient>
      <linearGradient id="ringStroke" x1="712" y1="132" x2="1168" y2="588" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#93A1B6"/>
        <stop offset="0.5" stop-color="#EDE8DF"/>
        <stop offset="1" stop-color="#93A1B6"/>
      </linearGradient>
      <clipPath id="discClip"><circle id="discMask" cx="940" cy="360" r="0"/></clipPath>
      <path id="orbitArc" d="M 1072 131.4 A 264 264 0 0 1 1072 588.6" fill="none"/>
    </defs>
    <g id="cam">
      <!-- field of the idea: revealed from the hub through an expanding circular mask -->
      <circle cx="940" cy="360" r="228" fill="url(#discFill)" clip-path="url(#discClip)"/>
      <!-- outer hairline frame -->
      <circle id="outer" cx="940" cy="360" r="300" fill="none" stroke="#93A1B6" stroke-width="0.9" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 940 360)"/>
      <!-- ambient ring words (revealed only after the outer frame is complete) -->
      <g id="orbit" opacity="0">
        <text font-family="SF Mono, Menlo, Monaco, monospace" font-size="10" letter-spacing="5" fill="#93A1B6">
          <textPath href="#orbitArc" startOffset="4%">FORM · MATERIAL · LIGHT · VOICE · CRAFT</textPath>
        </text>
      </g>
      <!-- main ring -->
      <circle id="ring" cx="940" cy="360" r="228" fill="none" stroke="url(#ringStroke)" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 940 360)"/>
      <!-- spokes: drawn outward from the hub -->
      <g stroke="#C9D0DB" stroke-width="0.9" fill="none" stroke-linecap="round">
        <line class="spoke" x1="940" y1="360" x2="940" y2="132" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <line class="spoke" x1="940" y1="360" x2="778.8" y2="198.8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <line class="spoke" x1="940" y1="360" x2="712" y2="360" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <line class="spoke" x1="940" y1="360" x2="778.8" y2="521.2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <line class="spoke" x1="940" y1="360" x2="940" y2="588" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      </g>
      <g fill="#EDE8DF">
        <circle class="node" cx="940" cy="132" r="0"/>
        <circle class="node" cx="778.8" cy="198.8" r="0"/>
        <circle class="node" cx="712" cy="360" r="0"/>
        <circle class="node" cx="778.8" cy="521.2" r="0"/>
        <circle class="node" cx="940" cy="588" r="0"/>
      </g>
      <!-- the idea: amber hub (tiny accent area) -->
      <circle id="hub" cx="940" cy="360" r="0" fill="#C9974C"/>
    </g>
  </svg>

  <!-- HTML/CSS renderer: editorial copy. #copy wrapper owns only the counter-parallax transform. -->
  <div id="copy">
    <div class="eyebrow" id="eyebrow">MAISON · VOLUME XX</div>
    <div class="h1" id="line1"><span class="ch">A</span><span class="ch">n</span><span class="ch"> </span><span class="ch">I</span><span class="ch">d</span><span class="ch">e</span><span class="ch">a</span><span class="ch">,</span></div>
    <div id="caret"></div>
    <div id="line2wrap"><span id="line2">Connected.</span></div>
    <div class="rule" id="rule"></div>
    <div class="body" id="body">One thought, quietly drawn<br>into an enduring system.</div>
    <div class="est" id="est">EST. MMXXVI</div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(function(){
  // Palette validation against the stationary field (text sits on the plain field, left of the glow).
  var field='#0B1220', pairs={bone:'#EDE8DF',steel:'#93A1B6',amber:'#C9974C'};
  window.__paletteContrast={};
  Object.keys(pairs).forEach(function(k){window.__paletteContrast[k]=chroma.valid(pairs[k])?+chroma.contrast(pairs[k],field).toFixed(2):null;});
  window.__paletteContrast.orbitOnDisc=+chroma.contrast('#93A1B6','#18233A').toFixed(2);

  var tl=gsap.timeline({paused:true});
  var q=function(s){return document.querySelector(s);};
  var qa=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};

  // ---- Camera: limited parallax, slow push that settles by 2.6s (one owner per wrapper) ----
  tl.fromTo('#cam',{scale:0.955,x:14,transformOrigin:'940px 360px'},{scale:1,x:0,duration:2.6,ease:'sine.inOut'},0);
  tl.fromTo('#copy',{x:-8},{x:0,duration:2.6,ease:'sine.inOut'},0);

  // ---- Eyebrow first (lockup order: eyebrow → headline → rule → body) ----
  tl.fromTo('#eyebrow',{opacity:0,y:6},{opacity:1,y:0,duration:0.4,ease:'power2.inOut'},0.02);

  // ---- The idea: hub ignites ----
  tl.fromTo('#hub',{attr:{r:0}},{attr:{r:9},duration:0.35,ease:'back.out(1.2)'},0.1);

  // ---- Typed roman headline with amber caret (seekable discrete sets) ----
  var chars=qa('#line1 .ch'), caret=q('#caret'), line1=q('#line1');
  var t0=0.16, step=0.075;
  tl.set(chars,{opacity:0},0);
  tl.fromTo(caret,{opacity:0,x:0},{opacity:1,x:0,duration:0.01},0.1);
  chars.forEach(function(c,i){
    var right=c.offsetLeft+c.offsetWidth; // measured spacing from loaded system font
    tl.set(c,{opacity:1},t0+i*step);
    tl.set(caret,{x:right+2},t0+i*step);
  });
  var typedEnd=t0+(chars.length-1)*step;
  tl.set(caret,{opacity:0},typedEnd+0.12); // caret leaves when the line completes

  // ---- Field of the system expands from the hub through a circular mask ----
  tl.fromTo('#discMask',{attr:{r:0}},{attr:{r:228},duration:0.85,ease:'power2.inOut'},0.24);

  // ---- Spokes draw outward; each node appears only when its spoke reaches it ----
  qa('.spoke').forEach(function(s,i){
    var st=0.36+i*0.07;
    tl.fromTo(s,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:0.45,ease:'power2.inOut'},st);
  });
  qa('.node').forEach(function(n,i){
    var st=0.36+i*0.07+0.45;
    tl.fromTo(n,{attr:{r:0}},{attr:{r:4},duration:0.28,ease:'back.out(1.2)'},st);
  });

  // ---- Italic line wiped in through a clip mask, with a small settle ----
  tl.fromTo('#line2wrap',{clipPath:'inset(0% 100% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:0.6,ease:'power2.inOut'},0.86);
  tl.fromTo('#line2',{y:12},{y:0,duration:0.7,ease:'power2.inOut'},0.86);

  // ---- System closes: main ring, then outer hairline frame ----
  tl.fromTo('#ring',{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:0.75,ease:'power2.inOut'},1.0);
  tl.fromTo('#outer',{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:0.6,ease:'sine.inOut'},1.2);

  // ---- Amber rule grows, then supporting copy ----
  tl.fromTo('#rule',{scaleX:0},{scaleX:1,duration:0.4,ease:'power2.inOut'},1.38);
  tl.fromTo('#body',{opacity:0,y:8},{opacity:1,y:0,duration:0.45,ease:'sine.inOut'},1.58);
  tl.fromTo('#est',{opacity:0},{opacity:1,duration:0.4,ease:'sine.inOut'},1.8);

  // ---- Ambient ring words: only after the outer frame (container) completes at 1.8s ----
  tl.fromTo('#orbit',{opacity:0},{opacity:1,duration:0.4,ease:'sine.inOut'},1.84);
  tl.fromTo('#orbit',{rotation:-7,svgOrigin:'940 360'},{rotation:0,svgOrigin:'940 360',duration:2.5,ease:'sine.inOut',immediateRender:true},0.1);

  // Settled by 2.6s; hold to 3.0s.
  tl.to({}, {duration:0.001}, 2.999);
  window.__timelines=window.__timelines||{};
  window.__timelines.video=tl;
  tl.progress(0).pause();
})();
</script>

</html>
