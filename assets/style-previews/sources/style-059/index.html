<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-Poly 3D — An idea connects.</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2B464D; }
  #video { position: relative; width: 100%; height: 100%; overflow: hidden; background: #2B464D; }
  #lowpoly-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Flat 2D overlay, separate from the 3D world (source lesson: HUD/callout layer). */
  #copy-card {
    position: absolute; left: 64px; top: 120px; width: 470px; height: 316px;
    box-sizing: border-box; padding: 34px 36px 0 36px;
    background: rgba(24, 38, 43, 0.80); border-radius: 14px;
    border: 1px solid rgba(169, 203, 188, 0.28);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #F1EBDF;
  }
  .eyebrow { font-size: 16px; letter-spacing: 5px; color: #F2B65A; font-weight: 500; margin: 0 0 22px 0; }
  .h1 { font-size: 60px; line-height: 66px; margin: 0; }
  .h1.light { font-weight: 300; }
  .h1.bold { font-weight: 700; }
  .rule { width: 120px; height: 12px; margin: 22px 0 22px 0; background: #A9CBBC;
          clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%); }
  .sub { font-size: 20px; line-height: 26px; margin: 0; color: #F1EBDF; }
</style>
</head>
<body>
<div id="video" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="lowpoly-canvas" width="1280" height="720"></canvas>
  <div id="copy-card">
    <p class="eyebrow" data-reveal-after="copy-card">FACET ONE → NETWORK</p>
    <p class="h1 light" data-reveal-after="copy-card">An idea</p>
    <p class="h1 bold" data-reveal-after="copy-card">connects.</p>
    <div class="rule" data-reveal-after="copy-card"></div>
    <p class="sub" data-reveal-after="copy-card">One faceted core, five linked forms.</p>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script src="scene.bundle.js"></script>
<script>
(function () {
  var draw = window.__lowpoly.draw;
  // Single seekable owner: this paused GSAP timeline. The 3D scene state is a pure
  // function of tl.time(); DOM copy opacity/transform is owned by the tweens below.
  var tl = gsap.timeline({ paused: true });
  var origRender = tl.render;
  tl.render = function () {
    var r = origRender.apply(tl, arguments);
    draw(tl.time());
    return r;
  };

  var card = document.getElementById('copy-card');
  var labels = card.querySelectorAll('[data-reveal-after="copy-card"]');
  gsap.set(card, { opacity: 0, x: -24 });
  gsap.set(labels, { opacity: 0, y: 10 });

  // Card (container) completes by 0.55 s; its labels start only afterwards.
  tl.to(card, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 0.15);
  tl.to(labels[0], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.56);
  tl.to([labels[1], labels[2]], { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.12 }, 0.66);
  tl.to(labels[3], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 1.0);
  tl.to(labels[4], { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.12);
  // Pin the timeline length to the composition duration (3D actions are evaluated from tl.time()).
  tl.to({}, { duration: 0.001 }, 2.999);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  function sync() { draw(tl.time()); }
  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : null;
    if (t !== null && Math.abs(t - tl.time()) > 1e-6) tl.seek(t, false);
    sync();
  });
  tl.seek(0, false);
  sync();
})();
</script>

</html>
