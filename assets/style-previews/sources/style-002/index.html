<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{width:1280px;height:720px;display:block}</style></head><body><div data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><pattern id="g" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0V120H0" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.12"></path></pattern><circle id="n" r="14" fill="#000000"></circle></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-demo-actor="demo-actor-1"></rect><rect width="1280" height="720" fill="url(#g)" data-demo-actor="demo-actor-2"></rect><circle cx="300" cy="360" r="120" fill="#D62828" data-demo-actor="demo-actor-3"></circle><circle cx="300" cy="360" r="40" fill="#FFFFFF" data-demo-actor="demo-actor-4"></circle><rect x="720" y="120" width="120" height="120" fill="#F2C230" data-demo-actor="demo-actor-5"></rect><rect x="750" y="150" width="60" height="60" fill="#F2C230" stroke="#000000" stroke-width="4" transform="rotate(45 780 180)" data-demo-actor="demo-actor-6"></rect><path d="M960 600L1080 360L1200 600Z" fill="#164B9B" data-demo-actor="demo-actor-7"></path><path d="M780 600a60 60 0 0 1 120 0Z" fill="#D62828" data-demo-actor="demo-actor-8"></path><path d="M420 360H600V600H1080M600 360V180H720M1080 600V480" fill="none" stroke="#000000" stroke-width="8" data-demo-actor="demo-actor-9"></path><use href="#n" x="600" y="360" data-demo-actor="demo-actor-10"></use><use href="#n" x="600" y="600" data-demo-actor="demo-actor-11"></use><use href="#n" x="720" y="180" data-demo-actor="demo-actor-12"></use><use href="#n" x="1080" y="600" data-demo-actor="demo-actor-13"></use><use href="#n" x="1080" y="480" data-demo-actor="demo-actor-14"></use><rect x="120" y="588" width="360" height="12" fill="#000000" data-demo-actor="demo-actor-15"></rect><text x="120" y="120" font-family="Futura, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" fill="#000000" letter-spacing="6" data-demo-actor="demo-actor-16">IDEA</text><text x="120" y="150" font-family="Futura, Helvetica, Arial, sans-serif" font-size="18" fill="#D62828" letter-spacing="8" data-demo-actor="demo-actor-17">ONE POINT</text><text x="120" y="640" font-family="Futura, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#000000" letter-spacing="6" data-demo-actor="demo-actor-18">BECOMES A CONNECTED SYSTEM</text><text x="1160" y="110" text-anchor="end" font-family="Futura, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#164B9B" letter-spacing="8" data-demo-actor="demo-actor-19">1 / 5</text></svg></div><script src="gsap.min.js"></script><script src="chroma.min.js"></script><script>
const plan={"styleId":"style-002","selectedReferenceIds":[],"rationale":"Bauhaus poster on a 120 px grid: a red ring, a yellow square holding an outlined diamond, a blue triangle and a red semicircle, all joined by a black orthogonal connector with round nodes. The poster builds up in rhythmic stages. The ring grows in, then the stroked connector draws from it, then the yellow square grows with the diamond turning into place on the same beat, and finally the triangle grows. The diamond keeps its authored rotate(45) inside a wrapper. The triangle and semicircle touch the baseline, so they get no translation, and the semicircle and nodes stay fixed as anchors. The grid, background and type stay fixed. No reference fits this poster assembly.","tracks":[{"actorId":"demo-actor-3","role":"Red ring grows in as the single idea","action":"reveal","start":0,"duration":0.6,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}},{"actorId":"demo-actor-9","role":"Black connector draws from ring to the other forms","action":"draw","start":0.4,"duration":0.8,"ease":"power2.inOut","pose":{"x":0,"y":0,"scale":1,"rotation":0,"opacity":1}},{"actorId":"demo-actor-5","role":"Yellow square grows at the connector's end","action":"reveal","start":0.85,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":-15,"opacity":0}},{"actorId":"demo-actor-6","role":"Diamond rotates into its square","action":"reveal","start":0.95,"duration":0.5,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":15,"opacity":0}},{"actorId":"demo-actor-7","role":"Blue triangle grows on the baseline","action":"reveal","start":1.25,"duration":0.6,"ease":"back.out(1.2)","pose":{"x":0,"y":0,"scale":0.7,"rotation":0,"opacity":0}}]};
const svg=document.querySelector('svg');
const foreground="#000000";
const background="#FFFFFF";
const seenText=new Map();
Array.from(svg.querySelectorAll('text')).forEach(el=>{
 const label=el.textContent.trim();const prior=seenText.get(label);
 if(prior && Math.abs(Number(prior.getAttribute('x'))-Number(el.getAttribute('x')))<12 && Math.abs(Number(prior.getAttribute('y'))-Number(el.getAttribute('y')))<12) prior.remove();
 seenText.set(label,el);
 // Preserve authored baselines. Tight headline leading can overlap font em-boxes
 // without overlapping visible glyphs; annotate only baseline gaps of at least one em.
 const fontSize=Number(getComputedStyle(el).fontSize.replace('px',''));
 const fill=getComputedStyle(el).fill;
 if(fontSize<24 && chroma.valid(fill) && chroma(fill).hex()!==chroma(background).hex() && chroma.contrast(fill,background)<4.5){el.setAttribute('fill',foreground);el.setAttribute('opacity','1');el.setAttribute('fill-opacity','1');}
 if(fontSize>=36){
  for(const sibling of Array.from(el.parentElement.querySelectorAll(':scope > text'))){
   if(sibling===el)continue;
   const gap=Math.abs(Number(sibling.getAttribute('y'))-Number(el.getAttribute('y')));
   if(gap>=fontSize && gap<=fontSize*1.3 && Math.abs(Number(sibling.getAttribute('x'))-Number(el.getAttribute('x')))<12){el.setAttribute('data-layout-allow-overlap','true');sibling.setAttribute('data-layout-allow-overlap','true');}
  }
 }
 // Outlined display lettering needs a readable fill as well as its decorative outline.
 if(el.getAttribute('stroke') && el.getAttribute('stroke')!=='none') {el.setAttribute('fill',foreground);el.setAttribute('stroke',background);}
});

const timeline=gsap.timeline({paused:true});
const chosen=plan.tracks.map(track=>({track,element:document.querySelector('[data-demo-actor="'+track.actorId+'"]')}));
if(chosen.some(item=>!item.element))throw Error('Motion references an absent actor');
for(const item of chosen){
 if(chosen.some(other=>other!==item&&other.element.contains(item.element)))throw Error('Nested motion actors would double-transform artwork');
 const el=item.element;
 if(el.tagName==='rect' && Number(el.getAttribute('width'))>=1200 && Number(el.getAttribute('height'))>=650)throw Error('Background cannot be a motion actor');
 const wrapper=document.createElementNS('http://www.w3.org/2000/svg','g');
 el.parentNode.insertBefore(wrapper,el);wrapper.appendChild(el);
 wrapper.setAttribute('data-demo-motion',item.track.actorId);
 // Animate a neutral wrapper, never overwrite the artwork's authored matrix.
 gsap.set(wrapper,{transformOrigin:'50% 50%'});
 if(item.track.action==='reveal'){
   gsap.set(wrapper,item.track.pose);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:item.track.ease},item.track.start);
 }else if(item.track.action==='draw'){
   const paths=Array.from(el.matches('path,line,polyline,polygon')?[el]:el.querySelectorAll('path,line,polyline,polygon'));
   const drawable=paths.filter(p=>getComputedStyle(p).fill==='none' && getComputedStyle(p).stroke!=='none' && typeof p.getTotalLength==='function');
   if(!drawable.length)throw Error('Draw action needs visible unfilled stroked paths');
   for(const path of drawable){const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});timeline.to(path,{strokeDashoffset:0,duration:item.track.duration,ease:item.track.ease},item.track.start);}
 }else{
   timeline.to(wrapper,{...item.track.pose,duration:item.track.duration,ease:item.track.ease},item.track.start);
   timeline.to(wrapper,{x:0,y:0,scale:1,rotation:0,opacity:1,duration:item.track.duration,ease:'sine.inOut'},Math.min(2.7-item.track.duration,item.track.start+item.track.duration+.2));
 }
}
timeline.to({}, {duration:.001},2.999);window.__timelines={video:timeline};
</script></body></html>
